<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f2ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Tracker">

<title>Study Tracker</title>

<link rel="manifest" href="./manifest.json">

<style>
:root{
  --bg:#f4f2ea;
  --paper:rgba(255,253,247,.92);
  --ink:#232520;
  --muted:#6b6d63;
  --border:rgba(35,37,32,.14);
  --border2:rgba(35,37,32,.28);

  --physics:#3d5a80;
  --maths:#d4a900;
  --chemistry:#b94a48;
  --biology:#4f8a5b;

  --user-bg:none;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  min-height:100%;
  margin:0;
}

html{
  background:var(--bg);
}

body{
  color:var(--ink);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;

  background-color:var(--bg);
  background-image:var(--user-bg);
  background-size:cover;
  background-position:center top;
  background-repeat:no-repeat;
  background-attachment:scroll;

  overscroll-behavior-x:none;
}

button,
input{
  font:inherit;
}

button{
  -webkit-appearance:none;
  appearance:none;
  border-radius:0;
}

input{
  -webkit-appearance:none;
  appearance:none;
}

.wrap{
  width:min(1000px,100%);
  margin:auto;

  padding:
    max(28px,env(safe-area-inset-top))
    20px
    max(70px,calc(40px + env(safe-area-inset-bottom)));
}

.display{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;
}

.mono{
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;
}

/* =========================================================
   TOP
========================================================= */

.topbar{
  margin-bottom:25px;
}

.brand{
  font:
    600 34px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;

  margin:0;
  outline:0;
  border-radius:8px;

  padding:2px 6px;
  margin-left:-6px;
}

.brand:hover,
.brand:focus{
  background:rgba(255,253,247,.78);
  box-shadow:
    0 4px 15px
    rgba(35,37,32,.08);
}

/* =========================================================
   STATS
========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);

  background:var(--paper);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);
  border-radius:16px;

  overflow:hidden;

  margin:20px 0 27px;

  box-shadow:
    0 9px 25px
    rgba(35,37,32,.07);
}

.stat{
  padding:16px;
  border-right:1px solid var(--border);

  transition:.2s;
}

.stat:last-child{
  border-right:0;
}

.stat:hover{
  background:rgba(255,255,255,.45);
}

.stat-num{
  font:
    600 28px
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;
}

.stat-label{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

/* =========================================================
   PAGE ANIMATION
========================================================= */

.page-enter{
  animation:
    pageEnter
    .35s
    cubic-bezier(.2,.8,.2,1)
    both;
}

@keyframes pageEnter{

  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* =========================================================
   TAB / CARD POP
========================================================= */

.pop-target{
  animation:
    tabPop
    .18s
    cubic-bezier(.2,.9,.25,1)
    both !important;

  transform-origin:center center;
  will-change:transform;
}

@keyframes tabPop{

  0%{
    transform:scale(1);
  }

  45%{
    transform:scale(.955);
  }

  100%{
    transform:scale(1.025);
  }

}

/* =========================================================
   RIPPLE
========================================================= */

.ripple{
  position:absolute;

  left:0;
  top:0;

  width:20px;
  height:20px;

  border-radius:50%;

  pointer-events:none;

  background:var(--tint);

  opacity:0;

  transform:
    translate3d(-50%,-50%,0)
    scale(0);

  transform-origin:center center;

  z-index:1;

  will-change:
    transform,
    opacity;

  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}

/* =========================================================
   HOME SUBJECT CARDS
========================================================= */

.tiles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.tile{
  --tint:var(--physics);

  position:relative;
  overflow:hidden;
  isolation:isolate;

  width:100%;

  background:var(--paper);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);
  border-left:5px solid var(--tint);

  border-radius:16px;

  padding:22px;

  text-align:left;

  cursor:pointer;

  color:var(--ink);

  box-shadow:
    0 9px 24px
    rgba(35,37,32,.07);

  transition:
    transform .18s,
    box-shadow .18s;

  animation:
    rise
    .45s
    both;

  touch-action:manipulation;

  -webkit-user-select:none;
  user-select:none;
}

.tile>*{
  position:relative;
  z-index:2;
}

.tile::after{
  content:"";

  position:absolute;

  width:155px;
  height:155px;

  border-radius:50%;

  right:-70px;
  bottom:-90px;

  background:var(--tint);

  opacity:.055;

  pointer-events:none;
}

.tile:active{
  transform:scale(.985);
}

.tile-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;
}

.tile-name{
  font:
    600 22px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;
}

.tile-pct{
  font:
    600 15px
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  color:var(--tint);
}

.bar{
  height:7px;

  margin-top:18px;

  background:
    rgba(35,37,32,.08);

  border-radius:999px;

  overflow:hidden;
}

.bar>div{
  height:100%;

  width:0;

  background:var(--tint);

  border-radius:999px;

  transition:
    width .25s
    ease;
}

.tile-meta{
  display:flex;
  justify-content:space-between;

  gap:10px;

  margin-top:12px;

  color:var(--muted);

  font-size:12px;
}

/* =========================================================
   SUBJECT PAGE
========================================================= */

.back{
  display:block;

  width:100%;

  background:var(--paper);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);

  border-radius:12px;

  padding:12px 15px;

  margin-bottom:12px;

  text-align:left;

  color:var(--ink);

  font:
    600 21px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;

  cursor:pointer;

  box-shadow:
    0 5px 16px
    rgba(35,37,32,.06);

  touch-action:manipulation;
}

.back:active{
  transform:scale(.99);
}

.subject-head{
  --tint:var(--physics);

  position:relative;

  background:var(--paper);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);
  border-left:5px solid var(--tint);

  border-radius:16px;

  padding:20px;

  margin-bottom:20px;

  box-shadow:
    0 9px 24px
    rgba(35,37,32,.07);
}

.subject-title{
  margin:0;

  font:
    600 30px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;
}

/* =========================================================
   YEAR TABS
========================================================= */

.year-tabs{
  --tint:var(--physics);

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.year-tab{
  --tint:var(--physics);

  position:relative;
  overflow:hidden;

  background:var(--paper);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);
  border-left:5px solid var(--tint);

  border-radius:16px;

  padding:21px;

  text-align:left;

  color:var(--ink);

  cursor:pointer;

  box-shadow:
    0 9px 24px
    rgba(35,37,32,.07);

  transition:
    transform .18s,
    box-shadow .18s;

  animation:
    rise
    .45s
    both;

  touch-action:manipulation;
}

.year-tab:active{
  transform:scale(.985);
}

.year-tab>*{
  position:relative;
  z-index:2;
}

.year-name{
  display:block;

  font:
    600 23px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;
}

.year-pct{
  display:block;

  margin-top:11px;

  color:var(--tint);

  font:
    600 18px
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;
}

.year-meta{
  display:block;

  margin-top:7px;

  color:var(--muted);

  font-size:12px;
}

/* =========================================================
   CHAPTER SECTION
========================================================= */

.chapter-toolbar{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin:
    22px 0 13px;
}

.chapter-section-title{
  font:
    600 20px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;
}

.add-chapter-button{
  --tint:var(--physics);

  width:42px;
  height:42px;

  flex:0 0 42px;

  border-radius:50%;

  border:1px solid var(--border2);

  background:var(--paper);

  color:var(--tint);

  font-size:27px;
  line-height:1;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  box-shadow:
    0 5px 15px
    rgba(35,37,32,.07);

  touch-action:manipulation;
}

.add-chapter-button:active{
  transform:scale(.94);
}

/* =========================================================
   SEARCH
========================================================= */

.search-wrap{
  margin:
    20px 0 0;
}

.search{
  width:100%;

  height:45px;

  border:
    1px solid
    var(--border2);

  border-radius:10px;

  background:
    var(--paper);

  color:var(--ink);

  padding:
    0 13px;

  outline:none;
}

.search::placeholder{
  color:#8a8b84;
}

/* =========================================================
   CHAPTER GRID
========================================================= */

.chapters{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:13px;
}

.chapter{
  --tint:var(--physics);

  position:relative;
  overflow:hidden;

  background:var(--paper);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);
  border-left:4px solid var(--tint);

  border-radius:15px;

  padding:16px;

  box-shadow:
    0 8px 21px
    rgba(35,37,32,.06);

  animation:
    rise
    .4s
    both;
}

.chapter-head{
  display:flex;

  justify-content:space-between;

  gap:10px;
}

.chapter-title{
  font:
    600 16px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;

  line-height:1.35;

  overflow-wrap:anywhere;
}

.chapter-actions{
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:8px;
}

.linkbtn{
  border:0;

  background:none;

  padding:0;

  color:var(--muted);

  font-size:11px;

  cursor:pointer;
}

.linkbtn:active{
  color:var(--ink);
}

.chapter-progress{
  white-space:nowrap;

  font:
    600 13px
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  color:var(--muted);
}

.row-label{
  color:var(--muted);

  font-size:11px;

  margin-top:12px;
}

.dots{
  display:flex;

  flex-wrap:wrap;

  gap:6px;

  margin-top:8px;
}

.dot{
  width:30px;
  height:30px;

  padding:0;

  border-radius:50%;

  border:
    1px solid
    var(--border2);

  background:
    rgba(255,255,255,.25);

  color:var(--muted);

  font-size:10px;

  cursor:pointer;

  transition:
    background .15s,
    color .15s,
    border-color .15s,
    transform .12s;
}

.dot.done{
  background:var(--tint);

  border-color:var(--tint);

  color:#fff;
}

.dot:active{
  transform:scale(.9);
}

.stars{
  display:flex;

  gap:2px;

  margin-top:5px;
}

.star{
  border:0;

  background:none;

  padding:0;

  width:24px;
  height:24px;

  color:
    rgba(35,37,32,.22);

  font-size:21px;

  line-height:1;

  cursor:pointer;

  transition:
    color .15s,
    transform .12s;
}

.star.on{
  color:#d4a900;
}

.star:active{
  transform:scale(.88);
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
  grid-column:1/-1;

  padding:34px 4px;

  color:var(--muted);

  font:
    italic 16px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;
}

/* =========================================================
   SETTINGS
========================================================= */

.settings-panel{
  margin-top:30px;

  background:var(--paper);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:
    1px solid
    var(--border2);

  border-radius:16px;

  padding:16px;

  box-shadow:
    0 9px 25px
    rgba(35,37,32,.07);
}

.settings-head{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:11px;
}

.settings-title{
  font:
    600 19px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;
}

.settings-sub{
  font-size:12px;

  color:var(--muted);
}

.settings-icon{
  font-size:20px;

  opacity:.55;
}

.settings-actions{
  display:flex;

  gap:8px;

  flex-wrap:wrap;
}

.ghost{
  background:var(--paper);

  border:
    1px solid
    var(--border2);

  border-radius:8px;

  padding:8px 11px;

  cursor:pointer;

  color:var(--ink);
}

.ghost:hover{
  border-color:var(--ink);
}

.ghost:active{
  transform:scale(.98);
}

.danger{
  opacity:.75;
}

.fileinput{
  display:none;
}

/* =========================================================
   MODAL
========================================================= */

.modal-backdrop{
  position:fixed;

  inset:0;

  z-index:100;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:
    20px
    max(20px,env(safe-area-inset-right))
    max(20px,env(safe-area-inset-bottom))
    max(20px,env(safe-area-inset-left));

  background:
    rgba(35,37,32,.28);

  -webkit-backdrop-filter:blur(5px);
  backdrop-filter:blur(5px);

  animation:
    modalFade
    .18s
    ease both;
}

.modal{
  width:min(440px,100%);

  background:
    #fffdf7;

  border:
    1px solid
    var(--border2);

  border-radius:18px;

  padding:19px;

  box-shadow:
    0 20px 50px
    rgba(35,37,32,.18);

  animation:
    modalUp
    .22s
    cubic-bezier(.2,.8,.2,1)
    both;
}

.modal-title{
  font:
    600 20px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;
}

.modal-sub{
  margin-top:3px;

  color:var(--muted);

  font-size:12px;
}

.modal-fields{
  display:grid;

  gap:10px;

  margin-top:15px;
}

.modal-input{
  width:100%;

  height:45px;

  border:
    1px solid
    var(--border2);

  border-radius:9px;

  background:#fff;

  color:var(--ink);

  padding:
    0 12px;

  outline:none;
}

.modal-actions{
  display:flex;

  justify-content:flex-end;

  gap:8px;

  margin-top:14px;
}

.primary{
  background:var(--ink);

  border:
    1px solid
    var(--ink);

  color:#fff;

  border-radius:8px;

  padding:9px 13px;

  cursor:pointer;
}

@keyframes modalFade{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}

@keyframes modalUp{
  from{
    opacity:0;
    transform:
      translateY(15px)
      scale(.97);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }
}

/* =========================================================
   ANIMATION
========================================================= */

@keyframes rise{

  0%{
    opacity:0;

    transform:
      translateY(16px)
      scale(.96);
  }

  55%{
    opacity:1;

    transform:
      translateY(-4px)
      scale(1.02);
  }

  80%{
    transform:
      translateY(1px)
      scale(.995);
  }

  100%{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }

}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:720px){

  .wrap{
    padding-left:15px;
    padding-right:15px;
  }

  .brand{
    font-size:30px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .stat:nth-child(2){
    border-right:0;
  }

  .stat:nth-child(-n+2){
    border-bottom:
      1px solid
      var(--border);
  }

  .tiles,
  .year-tabs{
    grid-template-columns:1fr;
  }

  /*
    IMPORTANT:
    Chapters intentionally remain TWO columns
    on iPhone, as requested.
  */

  .chapters{
    grid-template-columns:1fr 1fr;
  }

  .subject-title{
    font-size:28px;
  }

  .chapter-head{
    align-items:flex-start;
  }

  .chapter-progress{
    white-space:nowrap;
  }

  .modal{
    border-radius:18px;
    padding:19px;
  }

  .settings-actions{
    display:grid;

    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:390px){

  .chapters{
    gap:9px;
  }

  .chapter{
    padding:13px 11px;
  }

  .chapter-title{
    font-size:14px;
  }

  .dot{
    width:27px;
    height:27px;
  }

  .star{
    width:22px;
    height:22px;
    font-size:19px;
  }

}

@media(prefers-reduced-motion:reduce){

  .page-enter,
  .pop-target,
  .modal-backdrop,
  .modal,
  .tile,
  .year-tab,
  .chapter{
    animation-duration:.001ms!important;
  }

  *{
    transition-duration:.001ms!important;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <div id="app"></div>

  <input
    id="importFile"
    class="fileinput"
    type="file"
    accept="application/json"
  >

  <input
    id="bgFile"
    class="fileinput"
    type="file"
    accept="image/*"
  >

</div>

<script>
(function(){

"use strict";

/* =========================================================
   CONSTANTS
========================================================= */

const SUBJECTS = [
  {
    key:"physics",
    name:"Physics",
    color:"var(--physics)"
  },
  {
    key:"maths",
    name:"Maths",
    color:"var(--maths)"
  },
  {
    key:"chemistry",
    name:"Chemistry",
    color:"var(--chemistry)"
  },
  {
    key:"biology",
    name:"Biology",
    color:"var(--biology)"
  }
];

const YEARS = [
  "11th",
  "12th"
];

const DB_NAME =
  "StudyTrackerLocalDB";

const DB_VERSION =
  2;

const STORE_NAME =
  "app";

const TRACKER_KEY =
  "tracker";

const BACKGROUND_KEY =
  "background";

/* =========================================================
   STATE
========================================================= */

let settings = {
  title:"Study Tracker"
};

let state = {
  view:"home",
  subject:null,
  year:null,
  background:null,
  data:{}
};

let saveTimer = null;

/* =========================================================
   INDEXED DB
========================================================= */

function openDB(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );

      request.onupgradeneeded =
        function(){

          const db =
            request.result;

          if(
            !db.objectStoreNames
              .contains(STORE_NAME)
          ){

            db.createObjectStore(
              STORE_NAME
            );

          }

        };

      request.onsuccess =
        function(){

          resolve(
            request.result
          );

        };

      request.onerror =
        function(){

          reject(
            request.error
          );

        };

    }
  );
}

async function dbGet(key){

  const db =
    await openDB();

  return new Promise(
    (resolve,reject)=>{

      const tx =
        db.transaction(
          STORE_NAME,
          "readonly"
        );

      const request =
        tx
          .objectStore(STORE_NAME)
          .get(key);

      request.onsuccess =
        function(){

          resolve(
            request.result
          );

        };

      request.onerror =
        function(){

          reject(
            request.error
          );

        };

    }
  );
}

async function dbSet(
  key,
  value
){

  const db =
    await openDB();

  return new Promise(
    (resolve,reject)=>{

      const tx =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );

      tx
        .objectStore(STORE_NAME)
        .put(
          value,
          key
        );

      tx.oncomplete =
        function(){

          resolve();

        };

      tx.onerror =
        function(){

          reject(
            tx.error
          );

        };

    }
  );
}

/* =========================================================
   DATA
========================================================= */

function uid(){

  return (
    "id_" +
    Math.random()
      .toString(36)
      .slice(2,10)
  );
}

function blankData(){

  const data = {};

  SUBJECTS.forEach(
    subject=>{

      data[subject.key] = {
        years:{
          "11th":{
            chapters:[]
          },
          "12th":{
            chapters:[]
          }
        }
      };

    }
  );

  return data;
}

function normalizeChapter(
  chapter
){

  const source =
    chapter &&
    typeof chapter === "object"
      ? chapter
      : {};

  return {

    id:
      source.id ||
      uid(),

    name:
      String(
        source.name ||
        "Chapter"
      ),

    totalLectures:
      Math.max(
        1,
        Number(
          source.totalLectures ??
          source.lectures
        ) || 1
      ),

    completedLectures:
      Math.max(
        0,
        Number(
          source.completedLectures ??
          source.completed
        ) || 0
      ),

    confidence:
      Math.min(
        5,
        Math.max(
          0,
          Number(
            source.confidence
          ) || 0
        )
      )

  };
}

function extractChapters(
  yearData
){

  if(
    !yearData ||
    typeof yearData !== "object"
  ){

    return [];

  }

  /*
    Current format:
    years[year].chapters
  */

  if(
    Array.isArray(
      yearData.chapters
    )
  ){

    return yearData.chapters.map(
      normalizeChapter
    );

  }

  /*
    Old format:
    years[year].units[].chapters

    Old units are flattened.
  */

  if(
    Array.isArray(
      yearData.units
    )
  ){

    const chapters = [];

    yearData.units.forEach(
      unit=>{

        if(
          !unit ||
          !Array.isArray(
            unit.chapters
          )
        ){

          return;

        }

        unit.chapters.forEach(
          chapter=>{
            chapters.push(
              normalizeChapter(
                chapter
              )
            );
          }
        );

      }
    );

    return chapters;

  }

  return [];
}

function normalizeData(
  source
){

  const fresh =
    blankData();

  if(
    !source ||
    typeof source !== "object"
  ){

    return fresh;

  }

  SUBJECTS.forEach(
    subject=>{

      const incoming =
        source[
          subject.key
        ];

      if(
        !incoming ||
        typeof incoming !== "object"
      ){

        return;

      }

      YEARS.forEach(
        year=>{

          const incomingYear =
            incoming
              .years
              ?.[
                year
              ];

          fresh[
            subject.key
          ]
          .years[
            year
          ]
          .chapters =
            extractChapters(
              incomingYear
            );

        }
      );

      /*
        Also support the earlier flat format.
      */

      if(
        Array.isArray(
          incoming.chapters
        )
      ){

        fresh[
          subject.key
        ]
        .years["11th"]
        .chapters =
          incoming.chapters.map(
            normalizeChapter
          );

      }

    }
  );

  return fresh;
}

function allChapters(
  key,
  year
){

  const result = [];

  const years =
    year
      ? [year]
      : YEARS;

  const subject =
    state.data[key];

  if(
    !subject ||
    !subject.years
  ){

    return result;

  }

  years.forEach(
    currentYear=>{

      const chapters =
        subject
          .years[
            currentYear
          ]
          ?.chapters || [];

      result.push(
        ...chapters
      );

    }
  );

  return result;
}

/* =========================================================
   STATS
========================================================= */

function stats(
  chapters
){

  let total = 0;
  let done = 0;
  let finished = 0;

  let confidenceSum = 0;
  let confidenceCount = 0;

  chapters.forEach(
    chapter=>{

      const totalLectures =
        Math.max(
          0,
          Number(
            chapter.totalLectures
          ) || 0
        );

      const completedLectures =
        Math.min(
          totalLectures,
          Math.max(
            0,
            Number(
              chapter.completedLectures
            ) || 0
          )
        );

      total +=
        totalLectures;

      done +=
        completedLectures;

      if(
        totalLectures > 0 &&
        completedLectures ===
          totalLectures
      ){

        finished++;

      }

      if(
        Number(
          chapter.confidence
        ) > 0
      ){

        confidenceSum +=
          Number(
            chapter.confidence
          );

        confidenceCount++;

      }

    }
  );

  return {

    total,
    done,

    chapters:
      chapters.length,

    finished,

    pct:
      total
        ? Math.round(
            done /
            total *
            100
          )
        : 0,

    avgConf:
      confidenceCount
        ? confidenceSum /
          confidenceCount
        : 0

  };
}

function overall(){

  return stats(
    SUBJECTS.flatMap(
      subject =>
        allChapters(
          subject.key
        )
    )
  );

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      character => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#039;"

      }[character])
    );

}

async function load(){

  state.data =
    blankData();

  try{

    const stored =
      await dbGet(
        TRACKER_KEY
      );

    if(stored){

      if(
        stored.settings
      ){

        settings = {
          ...settings,
          ...stored.settings
        };

      }

      if(
        stored.data
      ){

        state.data =
          normalizeData(
            stored.data
          );

      }

    }

  }catch(error){

    console.warn(
      "Could not load tracker data.",
      error
    );

  }

  try{

    const background =
      await dbGet(
        BACKGROUND_KEY
      );

    if(
      typeof background ===
        "string" &&
      background
    ){

      state.background =
        background;

    }

  }catch(error){

    console.warn(
      "Could not load background.",
      error
    );

  }

}

/* =========================================================
   EXPORT
========================================================= */

function exportData(){

  const backup = {

    version:2,

    exportedAt:
      new Date()
        .toISOString(),

    settings,

    data:
      state.data,

    background:
      state.background

  };

  const blob =
    new Blob(
      [
        JSON.stringify(
          backup,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const anchor =
    document.createElement(
      "a"
    );

  anchor.href =
    url;

  anchor.download =
    "study-tracker-backup.json";

  document.body.appendChild(
    anchor
  );

  anchor.click();

  anchor.remove();

  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    100
  );

}

/* =========================================================
   IMPORT
========================================================= */

async function importData(
  file
){

  const reader =
    new FileReader();

  reader.onload =
    async function(){

      try{

        const backup =
          JSON.parse(
            reader.result
          );

        if(
          backup.settings
        ){

          settings = {
            ...settings,
            ...backup.settings
          };

        }

        const importedData =
          backup.data ||
          backup;

        state.data =
          normalizeData(
            importedData
          );

        if(
          typeof backup.background ===
            "string"
        ){

          state.background =
            backup.background;

          await dbSet(
            BACKGROUND_KEY,
            state.background
          );

        }

        await dbSet(
          TRACKER_KEY,
          {
            settings,
            data:
              state.data
          }
        );

        applyBackground();

        state.view =
          "home";

        state.subject =
          null;

        state.year =
          null;

        render();

        alert(
          "Backup imported successfully."
        );

      }catch(error){

        console.error(
          error
        );

        alert(
          "Invalid backup file."
        );

      }

    };

  reader.readAsText(
    file
  );

}

          class="ghost"
          type="button"
        >
          Cancel
        </button>

        <button
          id="saveChapter"
          class="primary"
          type="button"
        >
          Add chapter
        </button>

      </div>

    </div>

  `;

  document.body.appendChild(
    backdrop
  );

  const nameInput =
    backdrop.querySelector(
      "#chapterName"
    );

  const lectureInput =
    backdrop.querySelector(
      "#lectureTotal"
    );

  const saveButton =
    backdrop.querySelector(
      "#saveChapter"
    );

  const cancelButton =
    backdrop.querySelector(
      "#cancelChapter"
    );

  function close(){

    backdrop.remove();

  }

  cancelButton.onclick =
    close;

  backdrop.addEventListener(
    "click",
    event=>{

      if(
        event.target ===
        backdrop
      ){

        close();

      }

    }
  );

  saveButton.onclick =
    async()=>{

      const name =
        nameInput.value.trim();

      const total =
        parseInt(
          lectureInput.value,
          10
        );

      if(!name){

        nameInput.focus();

        return;

      }

      if(
        !Number.isFinite(total) ||
        total < 1
      ){

        lectureInput.focus();

        return;

      }

      const yearData =
        state.data[
          state.subject
        ]
        .years[
          state.year
        ];

      yearData.chapters.push({

        id:uid(),

        name,

        totalLectures:
          Math.min(
            total,
            1000
          ),

        completedLectures:0,

        confidence:0

      });

      await dbSet(
        TRACKER_KEY,
        {
          settings,
          data:
            state.data
        }
      );

      close();

      render();

    };

  nameInput.addEventListener(
    "keydown",
    event=>{

      if(
        event.key ===
        "Enter"
      ){

        event.preventDefault();

        saveButton.click();

      }

      if(
        event.key ===
        "Escape"
      ){

        close();

      }

    }
  );

  setTimeout(
    ()=>{
      nameInput.focus();
    },
    80
  );

}

/* =========================================================
   UPDATE CHAPTER CARD
========================================================= */

function updateChapterCard(
  card,
  chapter
){

  if(
    !card ||
    !chapter
  ){

    return;

  }

  const percentage =
    chapter.totalLectures
      ? Math.round(
          chapter.completedLectures /
          chapter.totalLectures *
          100
        )
      : 0;

  const progress =
    card.querySelector(
      ".chapter-progress"
    );

  if(progress){

    progress.textContent =
      `${chapter.completedLectures}/${chapter.totalLectures}`;

  }

  const fill =
    card.querySelector(
      ".bar > div"
    );

  if(fill){

    fill.style.width =
      percentage + "%";

  }

  const labels =
    card.querySelectorAll(
      ".row-label"
    );

  if(labels[0]){

    labels[0].textContent =
      `Lecture progress · ${percentage}%`;

  }

  if(labels[1]){

    labels[1].textContent =
      `Confidence · ${
        chapter.confidence
          ? chapter.confidence + "/5"
          : "Not rated"
      }`;

  }

  card
    .querySelectorAll(
      '.dot[data-action="lecture"]'
    )
    .forEach(
      dot=>{

        const index =
          Number(
            dot.dataset.index
          );

        dot.classList.toggle(
          "done",
          index <
            chapter.completedLectures
        );

      }
    );

  card
    .querySelectorAll(
      '.star[data-action="confidence"]'
    )
    .forEach(
      star=>{

        star.classList.toggle(
          "on",
          Number(
            star.dataset.value
          ) <=
            chapter.confidence
        );

      }
    );

}

/* =========================================================
   UPDATE VISIBLE STATS
========================================================= */

function updateVisibleStats(){

  if(
    state.view !== "year"
  ){

    return;

  }

  const statsElement =
    document.querySelector(
      ".stats"
    );

  if(!statsElement){
    return;
  }

  const cards =
    Array.from(
      document.querySelectorAll(
        ".chapter"
      )
    );

  let total = 0;
  let done = 0;
  let finished = 0;

  let confidenceSum = 0;
  let confidenceCount = 0;

  cards.forEach(
    card=>{

      const progress =
        card.querySelector(
          ".chapter-progress"
        );

      if(progress){

        const match =
          progress.textContent
            .trim()
            .match(
              /^(\d+)\s*\/\s*(\d+)$/
            );

        if(match){

          const completed =
            Number(
              match[1]
            );

          const lectures =
            Number(
              match[2]
            );

          total +=
            lectures;

          done +=
            Math.min(
              completed,
              lectures
            );

          if(
            lectures > 0 &&
            completed ===
              lectures
          ){

            finished++;

          }

        }

      }

      const selectedStars =
        card.querySelectorAll(
          ".star.on"
        ).length;

      if(
        selectedStars > 0
      ){

        confidenceSum +=
          selectedStars;

        confidenceCount++;

      }

    }
  );

  const percentage =
    total
      ? Math.round(
          done /
          total *
          100
        )
      : 0;

  const averageConfidence =
    confidenceCount
      ? confidenceSum /
        confidenceCount
      : 0;

  const values =
    statsElement.querySelectorAll(
      ".stat-num"
    );

  if(values[0]){

    values[0].textContent =
      percentage + "%";

  }

  if(values[1]){

    values[1].textContent =
      `${done}/${total}`;

  }

  if(values[2]){

    values[2].textContent =
      `${finished}/${cards.length}`;

  }

  if(values[3]){

    values[3].textContent =
      `${
        averageConfidence
          ? averageConfidence.toFixed(1)
          : "—"
      } / 5`;

  }

}

/* =========================================================
   RENDER
========================================================= */

function render(){

  const app =
    document.getElementById(
      "app"
    );

  if(!app){
    return;
  }

  let html = "";

  if(
    state.view ===
    "home"
  ){

    html =
      home();

  }else if(
    state.view ===
    "subject"
  ){

    html =
      subjectPage(
        state.subject
      );

  }else if(
    state.view ===
    "year"
  ){

    html =
      yearPage(
        state.subject,
        state.year
      );

  }else{

    state.view =
      "home";

    html =
      home();

  }

  app.innerHTML =
    html;

  const page =
    app.firstElementChild;

  if(page){

    page.classList.remove(
      "page-enter"
    );

    void page.offsetWidth;

    page.classList.add(
      "page-enter"
    );

  }

  bind();

  applyBackground();

}

/* =========================================================
   NAVIGATION
   IMPORTANT:
   No delayed navigation.
   No navigation lock.
   No animation dependency.
========================================================= */

function openSubject(
  key
){

  const subject =
    SUBJECTS.find(
      item =>
        item.key === key
    );

  if(!subject){
    return;
  }

  state.view =
    "subject";

  state.subject =
    key;

  state.year =
    null;

  render();

  window.scrollTo(
    0,
    0
  );

}

function openYear(
  year
){

  if(
    YEARS.indexOf(year) ===
    -1
  ){

    return;

  }

  if(
    !state.subject
  ){

    return;

  }

  state.view =
    "year";

  state.year =
    year;

  render();

  window.scrollTo(
    0,
    0
  );

}

function goHome(){

  state.view =
    "home";

  state.subject =
    null;

  state.year =
    null;

  render();

  window.scrollTo(
    0,
    0
  );

}

function goToSubject(){

  if(
    !state.subject
  ){

    goHome();

    return;

  }

  state.view =
    "subject";

  state.year =
    null;

  render();

  window.scrollTo(
    0,
    0
  );

}

/* =========================================================
   COMMON BINDINGS
========================================================= */

function bind(){

  /* -----------------------------------------------
     BRAND
  ------------------------------------------------ */

  const brand =
    document.getElementById(
      "brand"
    );

  if(brand){

    brand.addEventListener(
      "blur",
      ()=>{

        const title =
          brand.textContent
            .trim();

        if(title){

          settings.title =
            title;

        }else{

          brand.textContent =
            settings.title;

        }

        save();

      }
    );

    brand.addEventListener(
      "keydown",
      event=>{

        if(
          event.key ===
          "Enter"
        ){

          event.preventDefault();

          brand.blur();

        }

      }
    );

  }

  /* -----------------------------------------------
     SETTINGS
  ------------------------------------------------ */

  const exportButton =
    document.getElementById(
      "export"
    );

  if(exportButton){

    exportButton.onclick =
      exportData;

  }

  const importButton =
    document.getElementById(
      "import"
    );

  if(importButton){

    importButton.onclick =
      ()=>{

        document
          .getElementById(
            "importFile"
          )
          .click();

      };

  }

  const resetButton =
    document.getElementById(
      "reset"
    );

  if(resetButton){

    resetButton.onclick =
      resetAll;

  }

  const backgroundButton =
    document.getElementById(
      "bgBtn"
    );

  if(backgroundButton){

    backgroundButton.onclick =
      ()=>{

        document
          .getElementById(
            "bgFile"
          )
          .click();

      };

  }

  const clearBackground =
    document.getElementById(
      "clearBg"
    );

  if(clearBackground){

    clearBackground.onclick =
      async()=>{

        state.background =
          null;

        applyBackground();

        try{

          await dbDelete(
            BACKGROUND_KEY
          );

        }catch(error){

          console.error(
            "Could not clear background.",
            error
          );

        }

      };

  }

  /* -----------------------------------------------
     HOME SUBJECT NAVIGATION
  ------------------------------------------------ */

  if(
    state.view ===
    "home"
  ){

    document
      .querySelectorAll(
        "[data-subject]"
      )
      .forEach(
        button=>{

          button.addEventListener(
            "click",
            event=>{

              /*
                Visual animation only.
                Navigation happens immediately.
              */

              createRipple(
                button,
                event
              );

              openSubject(
                button.dataset.subject
              );

            }
          );

        }
      );

  }

  /* -----------------------------------------------
     SUBJECT PAGE
  ------------------------------------------------ */

  if(
    state.view ===
    "subject"
  ){

    const back =
      document.getElementById(
        "back"
      );

    if(back){

      back.onclick =
        goHome;

    }

    document
      .querySelectorAll(
        "[data-year]"
      )
      .forEach(
        button=>{

          button.addEventListener(
            "click",
            event=>{

              createRipple(
                button,
                event
              );

              openYear(
                button.dataset.year
              );

            }
          );

        }
      );

  }

  /* -----------------------------------------------
     YEAR PAGE
  ------------------------------------------------ */

  if(
    state.view ===
    "year"
  ){

    const back =
      document.getElementById(
        "back"
      );

    if(back){

      back.onclick =
        goToSubject;

    }

    const addChapterButton =
      document.getElementById(
        "addChapterButton"
      );

    if(addChapterButton){

      addChapterButton.onclick =
        event=>{

          createRipple(
            addChapterButton,
            event
          );

          setTimeout(
            createChapterModal,
            80
          );

        };

    }

    /* ---------------------------------------------
       SEARCH
    --------------------------------------------- */

    const search =
      document.getElementById(
        "chapterSearch"
      );

    if(search){

      search.addEventListener(
        "input",
        ()=>{

          const query =
            search.value
              .trim()
              .toLowerCase();

          document
            .querySelectorAll(
              ".chapter"
            )
            .forEach(
              card=>{

                const title =
                  card
                    .querySelector(
                      ".chapter-title"
                    )
                    ?.textContent
                    .toLowerCase() ||
                  "";

                card.style.display =
                  !query ||
                  title.includes(query)
                    ? ""
                    : "none";

              }
            );

        }
      );

    }

    /* ---------------------------------------------
       CHAPTER ACTIONS
    --------------------------------------------- */

    const chapters =
      document.querySelector(
        ".chapters"
      );

    if(chapters){

      chapters.addEventListener(
        "click",
        event=>{

          const button =
            event.target.closest(
              "[data-action]"
            );

          if(!button){
            return;
          }

          const yearData =
            state.data[
              state.subject
            ]
            ?.years[
              state.year
            ];

          if(!yearData){
            return;
          }

          const chapter =
            yearData.chapters.find(
              item =>
                item.id ===
                button.dataset.id
            );

          if(!chapter){
            return;
          }

          const action =
            button.dataset.action;

          /* ---------------------------------------
             LECTURE
          --------------------------------------- */

          if(
            action ===
            "lecture"
          ){

            const index =
              Number(
                button.dataset.index
              );

            chapter.completedLectures =
              (
                index + 1 ===
                chapter.completedLectures
              )
                ? index
                : index + 1;

            chapter.completedLectures =
              Math.min(
                chapter.completedLectures,
                chapter.totalLectures
              );

            save();

            updateChapterCard(
              button.closest(
                ".chapter"
              ),
              chapter
            );

            updateVisibleStats();

            return;

          }

          /* ---------------------------------------
             CONFIDENCE
          --------------------------------------- */

          if(
            action ===
            "confidence"
          ){

            const value =
              Number(
                button.dataset.value
              );

            chapter.confidence =
              chapter.confidence ===
              value
                ? 0
                : value;

            save();

            updateChapterCard(
              button.closest(
                ".chapter"
              ),
              chapter
            );

            updateVisibleStats();

            return;

          }

          /* ---------------------------------------
             RENAME
          --------------------------------------- */

          if(
            action ===
            "rename"
          ){

            const nextName =
              prompt(
                "Rename chapter:",
                chapter.name
              );

            if(
              nextName ===
              null
            ){

              return;

            }

            const clean =
              nextName.trim();

            if(!clean){

              return;

            }

            chapter.name =
              clean;

            save();

            render();

            return;

          }

          /* ---------------------------------------
             EDIT LECTURE TOTAL
          --------------------------------------- */

          if(
            action ===
            "edit-total"
          ){

            const raw =
              prompt(
                "Total lectures:",
                chapter.totalLectures
              );

            if(
              raw ===
              null
            ){

              return;

            }

            const total =
              parseInt(
                raw,
                10
              );

            if(
              !Number.isFinite(total) ||
              total < 1
            ){

              return;

            }

            chapter.totalLectures =
              Math.min(
                total,
                1000
              );

            chapter.completedLectures =
              Math.min(
                chapter.completedLectures,
                chapter.totalLectures
              );

            save();

            render();

            return;

          }

          /* ---------------------------------------
             DELETE
          --------------------------------------- */

          if(
            action ===
            "delete"
          ){

            if(
              !confirm(
                "Delete this chapter?"
              )
            ){

              return;

            }

            yearData.chapters =
              yearData.chapters.filter(
                item =>
                  item.id !==
                  chapter.id
              );

            save();

            render();

          }

        }
      );

    }

  }

}

/* =========================================================
   FILE INPUTS
========================================================= */

document
  .getElementById(
    "importFile"
  )
  .addEventListener(
    "change",
    event=>{

      const file =
        event.target.files?.[0];

      if(file){

        importData(
          file
        );

      }

      event.target.value =
        "";

    }
  );

document
  .getElementById(
    "bgFile"
  )
  .addEventListener(
    "change",
    event=>{

      const file =
        event.target.files?.[0];

      if(!file){
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        event=>{

          const image =
            new Image();

          image.onload =
            async()=>{

              const maxSize =
                1800;

              const scale =
                Math.min(
                  1,
                  maxSize /
                  image.width
                );

              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                Math.round(
                  image.width *
                  scale
                );

              canvas.height =
                Math.round(
                  image.height *
                  scale
                );

              const context =
                canvas.getContext(
                  "2d"
                );

              context.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
              );

              state.background =
                canvas.toDataURL(
                  "image/jpeg",
                  .78
                );

              applyBackground();

              try{

                await dbSet(
                  BACKGROUND_KEY,
                  state.background
                );

              }catch(error){

                console.error(
                  "Could not save background.",
                  error
                );

                alert(
                  "That image could not be saved. Try a smaller photo."
                );

              }

            };

          image.onerror =
            function(){

              alert(
                "That image could not be loaded."
              );

            };

          image.src =
            event.target.result;

        };

      reader.readAsDataURL(
        file
      );

      event.target.value =
        "";

    }
  );

/* =========================================================
   INITIALIZE
========================================================= */

(async function init(){

  await load();

  applyBackground();

  render();

})();

})();
</script>
