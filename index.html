    "change",
    event => {

      const file =
        event.target.files &&
        event.target.files[0];

      if(!file){

        return;

      }

      const reader =
        new FileReader();

      reader.onload =
        function(readerEvent){

          const image =
            new Image();

          image.onload =
            async function(){

              const maxSize =
                1800;

              const scale =
                Math.min(
                  1,
                  maxSize /
                    image.width
                );

              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                Math.round(
                  image.width *
                  scale
                );

              canvas.height =
                Math.round(
                  image.height *
                  scale
                );

              const context =
                canvas.getContext(
                  "2d"
                );

              if(!context){

                alert(
                  "That image could not be processed."
                );

                return;

              }

              context.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
              );

              state.background =
                canvas.toDataURL(
                  "image/jpeg",
                  .78
                );

              applyBackground();

              try{

                await dbSet(
                  BACKGROUND_KEY,
                  state.background
                );

              }catch(error){

                console.error(
                  error
                );

                alert(
                  "That image could not be saved. Try a smaller photo."
                );

              }

            };

          image.onerror =
            function(){

              alert(
                "That image could not be loaded."
              );

            };

          image.src =
            readerEvent
              .target
              .result;

        };

      reader.onerror =
        function(){

          alert(
            "That image could not be read."
          );

        };

      reader.readAsDataURL(
        file
      );

      event.target.value =
        "";

    }
  );

/* =========================================================
   CLOSE QUICK MENU WHEN TAPPING OUTSIDE
========================================================= */

document.addEventListener(
  "click",
  event => {

    const menu =
      document.getElementById(
        "quickMenu"
      );

    const button =
      document.getElementById(
        "quickAdd"
      );

    if(
      !menu ||
      !button
    ){

      return;

    }

    if(
      menu.classList.contains(
        "open"
      ) &&
      !menu.contains(
        event.target
      ) &&
      event.target !==
        button
    ){

      menu.classList.remove(
        "open"
      );

    }

  }
);

/* =========================================================
   ESCAPE CLOSES MODAL / MENU
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Escape"
    ){

      closeModal();

      const menu =
        document.getElementById(
          "quickMenu"
        );

      if(menu){

        menu.classList.remove(
          "open"
        );

      }

    }

  }
);

/* =========================================================
   PERSISTENT STORAGE
========================================================= */

async function requestPersistentStorage(){

  try{

    if(
      navigator.storage &&
      typeof navigator.storage.persist ===
        "function"
    ){

      await navigator.storage.persist();

    }

  }catch(error){

    console.warn(
      "Persistent storage request unavailable.",
      error
    );

  }

}

/* =========================================================
   SERVICE WORKER
========================================================= */

if(
  "serviceWorker" in
  navigator
){

  window.addEventListener(
    "load",
    function(){

      navigator.serviceWorker
        .register(
          "./service-worker.js"
        )
        .catch(
          function(error){

            console.warn(
              "Service worker registration failed.",
              error
            );

          }
        );

    }
  );

}

/* =========================================================
   INIT
========================================================= */

(async function init(){

  await requestPersistentStorage();

  await load();

  /*
    Flatten any old Units immediately in memory.
    The next save permanently writes the clean structure.
  */

  state.data =
    migratePossibleLegacyShape(
      state.data
    );

  applyBackground();

  render();

  /*
    Persist the migrated structure once.
    This means Units are removed from future saves.
  */

  try{

    await dbSet(
      TRACKER_KEY,
      {

        version:2,

        settings,

        data:
          state.data

      }
    );

  }catch(error){

    console.warn(
      "Could not persist migrated data.",
      error
    );

  }

})();

})();

</script>
