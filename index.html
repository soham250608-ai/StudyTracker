<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study Tracker">
<title>Study Tracker</title>

<link rel="manifest" href="manifest.json">

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root{
  --bg:#f4efe4;
  --paper:rgba(255,255,255,.94);
  --paper-solid:#fff;
  --ink:#171717;
  --muted:#737373;
  --border:#ded8ca;
  --border2:rgba(0,0,0,.10);
  --shadow:0 8px 30px rgba(0,0,0,.07);
  --radius:18px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  min-height:100%;
  background:var(--bg);
}

body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:transparent;
}

button,
input,
select{
  font:inherit;
}

button{
  -webkit-appearance:none;
  appearance:none;
}

#backgroundLayer{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  min-height:100%;
  z-index:0;
  background-color:var(--bg);
  background-position:center center;
  background-size:cover;
  background-repeat:no-repeat;
  pointer-events:none;
}

.app{
  position:relative;
  z-index:1;
  min-height:100vh;
  min-height:100dvh;
}

.wrap{
  width:min(1100px,calc(100% - 32px));
  margin:0 auto;
  padding:28px 0 50px;
}

/* =========================
   HOME
========================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-mark{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#171717;
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:700;
  font-size:17px;
  box-shadow:0 7px 18px rgba(0,0,0,.12);
}

.brand-text{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.brand-title{
  font-size:20px;
  font-weight:700;
  letter-spacing:-.03em;
}

.brand-sub{
  font-size:11px;
  color:var(--muted);
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border2);
  border-radius:13px;
  background:var(--paper);
  color:var(--ink);
  cursor:pointer;
  display:grid;
  place-items:center;
  box-shadow:var(--shadow);
}

.icon-btn:active{
  transform:scale(.96);
}

.subject-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}

.subject-card{
  position:relative;
  overflow:hidden;
  border:1px solid var(--border2);
  background:var(--paper);
  border-radius:20px;
  padding:22px;
  min-height:165px;
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:transform .15s ease,box-shadow .15s ease;
}

.subject-card:hover{
  transform:translateY(-2px);
  box-shadow:0 13px 35px rgba(0,0,0,.10);
}

.subject-card:active{
  transform:scale(.985);
}

.subject-accent{
  position:absolute;
  width:90px;
  height:90px;
  border-radius:50%;
  right:-30px;
  top:-30px;
  opacity:.14;
}

.subject-name{
  font-size:25px;
  font-weight:700;
  letter-spacing:-.04em;
  margin-bottom:9px;
}

.subject-meta{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.subject-arrow{
  position:absolute;
  left:22px;
  bottom:20px;
  font-size:18px;
}

/* =========================
   HEADER TABS
========================= */

.header-stack{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  margin-bottom:20px;
}

.header-tab{
  width:max-content;
  max-width:100%;
  background:var(--paper);
  border:1px solid var(--border2);
  border-radius:14px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.back-tab{
  padding:9px 14px;
  margin-bottom:10px;
}

.title-tab{
  padding:11px 16px;
}

.back{
  display:block;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:21px;
  font-weight:600;
  line-height:1.2;
  padding:0;
  margin:0;
  cursor:pointer;
}

.back:active{
  opacity:.65;
}

.subject-title{
  margin:0;
  font-size:28px;
  line-height:1.15;
  font-weight:700;
  letter-spacing:-.04em;
}

/* =========================
   YEAR TABS
========================= */

.year-tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.year-tab{
  border:1px solid var(--border2);
  background:var(--paper);
  color:var(--muted);
  border-radius:12px;
  padding:9px 16px;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
  box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.year-tab.active{
  color:#fff;
  background:#171717;
  border-color:#171717;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:var(--paper);
  border:1px solid var(--border2);
  border-radius:15px;
  padding:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.06);
}

.stat-label{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.09em;
  margin-bottom:5px;
}

.stat-num{
  font:600 28px "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  line-height:1.15;
}

.stat-small{
  margin-top:4px;
  color:var(--muted);
  font-size:10px;
}

/* =========================
   CHAPTERS
========================= */

.chapter-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.section-title{
  font-size:14px;
  font-weight:700;
  letter-spacing:-.01em;
}

.add-chapter-btn{
  width:34px;
  height:34px;
  border:1px solid var(--border2);
  background:var(--paper);
  border-radius:11px;
  cursor:pointer;
  font-size:22px;
  line-height:1;
  display:grid;
  place-items:center;
  box-shadow:0 5px 15px rgba(0,0,0,.06);
}

.add-chapter-btn:active{
  transform:scale(.94);
}

.addbox{
  display:none;
  background:var(--paper);
  border:1px solid var(--border2);
  border-radius:16px;
  padding:13px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

.addbox.open{
  display:block;
}

.addbox-row{
  display:flex;
  gap:8px;
}

.addbox input{
  flex:1;
  min-width:0;
  border:1px solid var(--border);
  background:#fff;
  border-radius:11px;
  padding:10px 11px;
  outline:none;
  font-size:13px;
}

.addbox input:focus{
  border-color:#999;
}

.primary-btn{
  border:0;
  background:#171717;
  color:#fff;
  border-radius:11px;
  padding:10px 14px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}

.secondary-btn{
  border:1px solid var(--border);
  background:#fff;
  color:var(--ink);
  border-radius:11px;
  padding:10px 14px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}

.chapters{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

.chapter{
  background:var(--paper);
  border:1px solid var(--border2);
  border-radius:17px;
  padding:16px;
  box-shadow:0 7px 23px rgba(0,0,0,.06);
  min-width:0;
}

.chapter-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.chapter-title{
  font-size:17px;
  line-height:1.25;
  font-weight:700;
  letter-spacing:-.02em;
  overflow-wrap:anywhere;
}

.delete-chapter{
  flex:none;
  width:27px;
  height:27px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#aaa;
  cursor:pointer;
  font-size:15px;
}

.delete-chapter:hover{
  color:#777;
  background:#f3f3f3;
}

.chapter-progress{
  font:500 16px "JetBrains Mono",ui-monospace,monospace;
}

.progress-percent{
  color:var(--muted);
  font-size:11px;
  margin-left:4px;
}

.progress-bar{
  width:100%;
  height:5px;
  background:#e8e5dc;
  border-radius:99px;
  overflow:hidden;
  margin:8px 0 14px;
}

.progress-fill{
  height:100%;
  border-radius:99px;
  transition:width .2s ease;
}

.row{
  margin-top:13px;
}

.row-label{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:7px;
}

.dots{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.dot{
  width:30px;
  height:30px;
  border-radius:50%;
  border:1px solid var(--border);
  background:#fff;
  color:#8b8b8b;
  display:grid;
  place-items:center;
  font:500 11px "JetBrains Mono",ui-monospace,monospace;
  cursor:pointer;
  transition:transform .12s ease,background .12s ease,color .12s ease;
}

.dot:active{
  transform:scale(.91);
}

.dot.done{
  background:#171717;
  color:#fff;
  border-color:#171717;
}

.stars{
  display:flex;
  gap:3px;
}

.star{
  border:0;
  background:transparent;
  padding:0;
  color:#c9c4b8;
  font-size:22px;
  line-height:1;
  cursor:pointer;
}

.star.on{
  color:#171717;
}

.chapter-actions{
  display:flex;
  justify-content:flex-end;
  margin-top:13px;
}

.linkbtn{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:11px;
  padding:3px 0;
  cursor:pointer;
}

/* =========================
   EMPTY STATE
========================= */

.empty{
  background:var(--paper);
  border:1px solid var(--border2);
  border-radius:16px;
  padding:20px;
  color:var(--muted);
  font-size:13px;
  box-shadow:var(--shadow);
}

/* =========================
   SETTINGS
========================= */

.settings-panel{
  position:fixed;
  z-index:20;
  inset:0;
  display:none;
  background:rgba(0,0,0,.28);
  padding:20px;
  align-items:flex-end;
  justify-content:center;
}

.settings-panel.open{
  display:flex;
}

.settings-card{
  width:min(560px,100%);
  max-height:88vh;
  overflow:auto;
  background:#fff;
  border-radius:22px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.settings-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.settings-title{
  font-size:18px;
  font-weight:700;
}

.close-settings{
  width:32px;
  height:32px;
  border:0;
  border-radius:9px;
  background:#f1f1f1;
  cursor:pointer;
}

.setting-group{
  margin-bottom:20px;
}

.setting-label{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:8px;
}

.setting-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.color-btn{
  width:36px;
  height:36px;
  border-radius:10px;
  border:2px solid transparent;
  cursor:pointer;
}

.color-btn.active{
  border-color:#171717;
}

.file-input{
  display:none;
}

.settings-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.danger-btn{
  grid-column:1/-1;
  border:1px solid #e3b7b7;
  background:#fff;
  color:#a33;
  border-radius:11px;
  padding:11px;
  cursor:pointer;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:800px){
  .subject-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){
  .wrap{
    width:min(100% - 22px,1100px);
    padding:20px 0 35px;
  }

  .topbar{
    margin-bottom:17px;
  }

  .brand-mark{
    width:39px;
    height:39px;
    border-radius:12px;
  }

  .brand-title{
    font-size:18px;
  }

  .subject-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px;
  }

  .subject-card{
    min-height:145px;
    padding:16px;
    border-radius:16px;
  }

  .subject-name{
    font-size:20px;
  }

  .subject-meta{
    font-size:10px;
  }

  .subject-arrow{
    left:16px;
    bottom:15px;
  }

  .subject-title{
    font-size:23px;
  }

  .back{
    font-size:21px;
  }

  .stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }

  .stat{
    padding:12px;
  }

  .stat-num{
    font-size:27px;
  }

  .chapters{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }

  .chapter{
    padding:13px;
    border-radius:15px;
  }

  .chapter-title{
    font-size:16px;
  }

  .chapter-progress{
    font-size:15px;
  }

  .linkbtn{
    font-size:11px;
  }

  .row-label{
    font-size:10px;
  }

  .dot{
    width:28px;
    height:28px;
    font-size:11px;
  }

  .star{
    font-size:20px;
  }

  .dots{
    gap:5px;
  }

  .settings-panel{
    padding:10px;
  }

  .settings-card{
    border-radius:19px;
    padding:16px;
  }
}

/* Very small phones */
@media(max-width:370px){
  .chapters{
    gap:9px;
  }

  .chapter{
    padding:11px;
  }

  .chapter-title{
    font-size:14px;
  }

  .dot{
    width:25px;
    height:25px;
    font-size:9px;
  }

  .star{
    font-size:18px;
  }

  .subject-name{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div id="backgroundLayer" aria-hidden="true"></div>

<div class="app">
  <div class="wrap">

    <div id="app"></div>

  </div>
</div>

<!-- SETTINGS -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-card">

    <div class="settings-head">
      <div class="settings-title">Settings</div>
      <button class="close-settings" id="closeSettings">✕</button>
    </div>

    <div class="setting-group">
      <div class="setting-label">Background color</div>

      <div class="setting-row" id="colorOptions">
        <button class="color-btn" data-color="#f4efe4" style="background:#f4efe4"></button>
        <button class="color-btn" data-color="#eee9df" style="background:#eee9df"></button>
        <button class="color-btn" data-color="#e9edf0" style="background:#e9edf0"></button>
        <button class="color-btn" data-color="#ece8f3" style="background:#ece8f3"></button>
        <button class="color-btn" data-color="#e9f0e8" style="background:#e9f0e8"></button>
        <button class="color-btn" data-color="#f3e8e8" style="background:#f3e8e8"></button>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label">Background image</div>

      <div class="setting-row">
        <label class="primary-btn">
          Choose image
          <input class="file-input" type="file" id="backgroundInput" accept="image/*">
        </label>

        <button class="secondary-btn" id="removeBackground">
          Remove image
        </button>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label">Backup</div>

      <div class="settings-actions">
        <button class="primary-btn" id="exportBtn">Export backup</button>

        <label class="secondary-btn" style="text-align:center">
          Import backup
          <input class="file-input" type="file" id="importInput" accept=".json,application/json">
        </label>

        <button class="danger-btn" id="resetBtn">
          Reset all study data
        </button>
      </div>
    </div>

  </div>
</div>

<script>
"use strict";

/* =========================================
   CONSTANTS
========================================= */

const DB_NAME = "study-tracker-db";
const DB_VERSION = 1;
const STORE_NAME = "state";

const SUBJECTS = [
  {
    id:"physics",
    name:"Physics",
    color:"#5b7cfa"
  },
  {
    id:"maths",
    name:"Maths",
    color:"#e29b3f"
  },
  {
    id:"chemistry",
    name:"Chemistry",
    color:"#56a77c"
  },
  {
    id:"biology",
    name:"Biology",
    color:"#b46ac7"
  }
];

let db = null;
let state = null;

/* =========================================
   DEFAULT DATA
========================================= */

function createDefaultState(){
  const data = {};

  SUBJECTS.forEach(subject=>{
    data[subject.id] = {
      years:{
        "11":{
          chapters:[]
        },
        "12":{
          chapters:[]
        }
      }
    };
  });

  return {
    version:2,
    data,
    background:"",
    backgroundColor:"#f4efe4"
  };
}

/* =========================================
   DATABASE
========================================= */

function openDB(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded=()=>{
      const database=request.result;

      if(!database.objectStoreNames.contains(STORE_NAME)){
        database.createObjectStore(STORE_NAME);
      }
    };

    request.onsuccess=()=>{
      db=request.result;
      resolve(db);
    };

    request.onerror=()=>{
      reject(request.error);
    };
  });
}

function dbGet(key){
  return new Promise((resolve,reject)=>{
    const request=db
      .transaction(STORE_NAME,"readonly")
      .objectStore(STORE_NAME)
      .get(key);

    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}

function dbSet(key,value){
  return new Promise((resolve,reject)=>{
    const request=db
      .transaction(STORE_NAME,"readwrite")
      .objectStore(STORE_NAME)
      .put(value,key);

    request.onsuccess=()=>resolve();
    request.onerror=()=>reject(request.error);
  });
}

async function loadState(){
  const saved=await dbGet("state");

  if(saved){
    state=normalizeState(saved);
  }else{
    state=createDefaultState();
    await save();
  }

  applyBackground();
}

async function save(){
  await dbSet("state",state);
}

/* =========================================
   DATA NORMALIZATION / MIGRATION
========================================= */

function normalizeState(input){
  const fresh=createDefaultState();

  if(!input || typeof input!=="object"){
    return fresh;
  }

  fresh.background=input.background || "";
  fresh.backgroundColor=input.backgroundColor || "#f4efe4";

  if(input.data && typeof input.data==="object"){
    SUBJECTS.forEach(subject=>{
      const incoming=input.data[subject.id];

      if(!incoming){
        return;
      }

      const years=incoming.years || {};

      ["11","12"].forEach(year=>{
        let chapters=[];

        /*
          New format:
          years[year].chapters[]
        */
        if(Array.isArray(years[year]?.chapters)){
          chapters=years[year].chapters;
        }

        /*
          Old format:
          years[year].units[].chapters[]
        */
        else if(Array.isArray(years[year]?.units)){
          years[year].units.forEach(unit=>{
            if(Array.isArray(unit.chapters)){
              chapters.push(...unit.chapters);
            }
          });
        }

        fresh.data[subject.id].years[year].chapters=
          chapters.map(normalizeChapter);
      });
    });
  }

  return fresh;
}

function normalizeChapter(chapter){
  return {
    id:chapter.id || makeId(),
    name:String(chapter.name || chapter.title || "Chapter"),
    lectures:Math.max(
      0,
      Number.isFinite(Number(chapter.lectures))
        ? Number(chapter.lectures)
        : 0
    ),
    completed:Array.isArray(chapter.completed)
      ? chapter.completed.map(Number).filter(n=>Number.isFinite(n))
      : [],
    confidence:Math.max(
      0,
      Math.min(
        5,
        Number.isFinite(Number(chapter.confidence))
          ? Number(chapter.confidence)
          : 0
      )
    )
  };
}

/* =========================================
   HELPERS
========================================= */

function makeId(){
  return "id_" +
    Date.now().toString(36) +
    "_" +
    Math.random().toString(36).slice(2,9);
}

function getSubject(id){
  return SUBJECTS.find(s=>s.id===id);
}

function getYearData(subjectId,year){
  return state.data[subjectId].years[String(year)];
}

function escapeHTML(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function subjectColor(id){
  return getSubject(id)?.color || "#171717";
}

/* =========================================
   BACKGROUND
========================================= */

function applyBackground(){
  const layer=document.getElementById("backgroundLayer");

  if(!layer){
    return;
  }

  document.documentElement.style.setProperty(
    "--bg",
    state.backgroundColor || "#f4efe4"
  );

  layer.style.backgroundColor=
    state.backgroundColor || "#f4efe4";

  layer.style.backgroundImage=
    state.background
      ? `url("${state.background}")`
      : "none";
}

function setBackgroundColor(color){
  state.backgroundColor=color;
  state.background="";
  applyBackground();
  save();
}

function readBackgroundImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();

    reader.onload=()=>{
      resolve(reader.result);
    };

    reader.onerror=()=>{
      reject(reader.error);
    };

    reader.readAsDataURL(file);
  });
}

/* =========================================
   STATS
========================================= */

function calculateYearStats(yearData){
  let total=0;
  let done=0;
  let finished=0;

  let confidenceSum=0;
  let confidenceCount=0;

  yearData.chapters.forEach(chapter=>{
    const lectures=Math.max(0,Number(chapter.lectures)||0);

    const completed=new Set(
      Array.isArray(chapter.completed)
        ? chapter.completed
        : []
    );

    const completedCount=
      [...completed]
        .filter(n=>n>=1 && n<=lectures)
        .length;

    total+=lectures;
    done+=completedCount;

    if(
      lectures>0 &&
      completedCount===lectures
    ){
      finished++;
    }

    if(chapter.confidence>0){
      confidenceSum+=chapter.confidence;
      confidenceCount++;
    }
  });

  const percentage=
    total>0
      ? Math.round(done/total*100)
      : 0;

  const averageConfidence=
    confidenceCount>0
      ? confidenceSum/confidenceCount
      : 0;

  return {
    chapterCount:yearData.chapters.length,
    total,
    done,
    finished,
    percentage,
    averageConfidence
  };
}

function getSubjectStats(subjectId){
  const year11=getYearData(subjectId,"11");
  const year12=getYearData(subjectId,"12");

  const a=calculateYearStats(year11);
  const b=calculateYearStats(year12);

  return {
    chapterCount:
      a.chapterCount+b.chapterCount,

    total:
      a.total+b.total,

    done:
      a.done+b.done,

    finished:
      a.finished+b.finished,

    percentage:
      a.total+b.total>0
        ? Math.round(
            (a.done+b.done)/
            (a.total+b.total)*
            100
          )
        : 0,

    averageConfidence:
      a.averageConfidence+b.averageConfidence>0
        ? (
            (
              a.averageConfidence*
              (a.averageConfidence>0 ? 1 : 0)
            )+
            (
              b.averageConfidence*
              (b.averageConfidence>0 ? 1 : 0)
            )
          )
        : 0
  };
}

function statsHTML(stats){
  return `
    <div class="stat">
      <div class="stat-label">Completion</div>
      <div class="stat-num">${stats.percentage}%</div>
      <div class="stat-small">
        ${stats.done}/${stats.total} lectures
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">Lectures</div>
      <div class="stat-num">${stats.done}</div>
      <div class="stat-small">
        of ${stats.total}
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">Chapters</div>
      <div class="stat-num">${stats.finished}</div>
      <div class="stat-small">
        completed
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">Confidence</div>
      <div class="stat-num">
        ${
          stats.averageConfidence
            ? stats.averageConfidence.toFixed(1)
            : "—"
        }
      </div>
      <div class="stat-small">
        out of 5
      </div>
    </div>
  `;
}

/*
  Important:
  This reads the visible chapter cards directly.
  That makes the stats update immediately when a
  lecture dot or confidence star is tapped.
*/
function updateVisibleStats(){
  const statsBox=
    document.querySelector(
      ".stats[data-stats-scope='year']"
    );

  if(!statsBox){
    return;
  }

  const cards=
    Array.from(
      document.querySelectorAll(".chapter")
    );

  let total=0;
  let done=0;
  let finished=0;

  let confidenceSum=0;
  let confidenceCount=0;

  cards.forEach(card=>{
    const progress=
      card.querySelector(".chapter-progress");

    if(progress){
      const match=
        progress.textContent
          .trim()
          .match(/^(\d+)\s*\/\s*(\d+)$/);

      if(match){
        const completed=Number(match[1]);
        const lectures=Number(match[2]);

        total+=lectures;
        done+=Math.min(
          completed,
          lectures
        );

        if(
          lectures>0 &&
          completed===lectures
        ){
          finished++;
        }
      }
    }

    const selectedStars=
      card.querySelectorAll(".star.on").length;

    if(selectedStars>0){
      confidenceSum+=selectedStars;
      confidenceCount++;
    }
  });

  const percentage=
    total>0
      ? Math.round(done/total*100)
      : 0;

  const averageConfidence=
    confidenceCount>0
      ? confidenceSum/confidenceCount
      : 0;

  statsBox.innerHTML=statsHTML({
    chapterCount:cards.length,
    total,
    done,
    finished,
    percentage,
    averageConfidence
  });
}

function setupAddChapter(subjectId,year){
  const addBtn=
    document.getElementById("addChapterBtn");

  const addBox=
    document.getElementById("addBox");

  const input=
    document.getElementById("chapterNameInput");

  const createBtn=
    document.getElementById("createChapterBtn");

  const cancelBtn=
    document.getElementById("cancelChapterBtn");

  addBtn.addEventListener("click",()=>{
    addBox.classList.toggle("open");

    if(addBox.classList.contains("open")){
      setTimeout(()=>{
        input.focus();
      },50);
    }
  });

  cancelBtn.addEventListener("click",()=>{
    input.value="";
    addBox.classList.remove("open");
  });

  async function create(){
    const name=input.value.trim();

    if(!name){
      input.focus();
      return;
    }

    const yearData=
      getYearData(subjectId,year);

    yearData.chapters.push({
      id:makeId(),
      name,
      lectures:0,
      completed:[],
      confidence:0
    });

    await save();

    renderYear();
  }

  createBtn.addEventListener("click",create);

  input.addEventListener("keydown",event=>{
    if(event.key==="Enter"){
      event.preventDefault();
      create();
    }

    if(event.key==="Escape"){
      input.value="";
      addBox.classList.remove("open");
    }
  });
}

/* =========================================
   CHAPTER INTERACTIONS
========================================= */

function setupChapterInteractions(subjectId,year){
  const container=
    document.getElementById("chapters");

  if(!container){
    return;
  }

  container.addEventListener("click",async event=>{
    const button=
      event.target.closest("button");

    if(!button){
      return;
    }

    const card=
      button.closest(".chapter");

    if(!card){
      return;
    }

    const chapterId=
      card.dataset.chapterId;

    const yearData=
      getYearData(subjectId,year);

    const chapter=
      yearData.chapters.find(
        item=>item.id===chapterId
      );

    if(!chapter){
      return;
    }

    /* DELETE */
    if(button.dataset.action==="delete"){
      const confirmed=
        confirm(
          `Delete "${chapter.name}"?`
        );

      if(!confirmed){
        return;
      }

      yearData.chapters=
        yearData.chapters.filter(
          item=>item.id!==chapterId
        );

      await save();
      renderYear();
      return;
    }

    /* SET LECTURES */
    if(button.dataset.action==="set-lectures"){
      const current=
        Number(chapter.lectures)||0;

      const answer=
        prompt(
          "How many lectures does this chapter have?",
          String(current)
        );

      if(answer===null){
        return;
      }

      const lectures=
        Math.max(
          0,
          Math.floor(
            Number(answer)
          )
        );

      if(!Number.isFinite(lectures)){
        alert("Please enter a valid number.");
        return;
      }

      chapter.lectures=lectures;

      chapter.completed=
        Array.isArray(chapter.completed)
          ? chapter.completed.filter(
              number=>number>=1 &&
                     number<=lectures
            )
          : [];

      await save();

      renderChapterCard(
        card,
        chapter
      );

      updateVisibleStats();
      return;
    }

    /* LECTURE DOT */
    if(button.dataset.lecture){
      const lecture=
        Number(button.dataset.lecture);

      if(!Array.isArray(chapter.completed)){
        chapter.completed=[];
      }

      const index=
        chapter.completed.indexOf(
          lecture
        );

      if(index>=0){
        chapter.completed.splice(index,1);
      }else{
        chapter.completed.push(lecture);
      }

      chapter.completed.sort(
        (a,b)=>a-b
      );

      await save();

      updateChapterCard(
        card,
        chapter
      );

      updateVisibleStats();
      return;
    }

    /* CONFIDENCE */
    if(button.dataset.confidence){
      const confidence=
        Number(button.dataset.confidence);

      /*
        Tapping the currently selected
        star clears confidence.
      */
      chapter.confidence=
        chapter.confidence===confidence
          ? 0
          : confidence;

      await save();

      updateChapterCard(
        card,
        chapter
      );

      updateVisibleStats();
      return;
    }
  });
}

/* =========================================
   UPDATE ONE CHAPTER CARD
========================================= */

function updateChapterCard(card,chapter){
  const lectures=
    Math.max(
      0,
      Number(chapter.lectures)||0
    );

  const completedSet=
    new Set(
      Array.isArray(chapter.completed)
        ? chapter.completed
        : []
    );

  const completedCount=
    [...completedSet]
      .filter(
        number=>
          number>=1 &&
          number<=lectures
      )
      .length;

  const percentage=
    lectures>0
      ? Math.round(
          completedCount/lectures*100
        )
      : 0;

  const progress=
    card.querySelector(".chapter-progress");

  if(progress){
    progress.textContent=
      `${completedCount}/${lectures}`;
  }

  const percent=
    card.querySelector(".progress-percent");

  if(percent){
    percent.textContent=
      `${percentage}%`;
  }

  const fill=
    card.querySelector(".progress-fill");

  if(fill){
    fill.style.width=
      `${percentage}%`;
  }

  const dots=
    card.querySelector(".dots");

  if(dots){
    if(lectures===0){
      dots.innerHTML=`
        <button
          class="linkbtn"
          data-action="set-lectures"
        >
          Set lectures
        </button>
      `;
    }else{
      dots.innerHTML=
        Array.from(
          {length:lectures},
          (_,index)=>{
            const number=index+1;
            const done=
              completedSet.has(number);

            return `
              <button
                class="dot ${
                  done ? "done" : ""
                }"
                data-lecture="${number}"
                aria-label="Lecture ${number}"
              >
                ${number}
              </button>
            `;
          }
        ).join("");
    }
  }

  const stars=
    card.querySelector(".stars");

  if(stars){
    stars.innerHTML=
      Array.from(
        {length:5},
        (_,index)=>{
          const number=index+1;

          return `
            <button
              class="star ${
                number<=chapter.confidence
                  ? "on"
                  : ""
              }"
              data-confidence="${number}"
              aria-label="${number} out of 5"
            >
              ★
            </button>
          `;
        }
      ).join("");
  }

  const action=
    card.querySelector(
      '[data-action="set-lectures"]'
    );

  if(action){
    action.textContent=
      lectures
        ? "Edit lectures"
        : "Set lectures";
  }
}

function renderChapterCard(card,chapter){
  const wrapper=
    document.createElement("div");

  wrapper.innerHTML=
    chapterHTML(chapter);

  card.replaceWith(
    wrapper.firstElementChild
  );

  setupChapterInteractions(
    currentView.subject,
    currentView.year
  );
}

function downloadJSON(data,filename){
  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {
      type:"application/json"
    }
  );

  const url=
    URL.createObjectURL(blob);

  const anchor=
    document.createElement("a");

  anchor.href=url;
  anchor.download=filename;

  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },1000);
}

function exportBackup(){
  downloadJSON(
    state,
    `study-tracker-backup-${new Date()
      .toISOString()
      .slice(0,10)}.json`
  );
}

async function importBackup(file){
  try{
    const text=
      await file.text();

    const incoming=
      JSON.parse(text);

    const normalized=
      normalizeState(incoming);

    state=normalized;

    await save();
    applyBackground();

    render();

    alert("Backup imported successfully.");
  }catch(error){
    console.error(error);
    alert("Could not import that backup.");
  }
}

        closeSettings();
      }
    });

  document
    .querySelectorAll(".color-btn")
    .forEach(button=>{
      button.addEventListener(
        "click",
        ()=>{
          setBackgroundColor(
            button.dataset.color
          );

          updateColorButtons();
        }
      );
    });

  document
    .getElementById("backgroundInput")
    .addEventListener(
      "change",
      async event=>{
        const file=
          event.target.files?.[0];

        if(!file){
          return;
        }

        try{
          const image=
            await readBackgroundImage(file);

          state.background=image;

          applyBackground();
          await save();

          updateColorButtons();
        }catch(error){
          console.error(error);
          alert(
            "Could not load that image."
          );
        }

        event.target.value="";
      }
    );

  document
    .getElementById("removeBackground")
    .addEventListener(
      "click",
      async ()=>{
        state.background="";
        applyBackground();
        await save();
        updateColorButtons();
      }
    );

  document
    .getElementById("exportBtn")
    .addEventListener(
      "click",
      exportBackup
    );

  document
    .getElementById("importInput")
    .addEventListener(
      "change",
      async event=>{
        const file=
          event.target.files?.[0];

        if(file){
          await importBackup(file);
        }

        event.target.value="";
      }
    );

  document
    .getElementById("resetBtn")
    .addEventListener(
      "click",
      resetAll
    );
}

/* =========================================
   MAIN RENDER
========================================= */

function render(){
  if(!state){
    return;
  }

  if(currentView.type==="home"){
    renderHome();
    return;
  }

  if(currentView.type==="subject"){
    renderSubject();
    return;
  }

  if(currentView.type==="year"){
    renderYear();
    return;
  }
}

/* =========================================
   PWA SERVICE WORKER
========================================= */

async function registerServiceWorker(){
  if(
    "serviceWorker" in navigator &&
    location.protocol!=="file:"
  ){
    try{
      await navigator.serviceWorker.register(
        "sw.js"
      );
    }catch(error){
      console.warn(
        "Service worker registration failed:",
        error
      );
    }
  }
}

/* =========================================
   START
========================================= */

async function init(){
  try{
    await openDB();
    await loadState();

    setupSettings();
    render();

    registerServiceWorker();
  }catch(error){
    console.error(error);

    document.getElementById("app").innerHTML=`
      <div class="empty">
        <strong>Something went wrong.</strong><br><br>
        Your browser could not open the local study database.
        Please reload the page.
      </div>
    `;
  }
}

init();
</script>
