<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f2ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Tracker">

<title>Study Tracker</title>

<link rel="apple-touch-icon" sizes="180x180" href="./icon.png">

<link rel="manifest" href="./manifest.json">

<link
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>
:root{
  --bg:#f4f2ea;
  --paper:rgba(255,253,247,.92);
  --ink:#232520;
  --muted:#6b6d63;
  --border:rgba(35,37,32,.14);
  --border2:rgba(35,37,32,.28);

  --physics:#3d5a80;
  --maths:#d4a900;
  --chemistry:#b94a48;
  --biology:#4f8a5b;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  min-height:100%;
  margin:0;
}

html{
  background:var(--bg);
}

body{
  color:var(--ink);
  font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  background:transparent;
  overscroll-behavior-x:none;
}

#backgroundStage{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  min-height:100%;
  z-index:0;

  overflow:hidden;
  background-color:var(--bg);

  pointer-events:none;
}

#backgroundParallax{
  position:absolute;
  inset:-6%;
  width:112%;
  height:112%;

  will-change:transform;

  transition:
    transform .9s
    cubic-bezier(.16,1,.3,1);
}

#backgroundLayer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;

  background-color:var(--bg);
  background-position:center center;
  background-size:cover;
  background-repeat:no-repeat;

  will-change:transform;

  animation:
    bgDrift
    34s
    ease-in-out
    infinite
    alternate;
}

#backgroundSheen{
  position:absolute;
  inset:-25% -40%;

  background:
    linear-gradient(
      112deg,
      transparent 42%,
      rgba(255,255,255,.16) 50%,
      transparent 58%
    );

  transform:
    translateX(-130%)
    skewX(-10deg);

  mix-blend-mode:overlay;

  animation:
    sheenSweep
    11s
    cubic-bezier(.4,0,.2,1)
    infinite;
}

#backgroundParticles{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.spray{
  position:absolute;
  bottom:-6%;

  width:4px;
  height:4px;

  border-radius:50%;

  background:
    rgba(255,255,255,.6);

  box-shadow:
    0 0 4px
    rgba(255,255,255,.5);

  opacity:0;

  animation-name:sprayRise;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
}

button,
input{
  font:inherit;
}

button{
  -webkit-appearance:none;
  appearance:none;
}

input{
  -webkit-appearance:none;
  appearance:none;
}

.wrap{
  position:relative;
  z-index:1;

  width:min(1000px,100%);
  margin:auto;

  padding:
    max(28px,env(safe-area-inset-top))
    20px
    max(70px,calc(40px + env(safe-area-inset-bottom)));
}

.display{
  font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;
}

.mono{
  font-family:"JetBrains Mono",ui-monospace,monospace;
}

.topbar{
  margin-bottom:25px;
}

.brand-tab{
  display:inline-flex;
  align-items:center;
  width:fit-content;
  max-width:100%;

  background:var(--paper);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);
  border-radius:16px;
  padding:10px 16px;

  box-shadow:
    0 9px 24px rgba(35,37,32,.07);
}

.brand{
  font:600 34px "Space Grotesk","Segoe UI",system-ui,sans-serif;
  margin:0;
}

.brand:hover,
.brand:focus{
  background:rgba(255,253,247,.78);
  box-shadow:0 4px 15px rgba(35,37,32,.08);
}

/* =========================================================
   BACK BUTTON
   ========================================================= */

.back{
  position:relative;
  display:inline-block;
  overflow:hidden;
  isolation:isolate;

  border:1px solid var(--border2);
  background:var(--paper);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  color:var(--muted);

  font-size:22px;
  font-weight:600;

  line-height:1.2;

  padding:12px 16px;
  margin:0;

  border-radius:14px;

  box-shadow:
    0 9px 24px rgba(35,37,32,.07);

  cursor:pointer;

  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;

  transition:
    color .18s ease,
    transform .18s ease,
    box-shadow .18s ease;
}

.back::before{
  content:"";
  position:absolute;
  z-index:-1;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  border-radius:50%;
  background:rgba(255,255,255,.42);
  transform:translate(-50%,-50%) scale(0);
  opacity:0;
  pointer-events:none;
}

.back:hover{
  color:var(--ink);
  transform:translateY(-4px) scale(1.02);
  box-shadow:
    0 16px 30px rgba(35,37,32,.12);
}

.back:hover::before{
  animation:backCircle .5s ease-out forwards;
}

.back:active{
  transform:translateY(-1px) scale(.97);
  box-shadow:
    0 8px 18px rgba(35,37,32,.10);
}

.back:active::before{
  animation:backCircle .38s ease-out forwards;
}

/* =========================================================
   SUBJECT
   ========================================================= */

.subject-head{
  --tint:var(--physics);

  display:flex;
  justify-content:space-between;
  align-items:end;
}

.page-header{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:12px;
  margin-bottom:20px;
}

.subject-tab{
  display:inline-flex;
  align-items:center;
  width:fit-content;
  max-width:100%;

  background:var(--paper);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);
  border-radius:16px;
  padding:13px 18px;

  box-shadow:
    0 9px 24px rgba(35,37,32,.07);
}

.subject-title{
  margin:0;

  font:600 32px
    "Space Grotesk",
    "Segoe UI",
    system-ui,
    sans-serif;

  color:var(--tint);
}

/* =========================================================
   STATS
   ========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);

  background:var(--paper);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);
  border-radius:16px;

  overflow:hidden;

  margin:20px 0 27px;

  box-shadow:
    0 9px 25px rgba(35,37,32,.07);
}

.stat{
  padding:18px;

  border-right:1px solid var(--border);

  text-align:center;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  transition:background .18s ease;
}

.stat:last-child{
  border-right:0;
}

.stat:hover{
  background:rgba(255,255,255,.38);
}

/*
  Only requested visual change:
  stats numbers are larger, but not oversized.
*/
.stat-num{
  font:
    600 28px
    "JetBrains Mono",
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  line-height:1.15;
}

.stat-label{
  font-size:12px;
  color:var(--muted);
  margin-top:5px;
  text-align:center;
}

/* =========================================================
   PAGE
   ========================================================= */

.page-enter{
  animation:
    pageEnter
    .35s
    cubic-bezier(.2,.8,.2,1)
    both;
}

@keyframes pageEnter{
  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================================================
   SUBJECT TILES
   ========================================================= */

.tiles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.tile{
  --tint:var(--physics);

  position:relative;
  overflow:hidden;
  isolation:isolate;

  width:100%;

  background:var(--paper);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);
  border-left:5px solid var(--tint);

  border-radius:16px;

  padding:22px;

  text-align:left;

  cursor:pointer;

  color:var(--ink);

  box-shadow:
    0 9px 24px rgba(35,37,32,.07);

  transition:
    transform .35s cubic-bezier(.34,1.56,.64,1),
    box-shadow .3s cubic-bezier(.16,1,.3,1);

  animation:
    rise
    .55s
    cubic-bezier(.16,1,.3,1)
    both;

  touch-action:manipulation;

  -webkit-user-select:none;
  user-select:none;
}

.tile > *{
  position:relative;
  z-index:2;
}

@media (hover:hover) and (pointer:fine){

  .tile:hover{
    transform:translateY(-4px) scale(1.015);

    box-shadow:
      0 16px 30px rgba(35,37,32,.12);
  }

}

.tile:active{
  transform:translateY(-1px) scale(1.03);
}

.tile-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.tile-name{
  font:
    600 22px
    "Space Grotesk",
    "Segoe UI",
    system-ui,
    sans-serif;
}

.tile-pct{
  font:
    600 24px
    "JetBrains Mono",
    ui-monospace,
    monospace;
}

.tile-meta{
  display:flex;
  justify-content:space-between;
  gap:12px;

  margin-top:11px;

  color:var(--muted);

  font:
    12px
    "JetBrains Mono",
    ui-monospace,
    monospace;
}

/* =========================================================
   TAB CORNER ACCENT (quarter circle)
   =========================================================
   A soft quarter-circle of the tab's --tint colour, tucked
   into the top-right corner. Grows slightly on hover/press.
*/

.tile::after,
.year-tab::after{
  content:"";
  position:absolute;
  top:-42px;
  right:-42px;
  width:92px;
  height:92px;
  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 70%,
      color-mix(in srgb,var(--tint) 55%,white) 0%,
      color-mix(in srgb,var(--tint) 30%,white) 55%,
      transparent 78%
    );

  opacity:.55;
  z-index:1;
  pointer-events:none;

  transition:
    transform .25s ease,
    opacity .25s ease;
}

@media (hover:hover) and (pointer:fine){

  .tile:hover::after,
  .year-tab:hover::after{
    transform:scale(1.18);
    opacity:.75;
  }

}

.tile:active::after,
.year-tab:active::after{
  transform:scale(1.3);
  opacity:.85;
}

/* =========================================================
   YEAR TABS
   ========================================================= */

.year-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:16px;

  margin:20px 0;
}

.year-tab{
  position:relative;
  overflow:hidden;
  isolation:isolate;

  --tint:var(--physics);

  width:100%;

  background:var(--paper);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);
  border-top:5px solid var(--tint);

  border-radius:15px;

  padding:20px;

  text-align:left;

  cursor:pointer;

  color:var(--ink);

  box-shadow:
    0 9px 24px rgba(35,37,32,.07);

  transition:
    transform .38s cubic-bezier(.34,1.56,.64,1),
    box-shadow .3s cubic-bezier(.16,1,.3,1);

  animation:
    rise
    .5s
    cubic-bezier(.16,1,.3,1)
    both;

  touch-action:manipulation;

  -webkit-user-select:none;
  user-select:none;
}

.year-tab > *{
  position:relative;
  z-index:2;
}

@media (hover:hover) and (pointer:fine){

  .year-tab:hover{
    transform:translateY(-5px) scale(1.02);

    box-shadow:
      0 18px 35px rgba(35,37,32,.13);
  }

}

.year-tab:active{
  transform:translateY(-2px) scale(1.035);
}

.year-name{
  font:
    600 22px
    "Space Grotesk",
    "Segoe UI",
    system-ui,
    sans-serif;
}

.year-pct{
  float:right;

  font:
    600 24px
    "JetBrains Mono",
    ui-monospace,
    monospace;
}

.year-meta{
  display:block;

  color:var(--muted);

  font:
    12px
    "JetBrains Mono",
    ui-monospace,
    monospace;

  margin-top:11px;
}

/* =========================================================
   ADD
   ========================================================= */

.add-row{
  display:flex;
  justify-content:flex-end;

  margin:20px 0 14px;
}

.plus-button{
  --tint:var(--physics);

  width:44px;
  height:44px;

  display:grid;
  place-items:center;

  border:1px solid var(--border2);
  border-radius:12px;

  background:rgba(255,253,247,.86);

  color:var(--tint);

  font:
    500 27px
    "Space Grotesk",
    sans-serif;

  line-height:1;

  cursor:pointer;

  box-shadow:
    0 7px 18px rgba(35,37,32,.08);

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.plus-button:hover{
  transform:translateY(-2px);

  box-shadow:
    0 12px 24px rgba(35,37,32,.12);
}

.plus-button:active{
  transform:scale(.94);
}

/* =========================================================
   CHAPTER
   ========================================================= */

.chapters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.chapter{
  --tint:var(--physics);

  background:
    rgba(255,253,247,.92);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:
    1px solid
    var(--border2);

  border-left:
    5px solid
    var(--tint);

  border-radius:16px;

  padding:20px;

  box-shadow:
    0 9px 24px rgba(35,37,32,.07);

  animation:
    rise
    .55s
    cubic-bezier(.16,1,.3,1)
    both;
}

.chapter-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:16px;
}

.chapter-title{
  font:
    600 19px
    "Space Grotesk",
    "Segoe UI",
    system-ui,
    sans-serif;
}

.chapter-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;

  margin-top:5px;
}

.linkbtn{
  border:0;
  padding:0;

  background:transparent;

  color:var(--muted);

  font-size:12px;

  text-decoration:underline;

  cursor:pointer;
}

.linkbtn:hover{
  color:var(--ink);
}

.chapter-progress{
  flex:0 0 auto;

  font:
    600 18px
    "JetBrains Mono",
    ui-monospace,
    monospace;
}

/* =========================================================
   PROGRESS
   ========================================================= */

.bar{
  height:8px;

  margin-top:14px;

  border-radius:999px;

  overflow:hidden;

  background:
    rgba(35,37,32,.08);
}

.bar > div{
  height:100%;

  border-radius:999px;

  background:var(--tint);

  transition:
    width .28s ease;
}

.row-label{
  color:var(--muted);

  font-size:12px;

  margin-top:12px;
}

/* =========================================================
   DOTS
   ========================================================= */

.dots{
  display:flex;
  flex-wrap:wrap;

  gap:7px;

  margin-top:6px;
}

.dot{
  width:30px;
  height:30px;

  display:grid;
  place-items:center;

  padding:0;

  border:
    1px solid
    var(--tint);

  border-radius:50%;

  background:
    rgba(255,255,255,.42);

  color:var(--ink);

  font:
    500 12px
    "JetBrains Mono",
    ui-monospace,
    monospace;

  cursor:pointer;

  transition:
    transform .16s ease,
    background .16s ease,
    color .16s ease,
    box-shadow .16s ease;
}

.dot:hover{
  transform:scale(1.08);
}

.dot:active{
  transform:scale(.90);
}

.dot.done{
  background:var(--tint);
  color:#fff;
  border-color:var(--tint);
}

.dot.done:hover{
  transform:scale(1.10);
}

/* =========================================================
   STARS
   ========================================================= */

.stars{
  display:flex;
  gap:2px;

  margin-top:5px;
}

.star{
  border:0;
  background:transparent;

  padding:0;

  color:
    rgba(35,37,32,.18);

  font-size:20px;
  line-height:1;

  cursor:pointer;

  transition:
    color .16s ease,
    transform .16s ease;
}

.star.on{
  color:var(--tint);
}

.star:hover{
  transform:scale(1.08);
}

.star:active{
  transform:scale(.92);
}

/* =========================================================
   QUICK ADD
   ========================================================= */

.quick-add{
  position:fixed;

  left:50%;
  bottom:
    max(22px,env(safe-area-inset-bottom));

  transform:
    translateX(-50%);

  width:62px;
  height:62px;

  border:0;
  border-radius:50%;

  background:var(--ink);

  color:#fff;

  font:
    400 32px
    "Space Grotesk",
    sans-serif;

  line-height:1;

  cursor:pointer;

  z-index:40;

  box-shadow:
    0 12px 30px rgba(0,0,0,.22);

  transition:
    transform .35s cubic-bezier(.34,1.56,.64,1),
    box-shadow .25s ease;
}

.quick-add:active{
  transform:
    translateX(-50%)
    scale(.9);
}

@media (hover:hover) and (pointer:fine){

  .quick-add:hover{
    transform:
      translateX(-50%)
      translateY(-5px)
      scale(1.06);

    box-shadow:
      0 18px 36px rgba(0,0,0,.28);
  }

}

.wrap:has(#quickMenu.open) .quick-add{
  transform:
    translateX(-50%)
    rotate(45deg);
}

.quick-menu{
  position:fixed;

  left:50%;
  bottom:94px;

  transform:
    translateX(-50%)
    translateY(10px)
    scale(.9);

  z-index:39;

  min-width:190px;

  padding:10px;

  border-radius:18px;

  background:
    rgba(255,253,247,.96);

  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);

  box-shadow:
    0 18px 45px rgba(0,0,0,.2);

  border:
    1px solid
    rgba(0,0,0,.08);

  opacity:0;

  pointer-events:none;

  transform-origin:
    center bottom;

  transition:
    opacity .3s cubic-bezier(.16,1,.3,1),
    transform .3s cubic-bezier(.34,1.56,.64,1);
}

.quick-menu.open{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0)
    scale(1);

  pointer-events:auto;
}

.quick-menu button{
  display:block;

  width:100%;

  text-align:left;

  border:0;

  background:transparent;

  padding:11px 12px;

  border-radius:11px;

  cursor:pointer;

  font:inherit;
}

.quick-menu button:hover{
  background:rgba(0,0,0,.06);
}

/* =========================================================
   SETTINGS
   ========================================================= */

.settings-panel{
  margin-top:38px;

  padding:18px;

  background:var(--paper);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:
    1px solid
    var(--border2);

  border-radius:16px;

  box-shadow:
    0 9px 25px rgba(35,37,32,.07);
}

.settings-actions{
  display:flex;
  flex-wrap:wrap;

  gap:8px;
}

.ghost{
  border:
    1px solid
    var(--border2);

  background:
    rgba(255,255,255,.55);

  color:var(--ink);

  padding:9px 12px;

  border-radius:9px;

  cursor:pointer;

  font-size:12px;

  touch-action:manipulation;
}

.ghost:hover{
  background:
    rgba(255,255,255,.82);
}

.ghost.danger{
  color:#a63e3d;
}

.fileinput{
  display:none;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal-backdrop{
  position:fixed;

  inset:0;

  z-index:1000;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:
    max(20px,env(safe-area-inset-top))
    20px
    max(20px,env(safe-area-inset-bottom));

  background:
    rgba(20,22,18,.28);

  -webkit-backdrop-filter:blur(5px);
  backdrop-filter:blur(5px);

  animation:
    backdropFade
    .25s ease
    both;
}

.modal{
  width:min(430px,100%);

  background:
    rgba(255,253,247,.97);

  border:
    1px solid
    rgba(35,37,32,.20);

  border-radius:20px;

  padding:22px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.20);

  animation:
    modalPop
    .4s
    cubic-bezier(.16,1,.3,1)
    both;
}

.modal h3{
  margin:0;

  font:
    600 21px
    "Space Grotesk",
    sans-serif;
}

.modal-note{
  color:var(--muted);

  font-size:12px;

  margin-top:5px;
}

.modal-fields{
  display:grid;

  gap:10px;

  margin-top:17px;
}

.modal-fields input{
  width:100%;

  border:
    1px solid
    var(--border2);

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){

"use strict";

/* =========================================================
   CONSTANTS
   ========================================================= */

const SUBJECTS = [
  {
    key:"physics",
    name:"Physics",
    color:"var(--physics)"
  },
  {
    key:"maths",
    name:"Maths",
    color:"var(--maths)"
  },
  {
    key:"chemistry",
    name:"Chemistry",
    color:"var(--chemistry)"
  },
  {
    key:"biology",
    name:"Biology",
    color:"var(--biology)"
  }
];

const YEARS = [
  "11th",
  "12th"
];

const TRACKER_KEY =
  "tracker";

const BACKGROUND_KEY =
  "background";

/* =========================================================
   STATE
   ========================================================= */

let settings = {
  title:"Study Tracker"
};

let state = {
  view:"home",
  subject:null,
  year:null,
  background:null,
  data:{}
};

let saveTimer = null;

/* =========================================================
   SUPABASE SYNC
   ========================================================= */

const SUPABASE_URL = "https://kzbtordzxlfppsgavkco.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YnRvcmR6eGxmcHBzZ2F2a2NvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MDQyMDIsImV4cCI6MjEwNDk4MDIwMn0.aWIMj6yTjvU_8Q28BTrcSVsRTCYpAIxZ5dQlAOS7mBs";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const SYNC_CODE_LOCAL_KEY = "study-tracker-sync-code";

function getSyncCode(){
  let code = localStorage.getItem(SYNC_CODE_LOCAL_KEY);
  if(!code){
    code = prompt(
      "Create a sync code for this tracker.\n\n" +
      "Write this down exactly \u2014 you'll type this same code " +
      "on your other devices to see the same data:"
    );
    if(!code || !code.trim()){
      code = "code-" + Math.random().toString(36).slice(2,10);
      alert("No code entered \u2014 generated one for you:\n\n" + code +
        "\n\nWrite this down to use on your other devices.");
    }
    code = code.trim().toLowerCase();
    localStorage.setItem(SYNC_CODE_LOCAL_KEY, code);
  }
  return code;
}

const SYNC_CODE = getSyncCode();

async function dbGet(key){
  const { data, error } = await supabaseClient
    .from("tracker_sync")
    .select("payload, background")
    .eq("sync_code", SYNC_CODE)
    .maybeSingle();
  if(error) throw error;
  if(!data) return undefined;
  if(key === TRACKER_KEY) return data.payload || undefined;
  if(key === BACKGROUND_KEY) return data.background || undefined;
  return undefined;
}

async function dbSet(key, value){
  const patch = { sync_code: SYNC_CODE, updated_at: new Date().toISOString() };
  if(key === TRACKER_KEY) patch.payload = value;
  if(key === BACKGROUND_KEY) patch.background = value;
  const { error } = await supabaseClient
    .from("tracker_sync")
    .upsert(patch, { onConflict: "sync_code" });
  if(error) throw error;
}

async function dbDelete(key){
  if(key === BACKGROUND_KEY){
    const { error } = await supabaseClient
      .from("tracker_sync")
      .update({ background: null })
      .eq("sync_code", SYNC_CODE);
    if(error) throw error;
  }
}

/* =========================================================
   DATA
   ========================================================= */

function uid(){

  return (
    "id_" +
    Math.random()
      .toString(36)
      .slice(2,10)
  );

}

function blankData(){

  return Object.fromEntries(

    SUBJECTS.map(
      subject => [

        subject.key,

        {
          years:
            Object.fromEntries(

              YEARS.map(
                year => [

                  year,

                  {
                    chapters:[]
                  }

                ]
              )

            )
        }

      ]
    )

  );

}

function normalizeChapter(
  chapter
){

  const total =
    Math.max(
      1,
      Number(
        chapter.totalLectures
      ) || 1
    );

  return {

    id:
      chapter.id ||
      uid(),

    name:
      String(
        chapter.name ||
        "Chapter"
      ),

    totalLectures:
      total,

    completedLectures:
      Math.min(
        total,
        Math.max(
          0,
          Number(
            chapter.completedLectures
          ) || 0
        )
      ),

    confidence:
      Math.min(
        5,
        Math.max(
          0,
          Number(
            chapter.confidence
          ) || 0
        )
      )

  };

}

function normalizeData(
  source
){

  const fresh =
    blankData();

  SUBJECTS.forEach(
    subject => {

      const incoming =
        source?.[
          subject.key
        ];

      if(!incoming){
        return;
      }

      YEARS.forEach(
        year => {

          const incomingYear =
            incoming?.years?.[year];

          if(!incomingYear){
            return;
          }

          let chapters = [];

          if(
            Array.isArray(
              incomingYear.chapters
            )
          ){

            chapters =
              incomingYear.chapters;

          }else if(
            Array.isArray(
              incomingYear.units
            )
          ){

            incomingYear.units.forEach(
              unit => {

                if(
                  Array.isArray(
                    unit.chapters
                  )
                ){

                  chapters.push(
                    ...unit.chapters
                  );

                }

              }
            );

          }

          fresh[
            subject.key
          ]
          .years[
            year
          ]
          .chapters =
            chapters.map(
              normalizeChapter
            );

        }
      );

    }
  );

  return fresh;

}

function allChapters(
  key,
  year
){

  const result = [];

  const years =
    year
      ? [year]
      : YEARS;

  const subject =
    state.data[key];

  if(
    !subject ||
    !subject.years
  ){

    return result;

  }

  years.forEach(
    currentYear => {

      const yearData =
        subject
          .years[
            currentYear
          ];

      if(!yearData){
        return;
      }

      if(
        Array.isArray(
          yearData.chapters
        )
      ){

        result.push(
          ...yearData.chapters
        );

      }

    }
  );

  return result;

}

/* =========================================================
   STATS
   ========================================================= */

function stats(
  chapters
){

  let total = 0;
  let done = 0;
  let finished = 0;

  let confidenceSum = 0;
  let confidenceCount = 0;

  chapters.forEach(
    chapter => {

      const totalLectures =
        Math.max(
          0,
          Number(
            chapter.totalLectures
          ) || 0
        );

      const completedLectures =
        Math.min(
          totalLectures,
          Math.max(
            0,
            Number(
              chapter.completedLectures
            ) || 0
          )
        );

      total +=
        totalLectures;

      done +=
        completedLectures;

      if(
        totalLectures > 0 &&
        completedLectures ===
          totalLectures
      ){

        finished++;

      }

      const confidence =
        Number(
          chapter.confidence
        ) || 0;

      if(confidence > 0){

        confidenceSum +=
          confidence;

        confidenceCount++;

      }

    }
  );

  return {

    total,

    done,

    chapters:
      chapters.length,

    finished,

    pct:
      total
        ? Math.round(
            done /
            total *
            100
          )
        : 0,

    avgConf:
      confidenceCount
        ? confidenceSum /
          confidenceCount
        : 0

  };

}

function overall(){

  return stats(

    SUBJECTS.flatMap(
      subject =>
        allChapters(
          subject.key
        )
    )

  );

}

/* =========================================================
   ESCAPE
   ========================================================= */

function esc(
  value
){

  return String(
    value
  ).replace(
    /[&<>"']/g,
    character =>
      ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#039;"
      })[
        character
      ]
  );

}

/* =========================================================
   LOAD
   ========================================================= */

async function load(){

  state.data =
    blankData();

  try{

    const stored =
      await dbGet(
        TRACKER_KEY
      );

    if(stored){

      if(stored.settings){

        settings = {
          ...settings,
          ...stored.settings
        };

      }

      if(stored.data){

        state.data =
          normalizeData(
            stored.data
          );

      }

    }

  }catch(error){

    console.warn(
      "Could not load tracker data.",
      error
    );

  }

  try{

    const background =
      await dbGet(
        BACKGROUND_KEY
      );

    if(background){

      state.background =
        background;

    }

  }catch(error){

    console.warn(
      "Could not load background.",
      error
    );

  }

}

/* =========================================================
   SAVE
   ========================================================= */

function save(){

  clearTimeout(
    saveTimer
  );

  saveTimer =
    setTimeout(
      async()=>{

        try{

          await dbSet(

/* =========================================================
   BACKGROUND
   ========================================================= */

function applyBackground(){

  const layer =
    document.getElementById(
      "backgroundLayer"
    );

  if(!layer){
    return;
  }

  layer.style.backgroundImage =
    state.background
      ? `url("${state.background}")`

}

/* =========================================================
   BACKGROUND · POINTER PARALLAX
   =========================================================
   On desktop / trackpad devices, the wave drifts a few
   pixels toward the cursor for a subtle depth effect.
   Skipped entirely on touch devices.
*/

function initBackgroundParallax(){

  const finePointer =
    window.matchMedia(
      "(hover:hover) and (pointer:fine)"
    );

  if(
    !finePointer.matches
  ){

    return;

  }

  const parallax =
    document.getElementById(
      "backgroundParallax"
    );

  if(!parallax){
    return;
  }

  const strength = 16;

  let frame = null;

  window.addEventListener(
    "pointermove",
    event=>{

      if(frame){
        return;
      }

      frame =
        requestAnimationFrame(
          ()=>{

            const x =
              (
                event.clientX /
                window.innerWidth -
                .5
              ) *
              strength;

            const y =
              (
                event.clientY /
                window.innerHeight -
                .5
              ) *
              strength;

            parallax.style.transform =
              `translate3d(${(-x).toFixed(2)}px,${(-y).toFixed(2)}px,0)`;

            frame = null;

          }
        );

    },
    { passive:true }
  );

  window.addEventListener(
    "pointerleave",
    ()=>{

      parallax.style.transform =
        "translate3d(0,0,0)";

    }
  );

}

/* =========================================================
   BACKGROUND · SEA SPRAY PARTICLES
   =========================================================
   A handful of soft specks drifting upward behind the
   content, like sea spray lifting off the wave.
*/

function initBackgroundParticles(){

  const container =
    document.getElementById(
      "backgroundParticles"
    );

  if(!container){
    return;
  }

  const count = 16;

  for(
    let i = 0;
    i < count;
    i++
  ){

    const speck =
      document.createElement(
        "span"
      );

    speck.className =
      "spray";

    const left =
      Math.random() * 100;

    const size =
      3 +
      Math.random() * 3;

    const duration =
      16 +
      Math.random() * 14;

    const delay =
      -Math.random() *
      duration;

    const drift =
      Math.round(
        (Math.random() - .5) *
        90
      );

    speck.style.left =
      `${left}%`;

    speck.style.width =
      `${size}px`;

    speck.style.height =
      `${size}px`;

    speck.style.animationDuration =
      `${duration}s`;

    speck.style.animationDelay =
      `${delay}s`;

    speck.style.setProperty(
      "--drift",
      `${drift}px`
    );

    container.appendChild(
      speck
    );

  }

}

/* =========================================================
   EXPORT
   ========================================================= */

function exportData(){

  const backup = {

    version:1,

    exportedAt:
      new Date()
        .toISOString(),

    settings,

    data:
      state.data,

    background:
      state.background

  };

  const blob =
    new Blob(
      [
        JSON.stringify(
          backup,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const anchor =
    document.createElement(
      "a"
    );

  anchor.href =
    url;

  anchor.download =
    "study-tracker-backup.json";

  document.body.appendChild(
    anchor
  );

  anchor.click();

  anchor.remove();

  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    100
  );

}

/* =========================================================
   IMPORT
   ========================================================= */

function importData(
  file
){

  const reader =
    new FileReader();

  reader.onload =
    async function(){

      try{

        const backup =
          JSON.parse(
            reader.result
          );

        if(backup.settings){

          settings = {
            ...settings,
            ...backup.settings
          };

        }

        state.data =
          normalizeData(
            backup.data || {}
          );

        if(
          typeof backup.background ===
            "string" &&
          backup.background
        ){

          state.background =
            backup.background;

          applyBackground();

          await dbSet(
            BACKGROUND_KEY,
            state.background
          );

        }

        save();

        render();

        alert(
          "Backup imported successfully."
        );

      }catch(error){

        console.error(
          error
        );

        alert(
          "Invalid backup file."
        );

      }

    };

  reader.readAsText(
    file
  );

}

/* =========================================================
   RESET

async function resetAll(){

  state.data =

  state.view =

  state.year =

  await dbSet(
    TRACKER_KEY,
    {
      settings,
      data:
        state.data

  render();

}

/* =========================================================
   HOME
   ========================================================= */

function home(){

  const overallStats =

  return shell(`

    <div

<div class="stat">

        >

        </div>

        <div class="stat-label">

        </div>

      </div>

<div class="stat">

        <div
          class="stat-num"

        >
          ${overallStats.done}/${overallStats.total}
        </div>

<div class="stat">

        <div

          ${
            overallStats.avgConf

        </div>

        <div class="stat-label">

   ========================================================= */

function chapterCard(
  subject,
  chapter,
  index
){

  const percentage =
    chapter.totalLectures
      ? Math.round(
          chapter.completedLectures /
          chapter.totalLectures *
          100
        )
      : 0;

  const dots =
    Array.from(
      {
        length:
          chapter.totalLectures
      },
      (_,dotIndex)=>`

        <button
          class="dot ${
            dotIndex <
            chapter.completedLectures
              ? "done"
              : ""
          }"
          data-action="lecture"
          data-id="${esc(chapter.id)}"
          data-index="${dotIndex}"
          title="Lecture ${dotIndex + 1}"
          type="button"
        >
          ${dotIndex + 1}
        </button>

      `
    ).join("");

  const stars =
    Array.from(
      {
        length:5
      },
      (_,starIndex)=>`

        <button
          class="star ${
            starIndex <
            chapter.confidence
              ? "on"
              : ""
          }"
          data-action="confidence"
          data-id="${esc(chapter.id)}"
          data-value="${starIndex + 1}"
          title="${starIndex + 1}/5"
          type="button"
        >
          ★
        </button>

    ).join("");

  return `

    <div
      class="chapter"
      style="
        --tint:${subject.color};
        animation-delay:${(index || 0) * .04}s
      "
      data-chapter-id="${esc(chapter.id)}"
    >

        <div>

          <div class="chapter-title">
            ${esc(chapter.name)}
          </div>

          <div class="chapter-actions">

              class="linkbtn"
              data-action="rename"
              data-id="${esc(chapter.id)}"
              type="button"
            >
              rename
            </button>

            <button
              class="linkbtn"
              data-action="edit-total"
              data-id="${esc(chapter.id)}"
              type="button"
            >
              edit lectures
            </button>

            <button
              class="linkbtn"
              data-action="delete"
              data-id="${esc(chapter.id)}"
              type="button"
            >
              delete
            </button>

          </div>

        </div>

        <div class="chapter-progress">
          ${chapter.completedLectures}/${chapter.totalLectures}
        </div>

      </div>

      <div class="bar">

        <div
          style="
            width:${percentage}%
          "
        ></div>

      </div>

      <div class="row-label">
        Lecture progress · ${percentage}%
      </div>

      <div class="dots">
        ${dots}
      </div>

      <div class="row-label">
        Confidence ·
        ${
          chapter.confidence
            ? chapter.confidence + "/5"
            : "Not rated"
        }
      </div>

      <div class="stars">
        ${stars}
      </div>

    </div>

  `;

}

/* =========================================================
   CHAPTER CARD LIVE UPDATE
   ========================================================= */

function updateChapterCard(
  card,
  chapter
){

  if(
    !card ||
    !chapter
  ){

    return;

  }

  const percentage =
    chapter.totalLectures
      ? Math.round(
          chapter.completedLectures /
          chapter.totalLectures *
          100
        )
      : 0;

  const progress =
    card.querySelector(
      ".chapter-progress"
    );

  if(progress){

    progress.textContent =
      `${chapter.completedLectures}/${chapter.totalLectures}`;

  }

  const fill =
    card.querySelector(
      ".bar > div"
    );

  if(fill){

    fill.style.width =
      percentage + "%";

  }

  const labels =
    card.querySelectorAll(
      ".row-label"
    );

  if(labels[0]){

    labels[0].textContent =
      `Lecture progress · ${percentage}%`;

  }

  if(labels[1]){

    labels[1].textContent =
      `Confidence · ${
        chapter.confidence
          ? chapter.confidence + "/5"
          : "Not rated"
      }`;

  }

  card
    .querySelectorAll(
      '.dot[data-action="lecture"]'
    )
    .forEach(
      dot=>{

        const index =
          Number(
            dot.dataset.index
          );

        dot.classList.toggle(
          "done",
          index <
            chapter.completedLectures
        );

      }
    );

  card
    .querySelectorAll(
      '.star[data-action="confidence"]'
    )
    .forEach(
      star=>{

        const value =
          Number(
            star.dataset.value
          );

        star.classList.toggle(
          "on",
          value <=
            chapter.confidence
        );

      }
    );

}

/* =========================================================
   ⭐ LIVE STATS FIX
   =========================================================

   IMPORTANT:

   We calculate the visible stats directly from the
   chapter cards currently on screen.

   This avoids relying on a second state calculation
   immediately after a click.

   Therefore:

     2/4 -> click -> 3/4

   immediately becomes:

     50% -> 75%
     2/4  -> 3/4

   and when the final lecture is clicked:

     100%
     4/4
     1/1
*/

function updateVisibleStats(){

  const statsBox =
    document.querySelector(
      ".stats[data-stats-scope='year']"
    );

  if(!statsBox){

    return;

  }

  const cards =
    Array.from(
      document.querySelectorAll(
        ".chapter"
      )
    );

  let total = 0;
  let done = 0;
  let finished = 0;

  let confidenceSum = 0;
  let confidenceCount = 0;

  cards.forEach(
    card=>{

      const progress =
        card.querySelector(
          ".chapter-progress"
        );

      if(progress){

        const match =
          progress.textContent
            .trim()
            .match(
              /^(\d+)\s*\/\s*(\d+)$/
            );

        if(match){

          const completed =
            Number(
              match[1]
            );

          const lectures =
            Number(
              match[2]
            );

          total +=
            lectures;

          done +=
            Math.min(
              completed,
              lectures
            );

          if(
            lectures > 0 &&
            completed === lectures
          ){

            finished++;

          }

        }

      }

      const selectedStars =
        card.querySelectorAll(
          ".star.on"
        ).length;

      if(selectedStars > 0){

        confidenceSum +=
          selectedStars;

        confidenceCount++;

      }

    }
  );

  const chapterCount =
    cards.length;

  const percentage =
    total > 0
      ? Math.round(
          done /
          total *
          100
        )
      : 0;

  const averageConfidence =
    confidenceCount > 0
      ? confidenceSum /
        confidenceCount
      : 0;

  const pctElement =
    statsBox.querySelector(
      '[data-stat="pct"]'
    );

  const lecturesElement =
    statsBox.querySelector(
      '[data-stat="lectures"]'
    );

  const chaptersElement =
    statsBox.querySelector(
      '[data-stat="chapters"]'
    );

  const confidenceElement =
    statsBox.querySelector(
      '[data-stat="confidence"]'
    );

  if(pctElement){

    pctElement.textContent =
      `${percentage}%`;

  }

  if(lecturesElement){

    lecturesElement.textContent =
      `${done}/${total}`;

  }

  if(chaptersElement){

    chaptersElement.textContent =
      `${finished}/${chapterCount}`;

  }

  if(confidenceElement){

    confidenceElement.textContent =
      `${
        averageConfidence
          ? averageConfidence.toFixed(1)
          : "—"
      } / 5`;

  }

}

function createChapterModal(){

  const subject =
    SUBJECTS.find(
      item =>
        item.key ===
        state.subject
    );

  if(!subject){
    return;
  }

  const backdrop =
    document.createElement(
      "div"
    );

  backdrop.className =
    "modal-backdrop";

  backdrop.innerHTML = `

    <div
      class="modal"
      style="--tint:${subject.color}"
    >

      <h3>
        Add chapter
      </h3>

      <div class="modal-note">
        Add the chapter and total number of lectures.
      </div>

      <div class="modal-fields">

        <input
          id="modalChapterName"
          type="text"
          placeholder="Chapter name"
          autocomplete="off"
        >

        <input
          id="modalLectureTotal"
          type="number"
          min="1"
          inputmode="numeric"
          placeholder="Total lectures"
        >

      </div>

      <div class="modal-actions">

        <button
          class="secondary"
          id="modalCancel"
          type="button"
        >
          Cancel
        </button>

        <button
          class="primary"
          id="modalAdd"
          type="button"
        >
          Add chapter
        </button>

      </div>

    </div>

  `;

  document.body.appendChild(
    backdrop
  );

  const nameInput =
    backdrop.querySelector(
      "#modalChapterName"
    );

  const lectureInput =
    backdrop.querySelector(
      "#modalLectureTotal"
    );

  function close(){

    backdrop.remove();

  }

  backdrop
    .querySelector(
      "#modalCancel"
    )
    .onclick =
      close;

  backdrop.addEventListener(
    "click",
    event=>{

      if(
        event.target ===
        backdrop
      ){

        close();

      }

    }
  );

  backdrop
    .querySelector(
      "#modalAdd"
    )
    .onclick =
      ()=>{

        const name =
          nameInput.value.trim();

        let total =
          parseInt(
            lectureInput.value,
            10
          );

        if(!name){

          nameInput.focus();

          return;

        }

        if(
          !Number.isFinite(total) ||
          total < 1
        ){

          total = 1;

        }

        const yearData =
          state.data[
            state.subject
          ]
          .years[
            state.year
          ];

        if(
          !Array.isArray(
            yearData.chapters
          )
        ){

          yearData.chapters = [];

        }

        yearData.chapters.push({

          id:uid(),

          name,

          totalLectures:
            Math.min(
              total,
              1000
            ),

          completedLectures:0,

          confidence:0

        });

        save();

        close();

        render();

      };

  setTimeout(
    ()=>{
      nameInput.focus();
    },
    50
  );

}

/* =========================================================
   RENDER
   ========================================================= */

function render(){

  const app =
    document.getElementById(
      "app"
    );

  if(!app){
    return;
  }

  if(
    state.view ===
    "home"
  ){

    app.innerHTML =
      home();

  }else if(
    state.view ===
    "subject"
  ){

    app.innerHTML =
      subjectPage(
        state.subject
      );

  }else{

    app.innerHTML =
      yearPage(
        state.subject,
        state.year
      );

  }

  bindCommon();

  const page =
    app.firstElementChild;

  if(page){

    page.classList.remove(
      "page-enter"
    );

    void page.offsetWidth;

    page.classList.add(
      "page-enter"
    );

  }

  /* =======================================================
     HOME
     ======================================================= */

  if(
    state.view ===
    "home"
  ){

    document
      .querySelectorAll(
        "[data-subject]"
      )
      .forEach(
        button=>{

          button.onclick =
            ()=>{

              state.view =
                "subject";

              state.subject =
                button.dataset
                  .subject;

              render();

            };

        }
      );

  }

  /* =======================================================
     SUBJECT
     ======================================================= */

  if(
    state.view ===
    "subject"
  ){

    const back =
      document.getElementById(
        "back"
      );

    if(back){

      back.onclick =
        ()=>{

          state.view =
            "home";

          render();

        };

    }

    document
      .querySelectorAll(
        "[data-year]"
      )
      .forEach(
        button=>{

          button.onclick =
            ()=>{

              state.view =
                "year";

              state.year =
                button.dataset
                  .year;

              render();

            };

        }
      );

  }

  /* =======================================================
     YEAR
     ======================================================= */

  if(
    state.view ===
    "year"
  ){

    const back =
      document.getElementById(
        "back"
      );

    if(back){

      back.onclick =
        ()=>{

          state.view =
            "subject";

          render();

        };

    }

    const addChapterButton =
      document.getElementById(
        "addChapterButton"
      );

    if(addChapterButton){

      addChapterButton.onclick =
        ()=>{
          createChapterModal();
        };

    }

    const chaptersContainer =
      document.querySelector(
        ".chapters"
      );

    if(chaptersContainer){

      chaptersContainer.addEventListener(
        "click",
        event=>{

          const button =
            event.target.closest(
              "[data-action]"
            );

          if(!button){
            return;
          }

          const yearData =
            state.data[
              state.subject
            ]
            ?.years?.[
              state.year
            ];

          if(!yearData){
            return;
          }

          const chapter =
            yearData.chapters.find(
              item =>
                item.id ===
                button.dataset.id
            );

          if(!chapter){
            return;
          }

          const action =
            button.dataset.action;

          /* =================================================
             LECTURE
             ================================================= */

          if(
            action ===
            "lecture"
          ){

            const index =
              Number(
                button.dataset.index
              );

            chapter.completedLectures =
              (
                index + 1 ===
                chapter.completedLectures
              )
                ? index
                : index + 1;

            chapter.completedLectures =
              Math.min(
                chapter.completedLectures,
                chapter.totalLectures
              );

            save();

            /*
              First update the chapter card.
            */
            updateChapterCard(
              button.closest(
                ".chapter"
              ),
              chapter
            );

            /*
              Then immediately calculate the TOP
              stats from the visible chapter cards.
            */
            updateVisibleStats();

            return;

          }

          /* =================================================
             CONFIDENCE
             ================================================= */

          if(
            action ===
            "confidence"
          ){

            const value =
              Number(
                button.dataset.value
              );

            chapter.confidence =
              chapter.confidence ===
              value
                ? 0
                : value;

            save();

            updateChapterCard(
              button.closest(
                ".chapter"
              ),
              chapter
            );

            /*
              Confidence average also updates immediately.
            */
            updateVisibleStats();

            return;

          }

          /* =================================================
             RENAME
             ================================================= */

          if(
            action ===
            "rename"
          ){

            const nextName =
              prompt(
                "Rename chapter:",
                chapter.name
              );

            if(
              nextName ===
              null
            ){

              return;

            }

            const clean =
              nextName.trim();

            if(!clean){

              return;

            }

            chapter.name =
              clean;

            save();

            render();

            return;

          }

          /* =================================================
             EDIT TOTAL
             ================================================= */

          if(
            action ===
            "edit-total"
          ){

            const raw =
              prompt(
                "Total lectures:",
                chapter.totalLectures
              );

            if(
              raw ===
              null
            ){

              return;

            }

            const total =
              parseInt(
                raw,
                10
              );

            if(
              !Number.isFinite(total) ||
              total < 1
            ){

              return;

            }

            chapter.totalLectures =
              Math.min(
                total,
                1000
              );

            chapter.completedLectures =
              Math.min(
                chapter.completedLectures,
                chapter.totalLectures
              );

            save();

            render();

            return;

          }

          /* =================================================
             DELETE
             ================================================= */

          if(
            action ===
            "delete"
          ){

            if(
              !confirm(
                "Delete this chapter?"
              )
            ){

              return;

            }

            yearData.chapters =
              yearData.chapters.filter(
                item =>
                  item.id !==
                  chapter.id
              );

            save();

            render();

          }

        }
      );

    }

  }

}

/* =========================================================
   IMPORT FILE
   ========================================================= */

document
  .getElementById(
    "importFile"
  )
  .addEventListener(
    "change",
    event=>{

      const file =
        event.target.files?.[0];

      if(file){

        importData(
          file
        );

      }

      event.target.value =
        "";

    }
  );

/* =========================================================
   BACKGROUND FILE
   ========================================================= */

document
  .getElementById(
    "bgFile"
  )
  .addEventListener(
    "change",
    event=>{

      const file =
        event.target.files?.[0];

      if(!file){
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        event=>{

          const image =
            new Image();

          image.onload =
            async()=>{

              const max =
                1800;

              const scale =
                Math.min(
                  1,
                  max /
                  image.width
                );

              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                Math.round(
                  image.width *
                  scale
                );

              canvas.height =
                Math.round(
                  image.height *
                  scale
                );

              const context =
                canvas.getContext(
                  "2d"
                );

              context.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
              );

              state.background =
                canvas.toDataURL(
                  "image/jpeg",
                  .8
                );

              applyBackground();

              try{

                await dbSet(
                  BACKGROUND_KEY,
                  state.background
                );

              }catch(error){

                alert(
                  "That image could not be saved. Try a smaller photo."
                );

              }

            };

          image.src =
            event.target.result;

        };

      reader.readAsDataURL(
        file
      );

      event.target.value =
        "";

    }
  );

/* =========================================================
   CLOSE QUICK MENU
   ========================================================= */

document.addEventListener(
  "click",
  event=>{

    const menu =
      document.getElementById(
        "quickMenu"
      );

    const button =
      document.getElementById(
        "quickAdd"
      );

    if(
      menu &&
      menu.classList.contains(
        "open"
      ) &&
      !menu.contains(
        event.target
      ) &&
      event.target !==
        button
    ){

      menu.classList.remove(
        "open"
      );

    }

  }
);

/* =========================================================
   SERVICE WORKER
   ========================================================= */

if(
  "serviceWorker" in
  navigator
){

  window.addEventListener(
    "load",
    ()=>{

      navigator.serviceWorker
        .register(
          "./service-worker.js"
        )
        .catch(
          error=>{

            console.warn(
              "Service worker registration failed:",
              error
            );

          }
        );

    }
  );

}

/* =========================================================
   IOS :ACTIVE FIX
   =========================================================
   Safari on iPhone / iPad only honours the :active
   pseudo-class once at least one touchstart listener
   exists, so tap feedback (dots, stars, tiles) works
   reliably on iOS.
*/

document.addEventListener(
  "touchstart",
  ()=>{},
  { passive:true }
);

/* =========================================================
   INIT
   ========================================================= */

(async function(){

  await load();

  applyBackground();

  initBackgroundParallax();

  initBackgroundParticles();

  render();

})();

})();
</script>
