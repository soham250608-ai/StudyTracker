<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#f4f2ea"
>

<title>Study Tracker</title>

<link
  rel="manifest"
  href="./manifest.json"
>

<link
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>

:root{

  --bg:#f4f2ea;

  --paper:rgba(255,253,247,.92);

  --ink:#232520;

  --muted:#6b6d63;

  --border:rgba(35,37,32,.14);

  --border2:rgba(35,37,32,.28);

  --physics:#3d5a80;

  --maths:#d4a900;

  --chemistry:#b94a48;

  --biology:#4f8a5b;

  --user-bg:none;

}


*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}


html,
body{
  min-height:100%;
  margin:0;
}


body{

  color:var(--ink);

  font-family:
    "Space Grotesk",
    "Segoe UI",
    system-ui,
    sans-serif;

  background-color:var(--bg);

  background-image:var(--user-bg);

  background-size:cover;

  background-position:center top;

  background-repeat:no-repeat;

  background-attachment:scroll;

  transition:
    background-image .4s ease;
}


button,
input,
select{
  font:inherit;
}


button{
  -webkit-appearance:none;
}


.wrap{

  max-width:1000px;

  margin:auto;

  padding:
    34px
    20px
    70px;

}


/* =========================================================
   FONTS
========================================================= */

.display{

  font-family:
    "Space Grotesk",
    "Segoe UI",
    system-ui,
    sans-serif;

}


.mono{

  font-family:
    "JetBrains Mono",
    ui-monospace,
    monospace;

}


/* =========================================================
   TOP
========================================================= */

.topbar{

  margin-bottom:25px;

}


.brand{

  font:
    600 34px
    "Space Grotesk",
    system-ui,
    sans-serif;

  margin:0;

  padding:2px 6px;

  margin-left:-6px;

  outline:0;

  border-radius:8px;

  cursor:default;

  user-select:none;

}


/*
  Deliberately NOT contenteditable.
*/

.brand:hover,
.brand:focus{

  background:transparent;

  box-shadow:none;

}


/* =========================================================
   STATS
========================================================= */

.stats{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  background:var(--paper);

  backdrop-filter:blur(12px);

  -webkit-backdrop-filter:blur(12px);

  border:
    1px
    solid
    var(--border2);

  border-radius:16px;

  overflow:hidden;

  margin:
    20px
    0
    27px;

  box-shadow:
    0
    9px
    25px
    rgba(35,37,32,.07);

}


.stat{

  padding:16px;

  border-right:
    1px
    solid
    var(--border);

  transition:.2s;

}


.stat:last-child{
  border-right:0;
}


.stat:hover{
  background:rgba(255,255,255,.45);
}


.stat-num{

  font:
    600 25px
    "JetBrains Mono",
    ui-monospace,
    monospace;

  line-height:1.15;

}


.stat-label{

  font-size:12px;

  color:var(--muted);

  margin-top:5px;

}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes rise{

  0%{

    opacity:0;

    transform:
      translateY(16px)
      scale(.9);

  }

  55%{

    opacity:1;

    transform:
      translateY(-4px)
      scale(1.03);

  }

  80%{

    transform:
      translateY(1px)
      scale(.995);

  }

  100%{

    opacity:1;

    transform:
      translateY(0)
      scale(1);

  }

}


.page-enter{

  animation:
    pageEnter
    .42s
    cubic-bezier(.2,.8,.2,1)
    both;

}


@keyframes pageEnter{

  from{

    opacity:0;

    transform:
      translateY(15px);

  }

  to{

    opacity:1;

    transform:
      translateY(0);

  }

}


/* =========================================================
   RIPPLE
========================================================= */

.ripple{

  position:absolute;

  width:20px;

  height:20px;

  border-radius:50%;

  pointer-events:none;

  background:var(--tint);

  opacity:.24;

  transform:
    translate(-50%,-50%)
    scale(0);

  animation:
    rippleExpand
    .62s
    cubic-bezier(.2,.7,.2,1)
    forwards;

  z-index:1;

}


@keyframes rippleExpand{

  0%{

    transform:
      translate(-50%,-50%)
      scale(0);

    opacity:.28;

  }

  50%{
    opacity:.16;
  }

  100%{

    transform:
      translate(-50%,-50%)
      scale(24);

    opacity:0;

  }

}


/* =========================================================
   SUBJECT TILES
========================================================= */

.tiles{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:16px;

}


.tile{

  --tint:var(--physics);

  position:relative;

  overflow:hidden;

  background:var(--paper);

  backdrop-filter:blur(12px);

  -webkit-backdrop-filter:blur(12px);

  border:
    1px
    solid
    var(--border2);

  border-left:
    5px
    solid
    var(--tint);

  border-radius:16px;

  padding:22px;

  text-align:left;

  cursor:pointer;

  color:var(--ink);

  box-shadow:
    0
    9px
    24px
    rgba(35,37,32,.07);

  transition:
    transform .23s,
    box-shadow .23s;

  animation:
    rise .5s both;

  touch-action:manipulation;

}


.tile::after{

  content:"";

  position:absolute;

  width:155px;

  height:155px;

  border-radius:50%;

  right:-78px;

  top:-78px;

  background:var(--tint);

  opacity:.12;

  transition:
    transform .35s,
    opacity .25s;

  z-index:0;

}


.tile>*{
  position:relative;
  z-index:2;
}


.tile:hover{

  transform:
    translateY(-5px)
    scale(1.008);

  box-shadow:
    0
    18px
    35px
    rgba(35,37,32,.13);

}


.tile:hover::after{

  transform:scale(1.55);

  opacity:.17;

}


.tile:active{
  transform:scale(.985);
}


.tile-head{

  display:flex;

  justify-content:space-between;

  align-items:baseline;

}


.tile-name{

  font:
    600 23px
    "Space Grotesk",
    system-ui,
    sans-serif;

  color:var(--tint);

}


.tile-pct{

  font:
    600 26px
    "JetBrains Mono",
    ui-monospace,
    monospace;

}


.bar{

  height:8px;

  background:
    rgba(35,37,32,.08);

  border-radius:99px;

  overflow:hidden;

  margin-top:14px;

}


.bar>div{

  height:100%;

  width:0;

  background:var(--tint);

  border-radius:inherit;

  transition:
    width .35s
    cubic-bezier(.2,.8,.2,1);

}


.tile-meta{

  display:flex;

  justify-content:space-between;

  gap:10px;

  margin-top:12px;

  font-size:12px;

  color:var(--muted);

}


/* =========================================================
   SUBJECT
========================================================= */

.subject-head{

  margin:
    12px
    0
    5px;

}


.subject-title{

  font:
    600 32px
    "Space Grotesk",
    system-ui,
    sans-serif;

  margin:0;

  color:var(--tint);

}


/* =========================================================
   BACK
========================================================= */

.back{

  background:none;

  border:0;

  padding:
    5px
    0;

  color:var(--muted);

  cursor:pointer;

  font:
    600 16px
    "Space Grotesk",
    system-ui,
    sans-serif;

  margin:
    0
    0
    14px;

}


.back:hover{
  color:var(--ink);
}


/* =========================================================
   YEAR TABS
========================================================= */

.year-tabs{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:16px;

}


.year-tab{

  --tint:var(--physics);

  position:relative;

  overflow:hidden;

  background:var(--paper);

  border:
    1px
    solid
    var(--border2);

  border-left:
    5px
    solid
    var(--tint);

  border-radius:16px;

  padding:20px;

  text-align:left;

  color:var(--ink);

  cursor:pointer;

  box-shadow:
    0
    9px
    24px
    rgba(35,37,32,.07);

  transition:
    transform .22s,
    box-shadow .22s;

  animation:
    rise .45s both;

  touch-action:manipulation;

}


.year-tab::after{

  content:"";

  position:absolute;

  width:155px;

  height:155px;

  border-radius:50%;

  right:-78px;

  top:-78px;

  background:var(--tint);

  opacity:.12;

  pointer-events:none;

}


.year-tab:hover{

  transform:translateY(-4px);

  box-shadow:
    0
    16px
    32px
    rgba(35,37,32,.12);

}


.year-tab:active{
  transform:scale(.985);
}


.year-name{

  display:block;

  color:var(--tint);

  font:
    600 27px
    "Space Grotesk",
    system-ui,
    sans-serif;

}


.year-pct{

  display:block;

  margin-top:6px;

  font:
    600 28px
    "JetBrains Mono",
    ui-monospace,
    monospace;

}


.year-meta{

  display:block;

  margin-top:8px;

  color:var(--muted);

  font-size:12px;

}


/* =========================================================
   CHAPTER TOOLBAR
========================================================= */

.chapter-toolbar{

  display:flex;

  align-items:center;

  gap:9px;

  margin:
    18px
    0
    16px;

}


.chapter-search{

  flex:1;

  min-width:0;

  height:42px;

  padding:
    0
    13px;

  background:
    rgba(255,253,247,.94);

  color:var(--ink);

  border:
    1px
    solid
    var(--border2);

  border-radius:10px;

  outline:none;

}


.chapter-search:focus{

  border-color:var(--tint);

  box-shadow:
    0
    0
    0
    3px
    rgba(35,37,32,.07);

}


/* =========================================================
   SMALL PLUS BUTTON
========================================================= */

.add-chapter-btn{

  width:42px;

  height:42px;

  flex:0 0 42px;

  border:
    1px
    solid
    var(--tint);

  border-radius:10px;

  background:
    var(--tint);

  color:white;

  font:
    500 25px
    "Space Grotesk",
    system-ui,
    sans-serif;

  line-height:1;

  cursor:pointer;

  display:grid;

  place-items:center;

  box-shadow:
    0
    5px
    14px
    rgba(35,37,32,.10);

  transition:
    transform .15s,
    filter .15s;

}


.add-chapter-btn:hover{
  filter:brightness(.95);
}


.add-chapter-btn:active{
  transform:scale(.91);
}


/* =========================================================
   SMALL ADD PANEL
========================================================= */

.addbox{

  display:none;

  grid-template-columns:
    1fr
    120px
    auto;

  gap:9px;

  margin:
    0
    0
    16px;

  padding:12px;

  background:var(--paper);

  border:
    1px
    solid
    var(--border2);

  border-radius:12px;

  box-shadow:
    0
    7px
    20px
    rgba(35,37,32,.05);

}


.addbox.open{
  display:grid;
}


.addbox input{

  width:100%;

  height:40px;

  border:
    1px
    solid
    var(--border);

  border-radius:8px;

  background:
    rgba(255,255,255,.72);

  color:var(--ink);

  padding:
    0
    11px;

  outline:none;

}


.addbox input:focus{
  border-color:var(--tint);
}


.primary{

  border:
    1px
    solid
    var(--tint);

  border-radius:8px;

  background:var(--tint);

  color:#fff;

  padding:
    0
    13px;

  cursor:pointer;

  font-weight:600;

}


/* =========================================================
   CHAPTERS — TWO COLUMNS
========================================================= */

.chapters{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:16px;

}


.chapter{

  --tint:var(--physics);

  position:relative;

  overflow:hidden;

  min-width:0;

  border:
    1px
    solid
    var(--border);

  border-left:
    4px
    solid
    var(--tint);

  border-radius:14px;

  padding:18px;

  box-shadow:
    0
    7px
    20px
    rgba(35,37,32,.055);

  animation:
    rise .38s both;

  transition:
    transform .18s,
    box-shadow .18s;

}


.chapter::after{

  content:"";

  position:absolute;

  width:125px;

  height:125px;

  border-radius:50%;

  right:-68px;

  top:-68px;

  background:var(--tint);

  opacity:.07;

  pointer-events:none;

}


.chapter:hover{

  transform:translateY(-2px);

  box-shadow:
    0
    12px
    27px
    rgba(35,37,32,.09);

}


.chapter>*{
  position:relative;
  z-index:2;
}


.chapter-head{

  display:flex;

  justify-content:space-between;

  gap:12px;

}


.chapter-title{

  font:
    600 19px
    "Space Grotesk",
    system-ui,
    sans-serif;

  overflow-wrap:anywhere;

}


.chapter-progress{

  font:
    600 18px
    "JetBrains Mono",
    ui-monospace,
    monospace;

  white-space:nowrap;

}


.chapter-actions{

  display:flex;

  gap:10px;

  margin-top:5px;

  flex-wrap:wrap;

}


.linkbtn{

  border:0;

  background:none;

  padding:0;

  color:var(--muted);

  text-decoration:underline;

  cursor:pointer;

  font-size:12px;

}


.linkbtn:hover{
  color:var(--ink);
}


.row-label{

  font-size:11px;

  color:var(--muted);

  margin:
    14px
    0
    7px;

}


.dots{

  display:flex;

  flex-wrap:wrap;

  gap:7px;

}


/* EXACT ORIGINAL DOT SIZE */

.dot{

  width:30px;

  height:30px;

  border-radius:50%;

  border:
    1.5px
    solid
    var(--tint);

  background:transparent;

  color:var(--ink);

  cursor:pointer;

  padding:0;

  display:grid;

  place-items:center;

  font:
    600 10px
    "JetBrains Mono",
    ui-monospace,
    monospace;

  transition:
    transform .14s ease,
    background .14s ease,
    color .14s ease,
    box-shadow .14s ease;

}


.dot:hover{
  transform:scale(1.10);
}


.dot:active{
  transform:scale(.90);
}


.dot.done{

  background:var(--tint);

  color:#fff;

  box-shadow:
    0
    0
    0
    3px
    rgba(35,37,32,.08);

}


.dot.done:hover{
  transform:scale(1.10);
}


/* =========================================================
   STARS
========================================================= */

.stars{

  display:flex;

  gap:3px;

}


.star{

  background:none;

  border:0;

  padding:0;

  cursor:pointer;

  font-size:21px;

  line-height:1;

  color:
    rgba(35,37,32,.2);

  transition:.15s;

}


.star:hover{
  transform:scale(1.15);
}


.star:active{
  transform:scale(.92);
}


.star.on{
  color:var(--tint);
}


/* =========================================================
   CONTINUE STUDYING
========================================================= */

.continue-card{

  --tint:var(--physics);

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:14px;

  margin:
    0
    0
    20px;

  padding:
    15px
    17px;

  background:var(--paper);

  border:
    1px
    solid
    var(--border2);

  border-left:
    4px
    solid
    var(--tint);

  border-radius:14px;

  box-shadow:
    0
    8px
    22px
    rgba(35,37,32,.07);

  animation:
    rise .45s .05s both;

}


.continue-label{

  font-size:10px;

  color:var(--muted);

  text-transform:uppercase;

  letter-spacing:.08em;

  margin-bottom:3px;

}


.continue-title{

  font:
    600 17px
    "Space Grotesk",
    system-ui,
    sans-serif;

}


.continue-meta{

  font-size:11px;

  color:var(--muted);

  margin-top:3px;

}


.continue-button{

  flex:0 0 auto;

  border:
    1px
    solid
    var(--tint);

  background:var(--tint);

  color:#fff;

  border-radius:8px;

  padding:
    8px
    11px;

  cursor:pointer;

  font-size:11px;

  font-weight:600;

}


/* =========================================================
   SETTINGS
========================================================= */

.settings-panel{

  margin:
    55px
    0
    0;

  padding:
    20px
    0
    0;

  border-top:
    1px
    solid
    var(--border2);

  animation:
    rise .5s .1s both;

}


.settings-head{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:11px;

}


.settings-title{

  font:
    600 19px
    "Space Grotesk",
    system-ui,
    sans-serif;

}


.settings-sub{

  font-size:12px;

  color:var(--muted);

}


.settings-icon{

  font-size:20px;

  opacity:.55;

}


.settings-actions{

  display:flex;

  gap:8px;

  flex-wrap:wrap;

}


.ghost{

  background:var(--paper);

  border:
    1px
    solid
    var(--border2);

  border-radius:8px;

  padding:
    8px
    11px;

  cursor:pointer;

  color:var(--ink);

}


.ghost:hover{
  border-color:var(--ink);
}


.danger{
  opacity:.75;
}


.fileinput{
  display:none;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{

  grid-column:
    1 / -1;

  padding:
    34px
    4px;

  color:var(--muted);

  font:
    italic 16px
    "Space Grotesk",
    system-ui,
    sans-serif;

  text-align:center;

}


/* =========================================================
   CONFETTI
========================================================= */

.confetti-layer{

  position:fixed;

  inset:0;

  pointer-events:none;

  overflow:hidden;

  z-index:9999;

}


.confetti-piece{

  position:absolute;

  top:-20px;

  width:8px;

  height:13px;

  opacity:0;

  animation:
    confettiFall
    1.45s
    cubic-bezier(.15,.65,.3,1)
    forwards;

}


@keyframes confettiFall{

  0%{

    opacity:1;

    transform:
      translate3d(0,0,0)
      rotate(0deg);

  }

  100%{

    opacity:0;

    transform:
      translate3d(
        var(--x),
        110vh,
        0
      )
      rotate(var(--r));

  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:720px){

  .wrap{

    padding-left:15px;

    padding-right:15px;

  }


  .brand{
    font-size:30px;
  }


  .stats{

    grid-template-columns:
      1fr
      1fr;

  }


  .stat:nth-child(2){
    border-right:0;
  }


  .stat:nth-child(-n+2){

    border-bottom:
      1px
      solid
      var(--border);

  }


  .tiles,
  .year-tabs{

    grid-template-columns:
      1fr;

  }


  /*
    KEEP CHAPTERS TWO COLUMNS
  */

  .chapters{

    grid-template-columns:
      1fr
      1fr;

    gap:10px;

  }


  .chapter{

    padding:13px;

    border-left-width:3px;

  }


  .chapter-title{

    font-size:15px;

  }


  .chapter-progress{

    font-size:14px;

  }


  .chapter-actions{

    gap:7px;

  }


  .linkbtn{
    font-size:10px;
  }


  .row-label{
    font-size:10px;
  }


  .dots{
    gap:5px;
  }


  .dot{

    width:30px;

    height:30px;

  }


  .star{
    font-size:19px;
  }


  .addbox{

    grid-template-columns:
      1fr;

  }


  .subject-title{
    font-size:28px;
  }


  .continue-card{

    padding:
      14px;

  }


  .continue-title{
    font-size:15px;
  }

}


@media(max-width:350px){

  .chapters{
    gap:8px;
  }


  .chapter{
    padding:10px;
  }


  .chapter-actions{
    display:none;
  }


  .chapter-title{
    font-size:14px;
  }


  .chapter-progress{
    font-size:12px;
  }


  .dot{

    width:28px;

    height:28px;

  }

}


@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.001ms!important;

    animation-iteration-count:1!important;

    transition-duration:.001ms!important;

  }

}

</style>

</head>


<body>

<div class="wrap">

  <div id="app"></div>

  <input
    id="importFile"
    class="fileinput"
    type="file"
    accept="application/json"
  >

  <input
    id="bgFile"
    class="fileinput"
    type="file"
    accept="image/*"
  >

</div>


<script>

(function(){

"use strict";


/* =========================================================
   CONSTANTS
========================================================= */

const SUBJECTS = [

  {
    key:"physics",
    name:"Physics",
    color:"var(--physics)"
  },

  {

/* =========================================================
   DATABASE
========================================================= */

function openDB(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(){

          const db =
            request.result;

          if(
            !db.objectStoreNames
              .contains(STORE_NAME)
          ){

            db.createObjectStore(
              STORE_NAME
            );

          }

        };


      request.onsuccess =
        function(){

          resolve(
            request.result
          );

        };


      request.onerror =
        function(){

          reject(
            request.error
          );

        };

    }
  );

}


async function dbGet(key){

  const db =
    await openDB();

  return new Promise(
    (resolve,reject)=>{

      const tx =
        db.transaction(
          STORE_NAME,
          "readonly"
        );


      const request =
        tx
          .objectStore(
            STORE_NAME
          )
          .get(key);


      request.onsuccess =
        ()=>{
          resolve(
            request.result
          );
        };


      request.onerror =
        ()=>{
          reject(
            request.error
          );
        };

    }
  );

}


async function dbSet(
  key,
  value
){

  const db =
    await openDB();

  return new Promise(
    (resolve,reject)=>{

      const tx =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      tx
        .objectStore(
          STORE_NAME
        )
        .put(
          value,
          key
        );


      tx.oncomplete =
        ()=>{
          resolve();
        };


      tx.onerror =
        ()=>{
          reject(
            tx.error
          );
        };

    }
  );

}


async function dbDelete(key){

  const db =
    await openDB();

  return new Promise(
    (resolve,reject)=>{

      const tx =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      tx
        .objectStore(
          STORE_NAME
        )
        .delete(key);


      tx.oncomplete =
        ()=>{
          resolve();
        };


      tx.onerror =
        ()=>{
          reject(
            tx.error
          );
        };

    }
  );

}

   DATA
========================================================= */

function uid(){

  return (
    "id_" +
    Math.random()
      .toString(36)
      .slice(2,10)
  );

}


function blankData(){

  const result = {};

  SUBJECTS.forEach(
    subject => {

      result[
        subject.key
      ] = {

        years:{}

      };


      YEARS.forEach(
        year => {

          result[
            subject.key
          ]
          .years[
            year
          ] = {

            chapters:[]

          };

        }
      );

    }
  );


  return result;

}


/* =========================================================
   CHAPTER NORMALIZATION
========================================================= */

function normalizeChapter(
  chapter
){

  const source =
    chapter &&
    typeof chapter === "object"
      ? chapter
      : {};


  const total =
    Math.max(
      1,
      Number(
        source.totalLectures
      ) || 1
    );


  return {

    id:
      source.id ||
      uid(),

    name:
      String(
        source.name ||
        "Chapter"
      ),

    totalLectures:
      total,

    completedLectures:
      Math.min(
        total,
        Math.max(
          0,
          Number(
            source.completedLectures
          ) || 0
        )
      ),

    confidence:
      Math.min(
        5,
        Math.max(
          0,
          Number(
            source.confidence
          ) || 0
        )
      )

  };

}


/* =========================================================
   MIGRATE OLD UNITS
========================================================= */

function normalizeData(
  source
){

  const fresh =
    blankData();


  if(
    !source ||
    typeof source !== "object"
  ){

    return fresh;

  }


  SUBJECTS.forEach(
    subject => {

      const incoming =
        source[
          subject.key
        ];


      if(!incoming){
        return;
      }


      YEARS.forEach(
        year => {

          const incomingYear =
            incoming
              .years
              ?.[
                year
              ];


          if(!incomingYear){
            return;
          }


          const chapters = [];


          /*
             New format.
          */

          if(
            Array.isArray(
              incomingYear.chapters
            )
          ){

            incomingYear
              .chapters
              .forEach(
                chapter => {

                  chapters.push(
                    normalizeChapter(
                      chapter
                    )
                  );

                }
              );

          }


          /*
             Old format.

             Every chapter from every
             old unit is moved directly
             into the year.
          */

          if(
            Array.isArray(
              incomingYear.units
            )
          ){

            incomingYear
              .units
              .forEach(
                unit => {

                  if(
                    !unit ||
                    !Array.isArray(
                      unit.chapters
                    )
                  ){

                    return;

                  }


                  unit
                    .chapters
                    .forEach(
                      chapter => {

                        chapters.push(
                          normalizeChapter(
                            chapter
                          )
                        );

                      }
                    );

                }
              );

          }


          fresh[
            subject.key
          ]
          .years[
            year
          ]
          .chapters =
            chapters;

        }
      );

    }
  );


  return fresh;

}


/* =========================================================
   CHAPTER ACCESS
========================================================= */

function getChapters(
  subjectKey,
  year
){

  const subject =
    state.data[
      subjectKey
    ];


  if(
    !subject ||
    !subject.years ||
    !subject.years[year]
  ){

    return [];

  }


  if(
    !Array.isArray(
      subject.years[year].chapters
    )
  ){

    subject.years[year].chapters =
      [];

  }


  return subject
    .years[year]
    .chapters;

}


function allChapters(
  subjectKey,
  year
){

  if(year){

    return [
      ...getChapters(
        subjectKey,
        year
      )
    ];

  }


  return YEARS.flatMap(
    currentYear =>
      getChapters(
        subjectKey,
        currentYear
      )
  );

}


/* =========================================================
   STATS
========================================================= */

function stats(
  chapters
){

  let total = 0;

  let done = 0;

  let finished = 0;

  let sum = 0;

  let count = 0;


  chapters.forEach(
    chapter => {

      const totalLectures =
        Math.max(
          0,
          Number(
            chapter.totalLectures
          ) || 0
        );


      const completed =
        Math.min(
          totalLectures,
          Math.max(
            0,
            Number(
              chapter.completedLectures
            ) || 0
          )
        );


      total +=
        totalLectures;


      done +=
        completed;


      if(
        totalLectures > 0 &&
        completed ===
          totalLectures
      ){

        finished++;

      }


      if(
        Number(
          chapter.confidence
        ) > 0
      ){

        sum +=
          Number(
            chapter.confidence
          );

        count++;

      }

    }
  );


  return {

    total,

    done,

    chapters:
      chapters.length,

    finished,

    pct:
      total
        ? Math.round(
            done /
            total *
            100
          )
        : 0,

    avgConf:
      count
        ? sum / count
        : 0

  };

}


function overall(){

  return stats(
    SUBJECTS.flatMap(
      subject =>
        allChapters(
          subject.key
        )
    )
  );

}


/* =========================================================
   ESCAPE
========================================================= */

function esc(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      character => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#039;"

      }[character])
    );

}


/* =========================================================
   LOAD
========================================================= */

async function load(){

  state.data =
    blankData();


  try{

    const stored =
      await dbGet(
        TRACKER_KEY
      );


    if(stored){

      if(stored.settings){

        settings = {
          ...settings,
          ...stored.settings
        };

      }


      if(stored.data){

        state.data =
          normalizeData(
            stored.data
          );

      }


      if(
        stored.lastStudied
      ){

        state.lastStudied =
          stored.lastStudied;

      }

    }

  }catch(error){

    console.error(
      "Could not load tracker data:",
      error
    );

  }


  /*
    Always write the normalized
    chapter-only structure back.

    This removes old Units from
    the stored application state.
  */

  try{

    await saveNow();

  }catch(error){

    console.error(
      "Could not migrate tracker data:",
      error
    );

  }


  try{

    const background =
      await dbGet(
        BACKGROUND_KEY
      );


    if(background){

      state.background =
        background;

    }

  }catch(error){

    console.error(
      "Could not load background:",
      error
    );

  }

}


/* =========================================================
   SAVE
========================================================= */

async function saveNow(){

  await dbSet(
    TRACKER_KEY,
    {

      version:2,

      settings,

      data:
        normalizeData(
          state.data
        ),

      lastStudied:
        state.lastStudied

    }
  );

}


function save(){

  clearTimeout(
    saveTimer
  );


  saveTimer =
    setTimeout(
      async()=>{

        try{

          await saveNow();

        }catch(error){

          console.error(
            "Could not save:",
            error
          );

        }

      },
      100
    );

}


/* =========================================================
   BACKGROUND
========================================================= */

function applyBackground(){

  document.documentElement
    .style
    .setProperty(
      "--user-bg",
      state.background
        ? `url("${state.background}")`
        : "none"
    );

}


/* =========================================================
   EXPORT
========================================================= */

function exportData(){

  const backup = {

    version:2,

    exportedAt:
      new Date()
        .toISOString(),

    settings,

    data:
      normalizeData(
        state.data
      ),

    background:
      state.background,

    lastStudied:
      state.lastStudied

  };


  const blob =
    new Blob(
      [
        JSON.stringify(
          backup,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const anchor =
    document.createElement(
      "a"
    );


  anchor.href =
    url;


  anchor.download =
    "study-tracker-backup.json";


  document.body.appendChild(
    anchor
  );


  anchor.click();


  anchor.remove();


  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );

}


/* =========================================================
   IMPORT
========================================================= */

function importData(file){

  const reader =
    new FileReader();


  reader.onload =
    async()=>{

      try{

        const backup =
          JSON.parse(
            reader.result
          );


        if(backup.settings){

          settings = {
            ...settings,
            ...backup.settings
          };

        }


        state.data =
          normalizeData(
            backup.data ||
            backup
          );


        state.lastStudied =
          backup.lastStudied ||
          null;


        if(
          typeof backup.background ===
            "string"
        ){

          state.background =
            backup.background;

          applyBackground();

          await dbSet(
            BACKGROUND_KEY,
            state.background
          );

        }


        await saveNow();


        render();


        alert(
          "Backup imported successfully."
        );


      }catch(error){

        console.error(error);

        alert(
          "Invalid backup file."
        );

      }

    };


  reader.readAsText(
    file
  );

}

        length:5
      },
      (_,i)=>`

        <button
          class="
            star
            ${i < chapter.confidence
              ? "on"
              : ""}
          "
          data-action="confidence"
          data-id="${esc(chapter.id)}"
          data-value="${i + 1}"
          title="${i + 1}/5"
          type="button"
        >
          ★
        </button>

      `
    ).join("");


  return `

    <div
      class="chapter"
      style="
        --tint:${subject.color};
        animation-delay:${index * .04}s
      "
      data-chapter-card="${esc(chapter.id)}"
    >


      <div class="chapter-head">

        <div>

          <div class="chapter-title">
            ${esc(chapter.name)}
          </div>


          <div class="chapter-actions">

            <button
              class="linkbtn"
              data-action="rename"
              data-id="${esc(chapter.id)}"
              type="button"
            >
              rename
            </button>


            <button
              class="linkbtn"
              data-action="edit-total"
              data-id="${esc(chapter.id)}"
              type="button"
            >
              edit lectures
            </button>


            <button
              class="linkbtn"
              data-action="delete"
              data-id="${esc(chapter.id)}"
              type="button"
            >
              delete
            </button>

          </div>

        </div>


        <div class="chapter-progress">
          ${chapter.completedLectures}/${chapter.totalLectures}
        </div>

      </div>


      <div class="bar">

        <div
          style="
            width:${pct}%
          "
        ></div>

      </div>


      <div class="row-label">
        Lecture progress · ${pct}%
      </div>


      <div class="dots">
        ${dots}
      </div>


      <div class="row-label">

        Confidence ·

        ${
          chapter.confidence
            ? chapter.confidence + "/5"
            : "Not rated"
        }

      </div>


      <div class="stars">
        ${stars}
      </div>


    </div>

  `;

}


/* =========================================================
   UPDATE CHAPTER WITHOUT RE-RENDERING
========================================================= */

function updateChapterCard(
  card,
  chapter
){

  if(
    !card ||
    !chapter
  ){

    return;

  }


  const pct =
    chapter.totalLectures

      ? Math.round(
          chapter.completedLectures /
          chapter.totalLectures *
          100
        )

      : 0;


  const progress =
    card.querySelector(
      ".chapter-progress"
    );


  if(progress){

    progress.textContent =
      `${chapter.completedLectures}/${chapter.totalLectures}`;

  }


  const fill =
    card.querySelector(
      ".bar>div"
    );


  if(fill){

    fill.style.width =
      pct + "%";

  }


  const labels =
    card.querySelectorAll(
      ".row-label"
    );


  if(labels[0]){

    labels[0].textContent =
      `Lecture progress · ${pct}%`;

  }


  if(labels[1]){

    labels[1].textContent =
      `Confidence · ${
        chapter.confidence
          ? chapter.confidence + "/5"
          : "Not rated"
      }`;

  }


  card
    .querySelectorAll(
      '.dot[data-action="lecture"]'
    )
    .forEach(
      dot=>{

        const i =
          Number(
            dot.dataset.index
          );


        dot.classList.toggle(
          "done",
          i <
            chapter.completedLectures
        );

      }
    );


  card
    .querySelectorAll(
      '.star[data-action="confidence"]'
    )
    .forEach(
      star=>{

        star.classList.toggle(
          "on",
          Number(
            star.dataset.value
          ) <=
            chapter.confidence
        );

      }
    );

}


/* =========================================================
   CONTINUE STUDYING
========================================================= */

function getContinueData(){

  if(
    !state.lastStudied ||
    !state.lastStudied.chapterId
  ){

    return null;

  }


  const subject =
    SUBJECTS.find(
      item =>
        item.key ===
        state.lastStudied.subject
    );


  if(!subject){
    return null;
  }


  const chapters =
    getChapters(
      state.lastStudied.subject,
      state.lastStudied.year
    );


  const chapter =
    chapters.find(
      item =>
        item.id ===
        state.lastStudied.chapterId
    );


  if(!chapter){
    return null;
  }


  return {

    subject,

    year:
      state.lastStudied.year,

    chapter

  };

}


/* =========================================================
   CONFETTI
========================================================= */

function launchConfetti(){

  const layer =
    document.createElement(
      "div"
    );


  layer.className =
    "confetti-layer";


  const colors = [

    "#3d5a80",
    "#d4a900",
    "#b94a48",
    "#4f8a5b",
    "#7c5cff",
    "#e67e22",
    "#d85c8a"

  ];


  for(
    let i = 0;
    i < 55;
    i++
  ){

    const piece =
      document.createElement(
        "span"
      );


    piece.className =
      "confetti-piece";


    piece.style.left =
      `${15 + Math.random() * 70}%`;


    piece.style.background =
      colors[
        Math.floor(
          Math.random() *
          colors.length
        )
      ];


    piece.style.setProperty(
      "--x",
      `${(Math.random() - .5) * 260}px`
    );


    piece.style.setProperty(
      "--r",
      `${(Math.random() - .5) * 1000}deg`
    );


    piece.style.animationDelay =
      `${Math.random() * .16}s`;


    layer.appendChild(
      piece
    );

  }


  document.body.appendChild(
    layer
  );


  setTimeout(
    ()=>{
      layer.remove();
    },
    1800
  );

}


/* =========================================================
   RIPPLE
========================================================= */

function createRipple(
  element,
  event
){

  if(!element){
    return;
  }


  const rect =
    element.getBoundingClientRect();


  let x =
    rect.width / 2;


  let y =
    rect.height / 2;


  if(
    event &&
    Number.isFinite(
      event.clientX
    )
  ){

    x =
      event.clientX -
      rect.left;


    y =
      event.clientY -
      rect.top;

  }


  const ripple =
    document.createElement(
      "span"
    );


  ripple.className =
    "ripple";


  ripple.style.left =
    x + "px";


  ripple.style.top =
    y + "px";


  element.appendChild(
    ripple
  );


  ripple.addEventListener(
    "animationend",
    ()=>{
      ripple.remove();
    },
    {
      once:true
    }
  );

}


/* =========================================================
   BIND COMMON
========================================================= */

function bindCommon(){

  const exportButton =
    document.getElementById(
      "export"
    );


  if(exportButton){

    exportButton.onclick =
      exportData;

  }


  const importButton =
    document.getElementById(
      "import"
    );


  if(importButton){

    importButton.onclick =
      ()=>{
        document
          .getElementById(
            "importFile"
          )
          .click();
      };

  }


  const resetButton =
    document.getElementById(
      "reset"
    );


  if(resetButton){

    resetButton.onclick =
      resetAll;

  }


  const bgButton =
    document.getElementById(
      "bgBtn"
    );


  if(bgButton){

    bgButton.onclick =
      ()=>{
        document
          .getElementById(
            "bgFile"
          )
          .click();
      };

  }


  const clearBg =
    document.getElementById(
      "clearBg"
    );


  if(clearBg){

    clearBg.onclick =
      async()=>{

        state.background =
          null;

        applyBackground();


        try{

          await dbDelete(
            BACKGROUND_KEY
          );

        }catch(error){

          console.error(
            "Could not clear background:",
            error
          );

        }

      };

  }


  const continueButton =
    document.getElementById(
      "continueButton"
    );


  if(continueButton){

    continueButton.onclick =
      ()=>{

        const info =
          getContinueData();


        if(!info){
          return;
        }


        state.view =
          "year";


        state.subject =
          info.subject.key;


        state.year =
          info.year;


        render();


        setTimeout(
          ()=>{

            const card =
              document.querySelector(
                `[data-chapter-card="${CSS.escape(info.chapter.id)}"]`
              );


            if(card){

              card.scrollIntoView({
                behavior:"smooth",
                block:"center"
              });

            }

          },
          100
        );

      };

  }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const app =
    document.getElementById(
      "app"
    );


  if(
    state.view ===
    "home"
  ){

    app.innerHTML =
      home();

  }

  else if(
    state.view ===
    "subject"
  ){

    app.innerHTML =
      subjectPage(
        state.subject
      );

  }

  else if(
    state.view ===
    "year"
  ){

    app.innerHTML =
      yearPage(
        state.subject,
        state.year
      );

  }

  else{

    state.view =
      "home";

    state.subject =
      null;

    state.year =
      null;

    app.innerHTML =
      home();

  }


  bindCommon();


  const page =
    app.firstElementChild;


  if(page){

    page.classList.remove(
      "page-enter"
    );


    void page.offsetWidth;


    page.classList.add(
      "page-enter"
    );

  }


  /* =======================================================
     HOME
  ======================================================= */

  if(
    state.view ===
    "home"
  ){

    document
      .querySelectorAll(
        "[data-subject]"
      )
      .forEach(
        button=>{

          button.onclick =
            event=>{

              createRipple(
                button,
                event
              );


              setTimeout(
                ()=>{

                  state.view =
                    "subject";

                  state.subject =
                    button.dataset.subject;

                  render();

                },
                180
              );

            };

        }
      );

  }


  /* =======================================================
     SUBJECT
  ======================================================= */

  if(
    state.view ===
    "subject"
  ){

    const back =
      document.getElementById(
        "back"
      );


    if(back){

      back.onclick =
        event=>{

          createRipple(
            back,
            event
          );


          setTimeout(
            ()=>{

              state.view =
                "home";

              state.subject =
                null;

              render();

            },
            120
          );

        };

    }


    document
      .querySelectorAll(
        "[data-year]"
      )
      .forEach(
        button=>{

          button.onclick =
            event=>{

              createRipple(
                button,
                event
              );


              setTimeout(
                ()=>{

                  state.view =
                    "year";

                  state.year =
                    button.dataset.year;

                  render();

                },
                180
              );

            };

        }
      );

  }


  /* =======================================================
     YEAR
  ======================================================= */

  if(
    state.view ===
    "year"
  ){

    const back =
      document.getElementById(
        "back"
      );


    if(back){

      back.onclick =
        event=>{

          createRipple(
            back,
            event
          );


          setTimeout(
            ()=>{

              state.view =
                "subject";

              render();

            },
            120
          );

        };

    }


    /* -----------------------------------------------------
       SMALL +
    ----------------------------------------------------- */

    const addButton =
      document.getElementById(
        "addChapterButton"
      );


    const addForm =
      document.getElementById(
        "addChapter"
      );


    if(
      addButton &&
      addForm
    ){

      addButton.onclick =
        ()=>{

          addForm.classList.toggle(
            "open"
          );


          if(
            addForm.classList.contains(
              "open"
            )
          ){

            document
              .getElementById(
                "chapterName"
              )
              .focus();

          }

        };

    }


    /* -----------------------------------------------------
       ADD CHAPTER
    ----------------------------------------------------- */

    if(addForm){

      addForm.onsubmit =
        async event=>{

          event.preventDefault();


          const nameInput =
            document.getElementById(
              "chapterName"
            );


          const totalInput =
            document.getElementById(
              "lectureTotal"
            );


          const name =
            nameInput.value.trim();


          let total =
            parseInt(
              totalInput.value,
              10
            );


          if(!name){

            nameInput.focus();

            return;

          }


          if(
            !total ||
            total < 1
          ){

            total = 1;

          }


          const chapter = {

            id:
              uid(),

            name,

            totalLectures:
              total,

            completedLectures:
              0,

            confidence:
              0

          };


          getChapters(
            state.subject,
            state.year
          )
          .push(
            chapter
          );


          state.lastStudied = {

            subject:
              state.subject,

            year:
              state.year,

            chapterId:
              chapter.id,

            timestamp:
              Date.now()

          };


          await saveNow();


          render();

        };

    }


    /* -----------------------------------------------------
       SEARCH
    ----------------------------------------------------- */

    const search =
      document.getElementById(
        "chapterSearch"
      );


    if(search){

      search.addEventListener(
        "input",
        ()=>{

          const query =
            search.value
              .trim()
              .toLowerCase();


          document
            .querySelectorAll(
              ".chapter"
            )
            .forEach(
              card=>{

                const title =
                  card
                    .querySelector(
                      ".chapter-title"
                    )
                    ?.textContent
                    .toLowerCase() ||
                  "";


                card.style.display =
                  !query ||
                  title.includes(
                    query
                  )
                    ? ""
                    : "none";

              }
            );

        }
      );

    }


    /* -----------------------------------------------------
       CHAPTER ACTIONS
    ----------------------------------------------------- */

    const chapters =
      document.querySelector(
        ".chapters"
      );


    if(chapters){

      chapters.onclick =
        async event=>{

          const button =
            event.target.closest(
              "[data-action]"
            );


          if(!button){
            return;
          }


          const chapterId =
            button.dataset.id;


          const list =
            getChapters(
              state.subject,
              state.year
            );


          const chapter =
            list.find(
              item =>
                item.id ===
                chapterId
            );


          if(!chapter){
            return;
          }


          const action =
            button.dataset.action;


          /* -----------------------------------------------
             LECTURE
          ----------------------------------------------- */

          if(
            action ===
            "lecture"
          ){

            const index =
              Number(
                button.dataset.index
              );


            const wasComplete =
              chapter.completedLectures >=
              chapter.totalLectures;


            /*
              Original click behavior:
              clicking lecture N advances
              progress to N.

              Clicking the current final
              lecture again steps back one.
            */

            chapter.completedLectures =
              (
                index + 1 ===
                chapter.completedLectures
              )
                ? index
                : index + 1;


            state.lastStudied = {

              subject:
                state.subject,

              year:
                state.year,

              chapterId:
                chapter.id,

              timestamp:
                Date.now()

            };


            await saveNow();


            updateChapterCard(
              button.closest(
                ".chapter"
              ),
              chapter
            );


            /*
              Confetti only when crossing
              from incomplete → complete.
            */

            if(
              !wasComplete &&
              chapter.totalLectures > 0 &&
              chapter.completedLectures ===
                chapter.totalLectures
            ){

              launchConfetti();

            }


            return;

          }


          /* -----------------------------------------------
             CONFIDENCE
          ----------------------------------------------- */

          if(
            action ===
            "confidence"
          ){

            const value =
              Number(
                button.dataset.value
              );


            chapter.confidence =
              chapter.confidence ===
              value

                ? 0

                : value;


            await saveNow();


            updateChapterCard(
              button.closest(
                ".chapter"
              ),
              chapter
            );


            return;

          }


          /* -----------------------------------------------
             RENAME
          ----------------------------------------------- */

          if(
            action ===
            "rename"
          ){

            const name =
              prompt(
                "Rename chapter:",
                chapter.name
              );


            if(
              name &&
              name.trim()
            ){

              chapter.name =
                name.trim();


              await saveNow();


              render();

            }


            return;

          }


          /* -----------------------------------------------
             EDIT TOTAL
          ----------------------------------------------- */

          if(
            action ===
            "edit-total"
          ){

            const value =
              parseInt(
                prompt(
                  "Total lectures:",
                  chapter.totalLectures
                ),
                10
              );


            if(
              !value ||
              value < 1
            ){

              return;

            }


            const wasComplete =
              chapter.completedLectures >=
              chapter.totalLectures;


            chapter.totalLectures =
              value;


            chapter.completedLectures =
              Math.min(
                chapter.completedLectures,
                value
              );


            await saveNow();


            render();


            if(
              !wasComplete &&
              chapter.completedLectures ===
                chapter.totalLectures
            ){

              launchConfetti();

            }


            return;

          }


          /* -----------------------------------------------
             DELETE
          ----------------------------------------------- */

          if(
            action ===
            "delete"
          ){

            if(
              !confirm(
                "Delete this chapter?"
              )
            ){

              return;

            }


            const yearData =
              state.data[
                state.subject
              ]
              .years[
                state.year
              ];


            yearData.chapters =
              yearData.chapters.filter(
                item =>
                  item.id !==
                  chapter.id
              );


            if(
              state.lastStudied &&
              state.lastStudied.chapterId ===
                chapter.id
            ){

              state.lastStudied =
                null;

            }


            await saveNow();


            render();


            return;

          }

        };

    }

  }

}


/* =========================================================
   FILE INPUTS
========================================================= */

document
  .getElementById(
    "importFile"
  )
  .addEventListener(
    "change",
    event=>{

      const file =
        event.target.files?.[0];


      if(file){

        importData(
          file
        );

      }


      event.target.value =
        "";

    }
  );


document
  .getElementById(
    "bgFile"
  )
  .addEventListener(
    "change",
    event=>{

      const file =
        event.target.files?.[0];


      if(!file){
        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        event=>{

          const image =
            new Image();


          image.onload =
            async()=>{

              const max =
                1800;


              const scale =
                Math.min(
                  1,
                  max /
                  image.width
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.round(
                  image.width *
                  scale
                );


              canvas.height =
                Math.round(
                  image.height *
                  scale
                );


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
              );


              state.background =
                canvas.toDataURL(
                  "image/jpeg",
                  .8
                );


              applyBackground();


              try{

                await dbSet(
                  BACKGROUND_KEY,
                  state.background
                );

              }catch(error){

                alert(
                  "That image could not be saved. Try a smaller photo."
                );

              }

            };


          image.src =
            event.target.result;

        };


      reader.readAsDataURL(
        file
      );


      event.target.value =
        "";

    }
  );


/* =========================================================
   SERVICE WORKER
========================================================= */

if(
  "serviceWorker" in
  navigator
){

  window.addEventListener(
    "load",
    ()=>{

      navigator
        .serviceWorker
        .register(
          "./service-worker.js"
        )
        .catch(
          error =>
            console.warn(
              "Service worker registration failed:",
              error
            )
        );

    }
  );

}


/* =========================================================
   START
========================================================= */

(async function(){

  await load();

  applyBackground();

  render();

})();


})();

</script>
