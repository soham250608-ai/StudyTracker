<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#f4f2ea"
>

<title>Study Tracker</title>

<link
  rel="manifest"
  href="./manifest.json"
>

<style>

:root{
  --bg:#f4f2ea;
  --paper:rgba(255,253,247,.92);
  --ink:#232520;
  --muted:#6b6d63;
  --border:rgba(35,37,32,.14);
  --border2:rgba(35,37,32,.28);

  --physics:#3d5a80;
  --maths:#d4a900;
  --chemistry:#b94a48;
  --biology:#4f8a5b;

  --user-bg:none;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  min-height:100%;
  margin:0;
}

html{
  background:var(--bg);
}

body{
  color:var(--ink);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;

  background-color:var(--bg);

  background-image:var(--user-bg);

  background-size:cover;

  background-position:center top;

  background-repeat:no-repeat;

  background-attachment:scroll;

  overscroll-behavior-x:none;
}

button,
input{
  font:inherit;
}

button{
  -webkit-appearance:none;
  appearance:none;
}

input{
  -webkit-appearance:none;
  appearance:none;
}


/* =========================================================
   FULL SCREEN BACKGROUND FIX
========================================================= */

#backgroundLayer{
  position:fixed;

  inset:0;

  width:100vw;

  height:100vh;
  height:100dvh;

  min-height:100%;

  z-index:0;

  background-color:var(--bg);

  background-position:center center;

  background-size:cover;

  background-repeat:no-repeat;

  pointer-events:none;
}


/* =========================================================
   APP
========================================================= */

.app{
  position:relative;

  z-index:1;

  min-height:100vh;

  min-height:100dvh;
}


/* =========================================================
   WRAP
========================================================= */

.wrap{
  width:min(1000px,100%);

  margin:auto;

  padding:
    max(28px,env(safe-area-inset-top))
    20px
    max(70px,calc(40px + env(safe-area-inset-bottom)));
}

.display{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;
}

.mono{
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;
}


/* =========================================================
   TOP
========================================================= */

.topbar{
  margin-bottom:25px;
}

.brand{
  font:
    600 34px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;

  margin:0;

  outline:0;

  border-radius:8px;

  padding:2px 6px;

  margin-left:-6px;

  cursor:default;

  user-select:none;
}

.brand:hover,
.brand:focus{
  background:transparent;

  box-shadow:none;
}


/* =========================================================
   STATS
========================================================= */

.stats{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  background:var(--paper);

  backdrop-filter:blur(12px);

  -webkit-backdrop-filter:blur(12px);

  border:
    1px solid
    var(--border2);

  border-radius:16px;

  overflow:hidden;

  margin:
    20px
    0
    27px;

  box-shadow:
    0 9px 25px
    rgba(35,37,32,.07);
}

.stat{
  padding:16px;

  border-right:
    1px solid
    var(--border);
}

.stat:last-child{
  border-right:0;
}

.stat-num{
  font:
    600 28px
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  line-height:1.15;
}

.stat-label{
  font-size:12px;

  color:var(--muted);

  margin-top:3px;
}


/* =========================================================
   PAGE ANIMATION
========================================================= */

.page-enter{
  animation:
    pageEnter
    .42s
    cubic-bezier(.2,.8,.2,1)
    both;
}

@keyframes pageEnter{

  0%{
    opacity:0;

    transform:
      translateY(18px)
      scale(.975);
  }

  65%{
    opacity:1;

    transform:
      translateY(-2px)
      scale(1.006);
  }

  100%{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }

}


/* =========================================================
   RIPPLE
========================================================= */

.ripple{
  position:absolute;

  border-radius:50%;

  pointer-events:none;

  width:20px;

  height:20px;

  transform:
    translate(-50%,-50%)
    scale(0);

  background:var(--tint);

  opacity:.22;

  animation:
    rippleExpand
    .65s
    cubic-bezier(.2,.7,.2,1)
    forwards;

  z-index:0;
}

@keyframes rippleExpand{

  0%{
    transform:
      translate(-50%,-50%)
      scale(0);

    opacity:.30;
  }

  45%{
    opacity:.20;
  }

  100%{
    transform:
      translate(-50%,-50%)
      scale(30);

    opacity:0;
  }

}


/* =========================================================
   SUBJECT TILES
========================================================= */

.tiles{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:16px;
}

.tile{
  --tint:var(--physics);

  position:relative;

  overflow:hidden;

  background:var(--paper);

  backdrop-filter:blur(12px);

  -webkit-backdrop-filter:blur(12px);

  border:
    1px solid
    var(--border2);

  border-left:
    5px solid
    var(--tint);

  border-radius:16px;

  padding:22px;

  text-align:left;

  cursor:pointer;

  color:var(--ink);

  box-shadow:
    0 9px 24px
    rgba(35,37,32,.07);

  transition:
    transform .23s,
    box-shadow .23s;

  animation:
    rise
    .5s
    both;

  touch-action:manipulation;

  isolation:isolate;
}

.tile>*{
  position:relative;

  z-index:2;
}

.tile::after{
  content:"";

  position:absolute;

  width:155px;

  height:155px;

  border-radius:50%;

  right:-78px;

  top:-78px;

  background:var(--tint);

  opacity:.12;

  transition:
    transform .35s,
    opacity .25s;

  z-index:1;
}

.tile:hover{
  transform:
    translateY(-5px)
    scale(1.008);

  box-shadow:
    0 18px 35px
    rgba(35,37,32,.13);
}

.tile:hover::after{
  transform:scale(1.55);

  opacity:.17;
}

.tile:active{
  transform:scale(.985);
}

.tile-head{
  display:flex;

  justify-content:space-between;

  align-items:baseline;
}

.tile-name{
  font:
    600 23px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;

  color:var(--tint);
}

.tile-pct{
  font:
    600 26px
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;
}

.bar{
  height:8px;

  background:
    rgba(35,37,32,.08);

  border-radius:99px;

  overflow:hidden;

  margin-top:14px;
}

.bar>div{
  height:100%;

  width:0;

  background:var(--tint);

  border-radius:inherit;

  transition:
    width .35s
    cubic-bezier(.2,.8,.2,1);
}

.tile-meta{
  display:flex;

  justify-content:space-between;

  gap:10px;

  margin-top:12px;

  font-size:12px;

  color:var(--muted);
}


/* =========================================================
   HEADER TABS
   ONLY NEW UI WRAPPER
========================================================= */

.header-tab{
  display:inline-block;

  width:max-content;

  max-width:100%;

  background:
    rgba(255,253,247,.94);

  backdrop-filter:blur(12px);

  -webkit-backdrop-filter:blur(12px);

  border:
    1px solid
    rgba(35,37,32,.20);

  border-radius:13px;

  box-shadow:
    0 7px 20px
    rgba(35,37,32,.07);

  padding:
    8px
    13px;
}

.back-tab{
  margin-bottom:10px;
}

.title-tab{
  margin-bottom:0;
}


/* =========================================================
   SUBJECT HEADER
========================================================= */

.subject-head{
  margin:
    0;
}

.subject-title{
  font:
    600 32px
    "Space Grotesk",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;

  margin:0;

  color:var(--tint);
}


/* =========================================================
   BACK
========================================================= */

.back{
  background:none;

  border:0;

  padding:0;

  color:var(--muted);

  cursor:pointer;

  font-size:22px;

  font-weight:600;

  line-height:1.2;

  margin:0;
}

.back:hover{
  color:var(--ink);
}


/* =========================================================
   YEAR TABS
========================================================= */

.year-tabs{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:16px;
}

.year-tab{
  --tint:var(--physics);

  position:relative;

  overflow:hidden;

  background:var(--paper);

  border:
    1px solid
    var(--border2);

  border-left:
    5px solid
    var(--tint);

  border-radius:16px;

  padding:20px;

  text-align:left;

  color:var(--ink);

  cursor:pointer;

  box-shadow:
    0 9px 24px
    rgba(35,37,32,.07);

  transition:
    transform .22s,
    box-shadow .22s;

  animation:
    rise .45s
    both;

  touch-action:manipulation;
}

.year-tab:hover{
  transform:translateY(-4px);

  box-shadow:
    0 16px 32px
    rgba(35,37,32,.12);
}

.year-tab:active{
  transform:scale(.985);
}

.year-name{
  display:block;

  color:var(--tint);

  font:
    600 27px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;
}

.year-pct{
  display:block;

  margin-top:6px;

  font:
    600 28px
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;
}

.year-meta{
  display:block;

  margin-top:8px;

  color:var(--muted);

  font-size:12px;
}


/* =========================================================
   CHAPTER TOOLBAR
========================================================= */

.chapter-toolbar{
  display:flex;

  gap:9px;

  margin:
    18px
    0
    16px;
}

.chapter-search{
  width:100%;

  min-width:0;

  height:44px;

  padding:
    0
    13px;

  background:
    rgba(255,253,247,.94);

  color:var(--ink);

  border:
    1px
    solid
    var(--border2);

  border-radius:10px;

  outline:none;

  box-shadow:
    0 5px 15px
    rgba(35,37,32,.04);
}

.chapter-search::placeholder{
  color:var(--muted);
}

.chapter-search:focus{
  border-color:var(--tint);
}


/* =========================================================
   ADD CHAPTER
========================================================= */

.add-row{
  display:flex;

  justify-content:flex-end;

  margin:
    18px
    0
    14px;
}

.add-chapter-button{
  --tint:var(--physics);

  position:relative;

  overflow:hidden;

  width:38px;

  height:38px;

  border:
    1px solid
    var(--border2);

  border-radius:10px;

  background:var(--paper);

  color:var(--tint);

  font-size:23px;

  line-height:1;

  cursor:pointer;

  box-shadow:
    0 6px 17px
    rgba(35,37,32,.06);

  display:grid;

  place-items:center;

  padding:0;
}

.add-chapter-button:active{
  transform:scale(.94);
}


/* =========================================================
   ADD CHAPTER MODAL
========================================================= */

.modal-backdrop{
  position:fixed;

  inset:0;

  z-index:100;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:18px;

  background:
    rgba(0,0,0,.24);
}

.chapter-modal{
  width:min(420px,100%);

  background:
    rgba(255,253,247,.98);

  border:
    1px
    solid
    var(--border2);

  border-radius:16px;

  padding:18px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.20);
}

.chapter-modal-title{
  font-size:18px;

  font-weight:600;

  margin-bottom:13px;
}

.chapter-modal input{
  width:100%;

  height:42px;

  border:
    1px
    solid
    var(--border);

  border-radius:9px;

  background:#fff;

  padding:
    0
    11px;

  outline:none;

  margin-bottom:9px;
}

.chapter-modal input:focus{
  border-color:var(--tint);
}

.modal-actions{
  display:flex;

  gap:8px;

  margin-top:4px;
}

.modal-actions button{
  flex:1;

  min-height:40px;

  border-radius:9px;

  cursor:pointer;
}

.modal-cancel{
  border:
    1px
    solid
    var(--border2);

  background:#fff;

  color:var(--ink);
}

.modal-submit{
  border:
    1px
    solid
    var(--tint);

  background:var(--tint);

  color:#fff;
}


/* =========================================================
   CHAPTERS
========================================================= */

.chapters{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:16px;
}

.chapter{
  --tint:var(--physics);

  border:
    1px
    solid
    var(--border);

  border-left:
    4px
    solid
    var(--tint);

  border-radius:14px;

  padding:18px;

  box-shadow:
    0 7px 20px
    rgba(35,37,32,.055);

  animation:
    rise .38s
    both;

  transition:.18s;

  min-width:0;

  background:
    rgba(255,253,247,.92);

  backdrop-filter:blur(12px);

  -webkit-backdrop-filter:blur(12px);
}

.chapter:hover{
  transform:translateY(-2px);

  box-shadow:
    0 12px 27px
    rgba(35,37,32,.09);
}

.chapter-head{
  display:flex;

  justify-content:space-between;

  gap:14px;
}

.chapter-title{
  font:
    600 17px
    "Space Grotesk",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;

  overflow-wrap:anywhere;
}

.chapter-progress{
  font:
    600 16px
    "JetBrains Mono",
    ui-monospace,
    monospace;

  white-space:nowrap;
}

.chapter-actions{
  display:flex;

  gap:10px;

  margin-top:5px;

  flex-wrap:wrap;
}

.linkbtn{
  border:0;

  background:none;

  padding:0;

  color:var(--muted);

  text-decoration:underline;

  cursor:pointer;

  font-size:11px;
}

.linkbtn:hover{
  color:var(--ink);
}

.row-label{
  font-size:11px;

  color:var(--muted);

  margin:
    14px
    0
    7px;
}

.dots{
  display:flex;

  flex-wrap:wrap;

  gap:7px;
}

.dot{
  width:30px;

  height:30px;

  border-radius:50%;

  border:
    1.5px
    solid
    var(--tint);

  background:transparent;

  color:var(--ink);

  cursor:pointer;

  padding:0;

  display:grid;

  place-items:center;

  font:
    600 10px
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  transition:
    transform .14s ease,
    background .14s ease,
    color .14s ease,
    box-shadow .14s ease;

  touch-action:manipulation;
}

.dot:hover{
  transform:scale(1.18);
}

.dot:active{
  transform:scale(.90);
}

.dot.done{
  background:var(--tint);

  color:#fff;

  box-shadow:
    0 0 0 3px
    rgba(35,37,32,.08);
}

.stars{
  display:flex;

  gap:3px;
}

.star{
  background:none;

  border:0;

  padding:0;

  cursor:pointer;

  font-size:21px;

  line-height:1;

  color:
    rgba(35,37,32,.2);

  transition:.15s;

  touch-action:manipulation;
}

.star:hover{
  transform:scale(1.15);
}

.star:active{
  transform:scale(.92);
}

.star.on{
  color:var(--tint);
}


/* =========================================================
   SETTINGS
========================================================= */

.settings-panel{
  margin:
    55px
    0
    0;

  padding:
    20px
    0
    0;

  border-top:
    1px
    solid
    var(--border2);

  animation:
    rise
    .5s
    .1s
    both;
}

.settings-head{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:11px;
}

.settings-title{
  font:
    600 19px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;
}

.settings-sub{
  font-size:12px;

  color:var(--muted);
}

.settings-icon{
  font-size:20px;

  opacity:.55;
}

.settings-actions{
  display:flex;

  gap:8px;

  flex-wrap:wrap;
}

.ghost{
  background:var(--paper);

  border:
    1px
    solid
    var(--border2);

  border-radius:8px;

  padding:
    8px
    11px;

  cursor:pointer;

  color:var(--ink);
}

.ghost:hover{
  border-color:var(--ink);
}

.danger{
  opacity:.75;
}

.fileinput{
  display:none;
}

.empty{
  padding:
    34px
    4px;

  color:var(--muted);

  font:
    italic 16px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    system-ui,
    sans-serif;
}


/* =========================================================
   CONFETTI
========================================================= */

.confetti-layer{
  position:fixed;

  inset:0;

  pointer-events:none;

  overflow:hidden;

  z-index:9999;
}

.confetti-piece{
  position:absolute;

  width:8px;

  height:13px;

  top:-20px;

  opacity:0;

  animation:
    confettiFall
    1.45s
    cubic-bezier(.15,.65,.3,1)
    forwards;
}

@keyframes confettiFall{

  0%{
    opacity:1;

    transform:
      translate3d(0,0,0)
      rotate(0deg);
  }

  100%{
    opacity:0;

    transform:
      translate3d(
        var(--x),
        110vh,
        0
      )
      rotate(
        var(--r)
      );
  }

}


/* =========================================================
   CARD ENTRY
========================================================= */

@keyframes rise{

  0%{
    opacity:0;

    transform:
      translateY(12px)
      scale(.96);
  }

  100%{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:720px){

  .wrap{
    padding-left:15px;

    padding-right:15px;
  }

  .brand{
    font-size:30px;
  }

  .stats{
    grid-template-columns:
      1fr 1fr;
  }

  .stat:nth-child(2){
    border-right:0;
  }

  .stat:nth-child(-n+2){
    border-bottom:
      1px
      solid
      var(--border);
  }

  .tiles,
  .year-tabs{
    grid-template-columns:
      1fr;
  }

  /*
    Chapters deliberately remain TWO columns.
  */

  .chapters{
    grid-template-columns:
      1fr 1fr;

    gap:10px;
  }

  .chapter{
    padding:13px;

    border-left-width:3px;
  }

  .chapter-head{
    align-items:flex-start;

    gap:7px;
  }

  .chapter-title{
    font-size:15px;
  }

  .chapter-progress{
    font-size:13px;

    white-space:nowrap;
  }

  .chapter-actions{
    gap:7px;
  }

  .linkbtn{
    font-size:9px;
  }

  .row-label{
    font-size:9px;

    margin-top:11px;
  }

  .dots{
    gap:5px;
  }

  .dot{
    width:28px;

    height:28px;

    font-size:9px;
  }

  .star{
    font-size:19px;
  }

  .subject-title{
    font-size:28px;
  }

  .back{
    font-size:21px;
  }

  .header-tab{
    padding:
      8px
      12px;
  }

  .settings-actions{
    gap:7px;
  }

}

@media(max-width:350px){

  .chapters{
    gap:8px;
  }

  .chapter{
    padding:10px;
  }

  .chapter-actions{
    display:none;
  }

  .chapter-title{
    font-size:14px;
  }

  .chapter-progress{
    font-size:12px;
  }

  .dot{
    width:27px;

    height:27px;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:
      .001ms!important;

    animation-iteration-count:
      1!important;

    transition-duration:
      .001ms!important;

  }

}

</style>

</head>

<body>

<!--
  Fixed background layer.
  This fixes the iPhone issue where the background
  stopped before the bottom of the page.
-->
<div
  id="backgroundLayer"
  aria-hidden="true"
></div>


<div class="app">

  <div class="wrap">

    <div id="app"></div>


    <input
      id="importFile"
      class="fileinput"
      type="file"
      accept="application/json"
    >


    <input
      id="bgFile"
      class="fileinput"
      type="file"
      accept="image/*"
    >

  </div>

</div>


<script>

(function(){

"use strict";


/* =========================================================
   CONSTANTS

/* =========================================================
   DATABASE
========================================================= */

let databasePromise =
  null;


function openDB(){

  if(databasePromise){

    return databasePromise;

  }


  databasePromise =
    new Promise(
      (resolve,reject)=>{

        const request =
          indexedDB.open(
            DB_NAME,
            DB_VERSION
          );


        request.onupgradeneeded =
          function(){

            const db =
              request.result;


            if(
              !db.objectStoreNames
                .contains(
                  STORE_NAME
                )
            ){

              db.createObjectStore(
                STORE_NAME
              );

            }

          };


        request.onsuccess =
          function(){

            resolve(
              request.result
            );

          };


        request.onerror =
          function(){

            databasePromise =
              null;

            reject(
              request.error
            );

          };

      }
    );


  return databasePromise;

}


async function dbGet(key){

  const db =
    await openDB();


  return new Promise(
    (resolve,reject)=>{

      const tx =
        db.transaction(
          STORE_NAME,
          "readonly"
        );


      const request =
        tx
          .objectStore(
            STORE_NAME
          )
          .get(key);


      request.onsuccess =
        function(){

          resolve(
            request.result
          );

        };


      request.onerror =
        function(){

          reject(
            request.error
          );

        };

    }
  );

}


async function dbSet(
  key,
  value
){

  const db =
    await openDB();


  return new Promise(
    (resolve,reject)=>{

      const tx =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      tx
        .objectStore(
          STORE_NAME
        )
        .put(
          value,
          key
        );


      tx.oncomplete =
        function(){

          resolve();

        };


      tx.onerror =
        function(){

          reject(
            tx.error
          );

        };

    }
  );

}


async function dbDelete(
  key
){

  const db =
    await openDB();


  return new Promise(
    (resolve,reject)=>{

      const tx =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      tx
        .objectStore(
          STORE_NAME
        )
        .delete(
          key
        );


      tx.oncomplete =
        function(){

          resolve();

        };


      tx.onerror =
        function(){

          reject(
            tx.error
          );

        };

    }
  );

}

function uid(){

  return (
    "id_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,9)
  );

}


function blankData(){

  const result =
    {};

  SUBJECTS.forEach(
    subject=>{

      result[
        subject.key
      ] = {

        years:{

          "11th":{
            chapters:[]
          },

          "12th":{
            chapters:[]
          }

        }

      };

    }
  );


  return result;

}


/* =========================================================
   NORMALIZE CHAPTER
========================================================= */

function normalizeChapter(
  chapter
){

  const source =
    chapter &&
    typeof chapter ===
      "object"

      ? chapter

      : {};


  let total =
    Number(
      source.totalLectures
    );


  if(
    !Number.isFinite(total)
  ){

    total =
      Number(
        source.lectures
      );

  }


  if(
    !Number.isFinite(total) ||
    total < 1
  ){

    total =
      1;

  }


  let completed =
    Number(
      source.completedLectures
    );


  /*
    Compatibility with an older
    version that stored completed
    lecture numbers.
  */

  if(
    Array.isArray(
      source.completed
    )
  ){

    completed =
      source.completed.length;

  }


  if(
    !Number.isFinite(completed)
  ){

    completed =
      0;

  }


  return {

    id:
      source.id ||
      uid(),

    name:
      String(
        source.name ||
        source.title ||
        "Chapter"
      ),

    totalLectures:
      Math.max(
        1,
        Math.floor(
          total
        )
      ),

    completedLectures:
      Math.max(
        0,
        Math.min(
          Math.floor(
            total
          ),
          Math.floor(
            completed
          )
        )
      ),

    confidence:
      Math.max(
        0,
        Math.min(
          5,
          Number(
            source.confidence
          ) || 0
        )
      )

  };

}


/* =========================================================
   NORMALIZE DATA
========================================================= */

function normalizeData(
  source
){

  const fresh =
    blankData();


  if(
    !source ||
    typeof source !==
      "object"
  ){

    return fresh;

  }


  SUBJECTS.forEach(
    subject=>{

      const incoming =
        source[
          subject.key
        ];


      if(!incoming){

        return;

      }


      YEARS.forEach(
        year=>{

          const incomingYear =
            incoming
              .years?.[
                year
              ];


          if(!incomingYear){

            return;

          }


          /*
            NEW DIRECT CHAPTER FORMAT
          */

          if(
            Array.isArray(
              incomingYear.chapters
            )
          ){

            fresh[
              subject.key
            ]
            .years[
              year
            ]
            .chapters =
              incomingYear
                .chapters
                .map(
                  normalizeChapter
                );

          }


          /*
            OLD UNIT FORMAT
            Automatically flatten it.
          */

          if(
            Array.isArray(
              incomingYear.units
            )
          ){

            const flattened =
              [];


            incomingYear.units.forEach(
              unit=>{

                if(
                  !unit ||
                  !Array.isArray(
                    unit.chapters
                  )
                ){

                  return;

                }


                unit.chapters.forEach(
                  chapter=>{

                    flattened.push(
                      normalizeChapter(
                        chapter
                      )
                    );

                  }
                );

              }
            );


            /*
              Only use flattened units
              when direct chapters weren't
              already available.
            */

            if(
              !Array.isArray(
                incomingYear.chapters
              ) ||
              incomingYear.chapters.length === 0
            ){

              fresh[
                subject.key
              ]
              .years[
                year
              ]
              .chapters =
                flattened;

            }

          }

        }
      );

    }
  );


  return fresh;

}


/* =========================================================
   CHAPTER ACCESS
========================================================= */

function allChapters(
  key,
  year
){

  const result =
    [];

  const years =
    year
      ? [year]
      : YEARS;


  const subject =
    state.data[
      key
    ];


  if(
    !subject ||
    !subject.years
  ){

    return result;

  }


  years.forEach(
    currentYear=>{

      const chapters =
        subject
          .years[
            currentYear
          ]
          ?.chapters ||
        [];


      result.push(
        ...chapters
      );

    }
  );


  return result;

}


/* =========================================================
   STATS
========================================================= */

function stats(
  chapters
){

  let total =
    0;

  let done =
    0;

  let finished =
    0;

  let confidenceSum =
    0;

  let confidenceCount =
    0;


  chapters.forEach(
    chapter=>{

      const totalLectures =
        Math.max(
          0,
          Number(
            chapter.totalLectures
          ) || 0
        );


      const completedLectures =
        Math.min(
          totalLectures,
          Math.max(
            0,
            Number(
              chapter.completedLectures
            ) || 0
          )
        );


      total +=
        totalLectures;


      done +=
        completedLectures;


      if(
        totalLectures > 0 &&
        completedLectures ===
          totalLectures
      ){

        finished++;

      }


      if(
        Number(
          chapter.confidence
        ) > 0
      ){

        confidenceSum +=
          Number(
            chapter.confidence
          );

        confidenceCount++;

      }

    }
  );


  return {

    total,

    done,

    chapters:
      chapters.length,

    finished,

    pct:
      total
        ? Math.round(
            done /
            total *
            100
          )
        : 0,

    avgConf:
      confidenceCount
        ? confidenceSum /
          confidenceCount
        : 0

  };

}


function overall(){

  return stats(

    SUBJECTS.flatMap(
      subject=>
        allChapters(
          subject.key
        )
    )

  );

}


/* =========================================================
   ESCAPE
========================================================= */

function esc(
  value
){

  return String(
    value
  ).replace(
    /[&<>"']/g,

    character=>
      ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#039;"
      })[
        character
      ]

  );

}


/* =========================================================
   LOAD
========================================================= */

async function load(){

  state.data =
    blankData();


  try{

    const stored =
      await dbGet(
        TRACKER_KEY
      );


    if(stored){

      if(
        stored.settings
      ){

        settings =
          {
            ...settings,
            ...stored.settings
          };

      }


      if(
        stored.data
      ){

        state.data =
          normalizeData(
            stored.data
          );

      }


      if(
        stored.lastStudied
      ){

        state.lastStudied =
          stored.lastStudied;

      }

    }

  }catch(error){

    console.warn(
      "Could not load tracker data.",
      error
    );

  }


  try{

    const background =
      await dbGet(
        BACKGROUND_KEY
      );


    if(background){

      state.background =
        background;

    }

  }catch(error){

    console.warn(
      "Could not load background.",
      error
    );

  }

}


/* =========================================================
   SAVE
========================================================= */

function save(){

  clearTimeout(
    saveTimer
  );


  saveTimer =
    setTimeout(
      async()=>{

        try{

          await dbSet(
            TRACKER_KEY,
            {

              version:2,

              settings,

              data:
                state.data,

              lastStudied:
                state.lastStudied

            }
          );

        }catch(error){

          console.error(
            "Could not save tracker data:",
            error
          );

        }

      },
      150
    );

}


async function saveNow(){

  clearTimeout(
    saveTimer
  );


  await dbSet(
    TRACKER_KEY,
    {

      version:2,

      settings,

      data:
        state.data,

      lastStudied:
        state.lastStudied

    }
  );

}


/* =========================================================
   BACKGROUND
========================================================= */

function applyBackground(){

  const layer =
    document.getElementById(
      "backgroundLayer"
    );


  if(layer){

    layer.style.backgroundImage =
      state.background
        ? `url("${state.background}")`
        : "none";

  }


  /*
    Keep the original CSS variable
    working too.
  */

  document.documentElement
    .style
    .setProperty(
      "--user-bg",
      state.background
        ? `url("${state.background}")`
        : "none"
    );

}


/* =========================================================
   EXPORT
========================================================= */

function exportData(){

  const backup = {

    version:2,

    exportedAt:
      new Date()
        .toISOString(),

    settings,

    data:
      state.data,

    background:
      state.background,

    lastStudied:
      state.lastStudied

  };


  const blob =
    new Blob(
      [
        JSON.stringify(
          backup,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const anchor =
    document.createElement(
      "a"
    );


  anchor.href =
    url;


  anchor.download =
    "study-tracker-backup.json";


  document.body.appendChild(
    anchor
  );


  anchor.click();


  anchor.remove();


  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    100
  );

}


/* =========================================================
   IMPORT
========================================================= */

function importData(
  file
){

  const reader =
    new FileReader();


  reader.onload =
    async function(){

      try{

        const backup =
          JSON.parse(
            reader.result
          );


        if(
          backup.settings
        ){

          settings =
            {
              ...settings,
              ...backup.settings
            };

        }


        state.data =
          normalizeData(
            backup.data ||
            backup
          );


        if(
          typeof backup.background ===
            "string"
        ){

          state.background =
            backup.background;

          applyBackground();


          await dbSet(
            BACKGROUND_KEY,
            state.background
          );

        }


        if(
          backup.lastStudied
        ){

          state.lastStudied =
            backup.lastStudied;

        }


        await saveNow();


        render();


        alert(
          "Backup imported successfully."
        );


      }catch(error){

        console.error(
          error
        );


        alert(
          "Invalid backup file."
        );

      }

    };


  reader.readAsText(
    file
  );

}

async function resetAll(){

  const confirmed =
    confirm(
      "Delete all study data?"
    );


  if(!confirmed){

    return;

  }


  state.data =
    blankData();


  state.lastStudied =
    null;


  state.view =
    "home";


  state.subject =
    null;


  state.year =
    null;


  await saveNow();


  render();

}

                  )
              )
              .join("")

          : `

            <div class="empty">
              Add your first chapter with + above.
            </div>

          `

      }

    </div>

  `);

}


/* =========================================================
   CHAPTER CARD
========================================================= */

function chapterCard(
  subject,
  chapter,
  index
){

  const total =
    Math.max(
      1,
      Number(
        chapter.totalLectures
      ) || 1
    );


  const completed =
    Math.min(
      total,
      Math.max(
        0,
        Number(
          chapter.completedLectures
        ) || 0
      )
    );


  const percentage =
    Math.round(
      completed /
      total *
      100
    );


  const dots =
    Array.from(
      {
        length:
          total
      },

      (_,dotIndex)=>`

        <button
          class="
            dot
            ${
              dotIndex <
              completed
                ? "done"
                : ""
            }
          "
          data-action="lecture"
          data-id="${esc(
            chapter.id
          )}"
          data-index="${dotIndex}"
          type="button"
          aria-label="
            Lecture ${dotIndex + 1}
          "
        >

          ${dotIndex + 1}

        </button>

      `
    ).join("");


  const stars =
    Array.from(
      {
        length:5
      },

      (_,starIndex)=>{

        const value =
          starIndex + 1;


        return `

          <button
            class="
              star
              ${
                value <=
                chapter.confidence
                  ? "on"
                  : ""
              }
            "
            data-action="confidence"
            data-id="${esc(
              chapter.id
            )}"
            data-value="${value}"
            type="button"
            aria-label="
              Confidence ${value} out of 5
            "
          >

            ★

          </button>

        `;

      }
    ).join("");


  return `

    <div
      class="chapter"
      data-chapter="${esc(
        chapter.id
      )}"
      style="
        --tint:${subject.color};
        animation-delay:${(index || 0) * .04}s
      "
    >

      <div class="chapter-head">

        <div>

          <div class="chapter-title">

            ${esc(
              chapter.name
            )}

          </div>


          <div class="chapter-actions">

            <button
              class="linkbtn"
              data-action="rename"
              data-id="${esc(
                chapter.id
              )}"
              type="button"
            >
              rename
            </button>


            <button
              class="linkbtn"
              data-action="edit-total"
              data-id="${esc(
                chapter.id
              )}"
              type="button"
            >
              edit lectures
            </button>


            <button
              class="linkbtn"
              data-action="delete"
              data-id="${esc(
                chapter.id
              )}"
              type="button"
            >
              delete
            </button>

          </div>

        </div>


        <div class="chapter-progress">

          ${completed}/${total}

        </div>

      </div>


      <div class="bar">

        <div
          style="
            width:${percentage}%;
            background:${subject.color}
          "
        ></div>

      </div>


      <div class="row-label">

        Lecture progress ·
        ${percentage}%

      </div>


      <div class="dots">

        ${dots}

      </div>


      <div class="row-label">

        Confidence ·

        ${
          chapter.confidence
            ? chapter.confidence + "/5"
            : "Not rated"
        }

      </div>


      <div class="stars">

        ${stars}

      </div>

    </div>

  `;

}


/* =========================================================
   LIVE CHAPTER UPDATE
========================================================= */

function updateChapterCard(
  card,
  chapter
){

  if(
    !card ||
    !chapter
  ){

    return;

  }


  const total =
    Math.max(
      1,
      Number(
        chapter.totalLectures
      ) || 1
    );


  const completed =
    Math.min(
      total,
      Math.max(
        0,
        Number(
          chapter.completedLectures
        ) || 0
      )
    );


  const percentage =
    Math.round(
      completed /
      total *
      100
    );


  const progress =
    card.querySelector(
      ".chapter-progress"
    );


  if(progress){

    progress.textContent =
      `${completed}/${total}`;

  }


  const bar =
    card.querySelector(
      ".bar>div"
    );


  if(bar){

    bar.style.width =
      percentage + "%";

  }


  const labels =
    card.querySelectorAll(
      ".row-label"
    );


  if(labels[0]){

    labels[0].textContent =
      `Lecture progress · ${percentage}%`;

  }


  if(labels[1]){

    labels[1].textContent =
      `Confidence · ${
        chapter.confidence
          ? chapter.confidence + "/5"
          : "Not rated"
      }`;

  }


  card
    .querySelectorAll(
      '.dot[data-action="lecture"]'
    )
    .forEach(
      dot=>{

        const index =
          Number(
            dot.dataset.index
          );


        dot.classList.toggle(
          "done",

          index <
            chapter.completedLectures
        );

      }
    );


  card
    .querySelectorAll(
      '.star[data-action="confidence"]'
    )
    .forEach(
      star=>{

        const value =
          Number(
            star.dataset.value
          );


        star.classList.toggle(
          "on",

          value <=
            chapter.confidence
        );

      }
    );

}


/* =========================================================
   LIVE STATS

   Reads the actual visible chapter cards.
   This is what makes the numbers update
   immediately when a dot/star is tapped.
========================================================= */

function updateVisibleStats(){

  if(
    state.view !==
    "year"
  ){

    return;

  }


  const statsElement =
    document.querySelector(
      ".stats"
    );


  if(!statsElement){

    return;

  }


  const cards =
    Array.from(
      document.querySelectorAll(
        ".chapter"
      )
    );


  let total =
    0;

  let done =
    0;

  let finished =
    0;

  let confidenceSum =
    0;

  let confidenceCount =
    0;


  cards.forEach(
    card=>{

      const progress =
        card.querySelector(
          ".chapter-progress"
        );


      if(progress){

        const match =
          progress.textContent
            .trim()
            .match(
              /^(\d+)\s*\/\s*(\d+)$/
            );


        if(match){

          const completed =
            Number(
              match[1]
            );

          const lectures =
            Number(
              match[2]
            );


          total +=
            lectures;


          done +=
            Math.min(
              completed,
              lectures
            );


          if(
            lectures > 0 &&
            completed ===
              lectures
          ){

            finished++;

          }

        }

      }


      const selectedStars =
        card.querySelectorAll(
          ".star.on"
        ).length;


      if(
        selectedStars > 0
      ){

        confidenceSum +=
          selectedStars;

        confidenceCount++;

      }

    }
  );


  const percentage =
    total
      ? Math.round(
          done /
          total *
          100
        )
      : 0;


  const averageConfidence =
    confidenceCount
      ? confidenceSum /
        confidenceCount
      : 0;


  const values =
    statsElement.querySelectorAll(
      ".stat-num"
    );


  if(values[0]){

    values[0].textContent =
      percentage + "%";

  }


  if(values[1]){

    values[1].textContent =
      `${done}/${total}`;

  }


  if(values[2]){

    values[2].textContent =
      `${finished}/${cards.length}`;

  }


  if(values[3]){

    values[3].textContent =
      `${
        averageConfidence
          ? averageConfidence.toFixed(1)
          : "—"
      } / 5`;

  }

}


/* =========================================================
   ADD CHAPTER MODAL
========================================================= */

function createChapterModal(){

  const subject =
    SUBJECTS.find(
      item =>
        item.key ===
        state.subject
    );


  const backdrop =
    document.createElement(
      "div"
    );


  backdrop.className =
    "modal-backdrop";


  backdrop.innerHTML = `

    <div
      class="chapter-modal"
      style="
        --tint:${subject.color}
      "
    >

      <div class="chapter-modal-title">
        Add chapter
      </div>


      <form id="chapterModalForm">

        <input
          id="chapterNameInput"
          type="text"
          placeholder="Chapter name"
          maxlength="150"
          autocomplete="off"
          required
        >


        <input
          id="lectureTotalInput"
          type="number"
          min="1"
          max="1000"
          inputmode="numeric"
          placeholder="Total lectures"
          required
        >


        <div class="modal-actions">

          <button
            class="modal-cancel"
            id="chapterCancel"
            type="button"
          >
            Cancel
          </button>


          <button
            class="modal-submit"
            type="submit"
          >
            Add chapter
          </button>

        </div>

      </form>

    </div>

  `;


  document.body.appendChild(
    backdrop
  );


  const nameInput =
    backdrop.querySelector(
      "#chapterNameInput"
    );


  const lectureInput =
    backdrop.querySelector(
      "#lectureTotalInput"
    );


  const form =
    backdrop.querySelector(
      "#chapterModalForm"
    );


  function closeModal(){

    backdrop.remove();

  }


  backdrop
    .querySelector(
      "#chapterCancel"
    )
    .onclick =
      closeModal;


  backdrop.addEventListener(
    "click",
    event=>{

      if(
        event.target ===
        backdrop
      ){

        closeModal();

      }

    }
  );


  form.addEventListener(
    "submit",
    async event=>{

      event.preventDefault();


      const name =
        nameInput.value.trim();


      let total =
        parseInt(
          lectureInput.value,
          10
        );


      if(!name){

        nameInput.focus();

        return;

      }


      if(
        !Number.isFinite(
          total
        ) ||
        total < 1
      ){

        lectureInput.focus();

        return;

      }


      total =
        Math.min(
          total,
          1000
        );


      const yearData =
        state.data[
          state.subject
        ]
        .years[
          state.year
        ];


      yearData.chapters.push({

        id:
          uid(),

        name,

        totalLectures:
          total,

        completedLectures:
          0,

        confidence:
          0

      });


      state.lastStudied = {

        subject:
          state.subject,

        year:
          state.year,

        chapterId:
          yearData
            .chapters[
              yearData
                .chapters
                .length - 1
            ]
            .id,

        timestamp:
          Date.now()

      };


      await saveNow();


      closeModal();


      render();

    }
  );


  requestAnimationFrame(
    ()=>{
      nameInput.focus();
    }
  );

}


/* =========================================================
   BIND COMMON
========================================================= */

function bindCommon(){

  const brand =
    document.getElementById(
      "brand"
    );


  if(brand){

    brand.addEventListener(
      "blur",
      ()=>{

        const title =
          brand.textContent.trim();


        if(title){

          settings.title =
            title;

        }else{

          brand.textContent =
            settings.title;

        }


        save();

      }
    );


    brand.addEventListener(
      "keydown",
      event=>{

        if(
          event.key ===
          "Enter"
        ){

          event.preventDefault();

          brand.blur();

        }

      }
    );

  }


  const exportButton =
    document.getElementById(
      "export"
    );


  if(exportButton){

    exportButton.onclick =
      exportData;

  }


  const importButton =
    document.getElementById(
      "import"
    );


  if(importButton){

    importButton.onclick =
      ()=>{

        document
          .getElementById(
            "importFile"
          )
          .click();

      };

  }


  const resetButton =
    document.getElementById(
      "reset"
    );


  if(resetButton){

    resetButton.onclick =
      resetAll;

  }


  const backgroundButton =
    document.getElementById(
      "bgBtn"
    );


  if(backgroundButton){

    backgroundButton.onclick =
      ()=>{

        document
          .getElementById(
            "bgFile"
          )
          .click();

      };

  }


  const clearBackground =
    document.getElementById(
      "clearBg"
    );


  if(clearBackground){

    clearBackground.onclick =
      async()=>{

        state.background =
          null;


        applyBackground();


        try{

          await dbDelete(
            BACKGROUND_KEY
          );

        }catch(error){

          console.error(
            "Could not clear background.",
            error
          );

        }

      };

  }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const app =
    document.getElementById(
      "app"
    );


  if(
    state.view ===
    "home"
  ){

    app.innerHTML =
      home();

  }


  else if(
    state.view ===
    "subject"
  ){

    app.innerHTML =
      subjectPage(
        state.subject
      );

  }


  else if(
    state.view ===
    "year"
  ){

    app.innerHTML =
      yearPage(
        state.subject,
        state.year
      );

  }


  bindCommon();


  const page =
    app.firstElementChild;


  if(page){

    page.classList.remove(
      "page-enter"
    );


    void page.offsetWidth;


    page.classList.add(
      "page-enter"
    );

  }


  /* =======================================================
     HOME
  ======================================================= */

  if(
    state.view ===
    "home"
  ){

    document
      .querySelectorAll(
        "[data-subject]"
      )
      .forEach(
        button=>{

          button.addEventListener(
            "click",
            event=>{

              createRipple(
                button,
                event
              );


              setTimeout(
                ()=>{

                  state.view =
                    "subject";


                  state.subject =
                    button.dataset
                      .subject;


                  render();

                },
                180
              );

            }
          );

        }
      );

  }


  /* =======================================================
     SUBJECT
  ======================================================= */

  if(
    state.view ===
    "subject"
  ){

    const back =
      document.getElementById(
        "back"
      );


    if(back){

      back.onclick =
        ()=>{

          state.view =
            "home";


          state.subject =
            null;


          state.year =
            null;


          render();

        };

    }


    document
      .querySelectorAll(
        "[data-year]"
      )
      .forEach(
        button=>{

          button.addEventListener(
            "click",
            event=>{

              createRipple(
                button,
                event
              );


              setTimeout(
                ()=>{

                  state.view =
                    "year";


                  state.year =
                    button.dataset
                      .year;


                  render();

                },
                180
              );

            }
          );

        }
      );

  }


  /* =======================================================
     YEAR
  ======================================================= */

  if(
    state.view ===
    "year"
  ){

    const back =
      document.getElementById(
        "back"
      );


    if(back){

      back.onclick =
        ()=>{

          state.view =
            "subject";


          render();

        };

    }


    /* -----------------------------------------------
       ADD CHAPTER
    ----------------------------------------------- */

    const addChapterButton =
      document.getElementById(
        "addChapterButton"
      );


    if(addChapterButton){

      addChapterButton.onclick =
        event=>{

          createRipple(
            addChapterButton,
            event
          );


          setTimeout(
            createChapterModal,
            130
          );

        };

    }


    /* -----------------------------------------------
       SEARCH
    ----------------------------------------------- */

    const search =
      document.getElementById(
        "chapterSearch"
      );


    if(search){

      search.addEventListener(
        "input",
        ()=>{

          const query =
            search.value
              .trim()
              .toLowerCase();


          document
            .querySelectorAll(
              ".chapter"
            )
            .forEach(
              card=>{

                const title =
                  card
                    .querySelector(
                      ".chapter-title"
                    )
                    ?.textContent
                    .toLowerCase() ||
                  "";


                card.style.display =
                  !query ||
                  title.includes(
                    query
                  )
                    ? ""
                    : "none";

              }
            );

        }
      );

    }


    /* -----------------------------------------------
       CHAPTER ACTIONS
    ----------------------------------------------- */

    const chapters =
      document.querySelector(
        ".chapters"
      );


    if(chapters){

      chapters.addEventListener(
        "click",
        async event=>{

          const button =
            event.target.closest(
              "[data-action]"
            );


          if(!button){

            return;

          }


          const chapter =
            state.data[
              state.subject
            ]
            ?.years?.[
              state.year
            ]
            ?.chapters
            ?.find(
              item =>
                item.id ===
                button.dataset.id
            );


          if(!chapter){

            return;

          }


          const action =
            button.dataset.action;


          /* ---------------------------------------------
             LECTURE
          --------------------------------------------- */

          if(
            action ===
            "lecture"
          ){

            const index =
              Number(
                button.dataset.index
              );


            const wasComplete =
              chapter.completedLectures ===
              chapter.totalLectures;


            /*
              Tap a lecture:

              1,2,3,4...
              advances progress.

              Tapping the currently completed
              lecture toggles it back one step.
            */

            chapter.completedLectures =
              (
                index + 1 ===
                chapter.completedLectures
              )

                ? index

                : index + 1;


            chapter.completedLectures =
              Math.min(
                chapter.completedLectures,
                chapter.totalLectures
              );


            state.lastStudied = {

              subject:
                state.subject,

              year:
                state.year,

              chapterId:
                chapter.id,

              timestamp:
                Date.now()

            };


            await saveNow();


            updateChapterCard(
              button.closest(
                ".chapter"
              ),
              chapter
            );


            /*
              LIVE STATS
            */

            updateVisibleStats();


            /*
              Confetti only when a chapter
              actually reaches 100%.
            */

            if(
              !wasComplete &&
              chapter.totalLectures > 0 &&
              chapter.completedLectures ===
                chapter.totalLectures
            ){

              launchConfetti();

            }


            return;

          }


          /* ---------------------------------------------
             CONFIDENCE
          --------------------------------------------- */

          if(
            action ===
            "confidence"
          ){

            const value =
              Number(
                button.dataset.value
              );


            chapter.confidence =
              chapter.confidence ===
              value

                ? 0

                : value;


            await saveNow();


            updateChapterCard(
              button.closest(
                ".chapter"
              ),
              chapter
            );


            /*
              LIVE STATS
            */

            updateVisibleStats();


            return;

          }


          /* ---------------------------------------------
             RENAME
          --------------------------------------------- */

          if(
            action ===
            "rename"
          ){

            const nextName =
              prompt(
                "Rename chapter:",
                chapter.name
              );


            if(
              nextName ===
              null
            ){

              return;

            }


            const clean =
              nextName.trim();


            if(!clean){

              return;

            }


            chapter.name =
              clean;


            await saveNow();


            render();


            return;

          }


          /* ---------------------------------------------
             EDIT LECTURE TOTAL
          --------------------------------------------- */

          if(
            action ===
            "edit-total"
          ){

            const raw =
              prompt(
                "Total lectures:",
                chapter.totalLectures
              );


            if(
              raw ===
              null
            ){

              return;

            }


            const total =
              parseInt(
                raw,
                10
              );


            if(
              !Number.isFinite(
                total
              ) ||
              total < 1
            ){

              return;

            }


            chapter.totalLectures =
              Math.min(
                total,
                1000
              );


            chapter.completedLectures =
              Math.min(
                chapter.completedLectures,
                chapter.totalLectures
              );


            await saveNow();


            render();


            return;

          }


          /* ---------------------------------------------
             DELETE
          --------------------------------------------- */

          if(
            action ===
            "delete"
          ){

            if(
              !confirm(
                "Delete this chapter?"
              )
            ){

              return;

            }


            state.data[
              state.subject
            ]
            .years[
              state.year
            ]
            .chapters =
              state.data[
                state.subject
              ]
              .years[
                state.year
              ]
              .chapters
              .filter(
                item =>
                  item.id !==
                  chapter.id
              );


            if(
              state.lastStudied &&
              state.lastStudied.chapterId ===
                chapter.id
            ){

              state.lastStudied =
                null;

            }


            await saveNow();


            render();


            return;

          }

        }
      );

    }

  }

}


/* =========================================================
   FILE INPUTS
========================================================= */

document
  .getElementById(
    "importFile"
  )
  .addEventListener(
    "change",
    event=>{

      const file =
        event.target.files?.[0];


      if(file){

        importData(
          file
        );

      }


      event.target.value =
        "";

    }
  );


document
  .getElementById(
    "bgFile"
  )
  .addEventListener(
    "change",
    event=>{

      const file =
        event.target.files?.[0];


      if(!file){

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        readerEvent=>{

          const image =
            new Image();


          image.onload =
            async()=>{

              const maxSize =
                1800;


              const scale =
                Math.min(
                  1,
                  maxSize /
                  image.width
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.round(
                  image.width *
                  scale
                );


              canvas.height =
                Math.round(
                  image.height *
                  scale
                );


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
              );


              state.background =
                canvas.toDataURL(
                  "image/jpeg",
                  .78
                );


              applyBackground();


              try{

                await dbSet(
                  BACKGROUND_KEY,
                  state.background
                );

              }catch(error){

                console.error(
                  error
                );


                alert(
                  "That image could not be saved."
                );

              }

            };


          image.src =
            readerEvent.target.result;

        };


      reader.readAsDataURL(
        file
      );


      event.target.value =
        "";

    }
  );


/* =========================================================
   SERVICE WORKER
========================================================= */

if(
  "serviceWorker" in
  navigator
){

  window.addEventListener(
    "load",
    ()=>{

      navigator
        .serviceWorker
        .register(
          "./service-worker.js"
        )
        .catch(
          error=>{

            console.warn(
              "Service worker registration failed.",
              error
            );

          }
        );

    }
  );

}

   INIT
========================================================= */

(async function init(){

  try{

    await load();


    applyBackground();


    render();


  }catch(error){

    console.error(
      error
    );


    document
      .getElementById(
        "app"
      )
      .innerHTML = `

        <div class="empty">

          Could not load Study Tracker.

          <br><br>

          Please reload the page.

        </div>

      `;

  }

})();


})();
