<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f2ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Tracker">

<title>Study Tracker</title>

<link rel="manifest" href="./manifest.json">

<link
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>
:root{
  --bg:#f4f2ea;
  --paper:rgba(255,253,247,.92);
  --ink:#232520;
  --muted:#6b6d63;
  --border:rgba(35,37,32,.14);
  --border2:rgba(35,37,32,.28);

  --physics:#3d5a80;
  --maths:#d4a900;
  --chemistry:#b94a48;
  --biology:#4f8a5b;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  min-height:100%;
  margin:0;
}

html{
  background:var(--bg);
}

body{
  color:var(--ink);
  font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  background:transparent;
  overscroll-behavior-x:none;
}

#backgroundLayer{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  min-height:100%;
  z-index:0;

  background-color:var(--bg);
  background-position:center center;
  background-size:cover;
  background-repeat:no-repeat;

  pointer-events:none;
}

button,
input{
  font:inherit;
}

button{
  -webkit-appearance:none;
  appearance:none;
}

input{
  -webkit-appearance:none;
  appearance:none;
}

.wrap{
  position:relative;
  z-index:1;

  width:min(1000px,100%);
  margin:auto;

  padding:
    max(28px,env(safe-area-inset-top))
    20px
    max(70px,calc(40px + env(safe-area-inset-bottom)));
}

.display{
  font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;
}

.mono{
  font-family:"JetBrains Mono",ui-monospace,monospace;
}

.topbar{
  margin-bottom:25px;
}

.brand-tab{
  display:inline-flex;
  align-items:center;
  width:fit-content;
  max-width:100%;

  background:var(--paper);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);
  border-radius:16px;
  padding:10px 16px;

  box-shadow:
    0 9px 24px rgba(35,37,32,.07);
}

.brand{
  font:600 34px "Space Grotesk","Segoe UI",system-ui,sans-serif;
  margin:0;
}

.brand:hover,
.brand:focus{
  background:rgba(255,253,247,.78);
  box-shadow:0 4px 15px rgba(35,37,32,.08);
}

/* =========================================================
   BACK BUTTON
   ========================================================= */

.back{
  position:relative;
  display:inline-block;
  overflow:hidden;
  isolation:isolate;

  border:1px solid var(--border2);
  background:var(--paper);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  color:var(--muted);

  font-size:22px;
  font-weight:600;

  line-height:1.2;

  padding:12px 16px;
  margin:0;

  border-radius:14px;

  box-shadow:
    0 9px 24px rgba(35,37,32,.07);

  cursor:pointer;

  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;

  transition:
    color .18s ease,
    transform .18s ease,
    box-shadow .18s ease;
}

.back::before{
  content:"";
  position:absolute;
  z-index:-1;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  border-radius:50%;
  background:rgba(255,255,255,.42);
  transform:translate(-50%,-50%) scale(0);
  opacity:0;
  pointer-events:none;
}

.back:hover{
  color:var(--ink);
  transform:translateY(-4px) scale(1.02);
  box-shadow:
    0 16px 30px rgba(35,37,32,.12);
}

.back:hover::before{
  animation:backCircle .5s ease-out forwards;
}

.back:active{
  transform:translateY(-1px) scale(.97);
  box-shadow:
    0 8px 18px rgba(35,37,32,.10);
}

.back:active::before{
  animation:backCircle .38s ease-out forwards;
}

/* =========================================================
   SUBJECT
   ========================================================= */

.subject-head{
  --tint:var(--physics);

  display:flex;
  justify-content:space-between;
  align-items:end;
}

.page-header{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:12px;
  margin-bottom:20px;
}

/* =========================================================
   TAB DECORATION + POP-UP ANIMATION
   ========================================================= */

.brand-tab,
.back,
.subject-tab,
.year-tab,
.stat,
.tile{
  position:relative;
  overflow:hidden;
  isolation:isolate;
}

.brand-tab::after,
.back::after,
.subject-tab::after,
.year-tab::after,
.stat::after,
.tile::after{
  content:"";
  position:absolute;
  top:-34px;
  right:-34px;
  width:92px;
  height:92px;
  border-radius:0 0 0 100%;
  background:color-mix(in srgb, var(--tint, #3d5a80) 24%, transparent);
  transform:scale(.82);
  transform-origin:top right;
  transition:transform .22s cubic-bezier(.2,.8,.2,1), opacity .22s ease;
  opacity:.9;
  pointer-events:none;
  z-index:0;
}

.brand-tab > *,
.back > *,
.subject-tab > *,
.year-tab > *,
.stat > *,
.tile > *{
  position:relative;
  z-index:1;
}

.brand-tab,
.back,
.subject-tab,
.year-tab,
.stat,
.tile{
  transition:
    color .18s ease,
    transform .22s cubic-bezier(.2,.8,.2,1),
    box-shadow .22s ease,
    background .18s ease;

  animation:
    tabPop .42s cubic-bezier(.2,.8,.2,1) both;
}

.brand-tab:hover,
.back:hover,
.subject-tab:hover,
.year-tab:hover,
.stat:hover,
.tile:hover{
  transform:translateY(-4px) scale(1.012);
}

.brand-tab:hover::after,
.back:hover::after,
.subject-tab:hover::after,
.year-tab:hover::after,
.stat:hover::after,
.tile:hover::after{
  transform:scale(1.16);
}

.brand-tab:active,
.back:active,
.subject-tab:active,
.year-tab:active,
.stat:active,
.tile:active{
  transform:translateY(-1px) scale(.985);
}

.brand-tab:active::after,
.back:active::after,
.subject-tab:active::after,
.year-tab:active::after,
.stat:active::after,
.tile:active::after{
  transform:scale(1.22);
}

.subject-tab{
  display:inline-flex;
  align-items:center;
  width:fit-content;
  max-width:100%;

  background:var(--paper);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);
  border-radius:16px;
  padding:13px 18px;

  box-shadow:
    0 9px 24px rgba(35,37,32,.07);
}

.subject-title{
  margin:0;

  font:600 32px
    "Space Grotesk",
    "Segoe UI",
    system-ui,
    sans-serif;

  color:var(--tint);
}

/* =========================================================
   STATS
   ========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);

  background:var(--paper);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);
  border-radius:16px;

  overflow:hidden;

  margin:20px 0 27px;

  box-shadow:
    0 9px 25px rgba(35,37,32,.07);
}

.stat{
  padding:18px;
  text-align:center;

  border-right:1px solid var(--border);

  transition:background .18s ease;
}

.stat:last-child{
  border-right:0;
}

.stat:hover{
  background:rgba(255,255,255,.38);
}

/*
  Only requested visual change:
  stats numbers are larger, but not oversized.
*/
.stat-num{
  font:
    600 28px
    "JetBrains Mono",
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  line-height:1.15;
}

.stat-label{
  font-size:12px;
  color:var(--muted);
  margin-top:5px;
}

/* =========================================================
   PAGE
   ========================================================= */

.page-enter{
  animation:
    pageEnter
    .35s
    cubic-bezier(.2,.8,.2,1)
    both;
}

@keyframes pageEnter{
  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================================================
   SUBJECT TILES
   ========================================================= */

.tiles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.tile{
  --tint:var(--physics);

  position:relative;
  overflow:hidden;
  isolation:isolate;

  width:100%;

  background:var(--paper);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);
  border-left:5px solid var(--tint);

  border-radius:16px;

  padding:22px;

  text-align:left;

  cursor:pointer;

  color:var(--ink);

  box-shadow:
    0 9px 24px rgba(35,37,32,.07);

  transition:
    transform .18s,
    box-shadow .18s;

  animation:
    rise
    .45s
    both;

  touch-action:manipulation;

  -webkit-user-select:none;
  user-select:none;
}

.tile > *{
  position:relative;
  z-index:2;
}

.tile:hover{
  transform:translateY(-4px);

  box-shadow:
    0 16px 30px rgba(35,37,32,.12);
}

.tile:active{
  transform:scale(.985);
}

.tile-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.tile-name{
  font:
    600 22px
    "Space Grotesk",
    "Segoe UI",
    system-ui,
    sans-serif;
}

.tile-pct{
  font:
    600 24px
    "JetBrains Mono",
    ui-monospace,
    monospace;
}

.tile-meta{
  display:flex;
  justify-content:space-between;
  gap:12px;

  margin-top:11px;

  color:var(--muted);

  font:
    12px
    "JetBrains Mono",
    ui-monospace,
    monospace;
}

/* =========================================================
   YEAR TABS
   ========================================================= */

.year-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:16px;

  margin:20px 0;
}

.year-tab{
  position:relative;
  overflow:hidden;
  isolation:isolate;

  --tint:var(--physics);

  width:100%;

  background:var(--paper);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:1px solid var(--border2);
  border-top:5px solid var(--tint);

  border-radius:15px;

  padding:20px;

  text-align:left;

  cursor:pointer;

  color:var(--ink);

  box-shadow:
    0 9px 24px rgba(35,37,32,.07);

  transition:
    transform .23s,
    box-shadow .23s;

  animation:
    rise
    .4s
    both;

  touch-action:manipulation;

  -webkit-user-select:none;
  user-select:none;
}

.year-tab:hover{
  transform:translateY(-5px) scale(1.008);

  box-shadow:
    0 18px 35px rgba(35,37,32,.13);
}

.year-tab:active{
  transform:scale(.985);
}

.year-name{
  font:
    600 22px
    "Space Grotesk",
    "Segoe UI",
    system-ui,
    sans-serif;
}

.year-pct{
  float:right;

  font:
    600 24px
    "JetBrains Mono",
    ui-monospace,
    monospace;
}

.year-meta{
  display:block;

  color:var(--muted);

  font:
    12px
    "JetBrains Mono",
    ui-monospace,
    monospace;

  margin-top:11px;
}

/* =========================================================
   ADD
   ========================================================= */

.add-row{
  display:flex;
  justify-content:flex-end;

  margin:20px 0 14px;
}

.plus-button{
  --tint:var(--physics);

  width:44px;
  height:44px;

  display:grid;
  place-items:center;

  border:1px solid var(--border2);
  border-radius:12px;

  background:rgba(255,253,247,.86);

  color:var(--tint);

  font:
    500 27px
    "Space Grotesk",
    sans-serif;

  line-height:1;

  cursor:pointer;

  box-shadow:
    0 7px 18px rgba(35,37,32,.08);

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.plus-button:hover{
  transform:translateY(-2px);

  box-shadow:
    0 12px 24px rgba(35,37,32,.12);
}

.plus-button:active{
  transform:scale(.94);
}

/* =========================================================
   CHAPTER
   ========================================================= */

.chapters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.chapter{
  --tint:var(--physics);

  background:
    rgba(255,253,247,.92);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:
    1px solid
    var(--border2);

  border-left:
    5px solid
    var(--tint);

  border-radius:16px;

  padding:20px;

  box-shadow:
    0 9px 24px rgba(35,37,32,.07);

  animation:
    rise
    .45s
    both;
}

.chapter-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:16px;
}

.chapter-title{
  font:
    600 19px
    "Space Grotesk",
    "Segoe UI",
    system-ui,
    sans-serif;
}

.chapter-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;

  margin-top:5px;
}

.linkbtn{
  border:0;
  padding:0;

  background:transparent;

  color:var(--muted);

  font-size:12px;

  text-decoration:underline;

  cursor:pointer;
}

.linkbtn:hover{
  color:var(--ink);
}

.chapter-progress{
  flex:0 0 auto;

  font:
    600 18px
    "JetBrains Mono",
    ui-monospace,
    monospace;
}

/* =========================================================
   PROGRESS
   ========================================================= */

.bar{
  height:8px;

  margin-top:14px;

  border-radius:999px;

  overflow:hidden;

  background:
    rgba(35,37,32,.08);
}

.bar > div{
  height:100%;

  border-radius:999px;

  background:var(--tint);

  transition:
    width .28s ease;
}

.row-label{
  color:var(--muted);

  font-size:12px;

  margin-top:12px;
}

/* =========================================================
   DOTS
   ========================================================= */

.dots{
  display:flex;
  flex-wrap:wrap;

  gap:7px;

  margin-top:6px;
}

.dot{
  width:30px;
  height:30px;

  display:grid;
  place-items:center;

  padding:0;

  border:
    1px solid
    var(--tint);

  border-radius:50%;

  background:
    rgba(255,255,255,.42);

  color:var(--ink);

  font:
    500 12px
    "JetBrains Mono",
    ui-monospace,
    monospace;

  cursor:pointer;

  transition:
    transform .16s ease,
    background .16s ease,
    color .16s ease,
    box-shadow .16s ease;
}

.dot:hover{
  transform:scale(1.08);
}

.dot:active{
  transform:scale(.90);
}

.dot.done{
  background:var(--tint);
  color:#fff;
  border-color:var(--tint);
}

.dot.done:hover{
  transform:scale(1.10);
}

/* =========================================================
   STARS
   ========================================================= */

.stars{
  display:flex;
  gap:2px;

  margin-top:5px;
}

.star{
  border:0;
  background:transparent;

  padding:0;

  color:
    rgba(35,37,32,.18);

  font-size:20px;
  line-height:1;

  cursor:pointer;

  transition:
    color .16s ease,
    transform .16s ease;
}

.star.on{
  color:var(--tint);
}

.star:hover{
  transform:scale(1.08);
}

.star:active{
  transform:scale(.92);
}

/* =========================================================
   QUICK ADD
   ========================================================= */

.quick-add{
  position:fixed;

  left:50%;
  bottom:
    max(22px,env(safe-area-inset-bottom));

  transform:
    translateX(-50%);

  width:62px;
  height:62px;

  border:0;
  border-radius:50%;

  background:var(--ink);

  color:#fff;

  font:
    400 32px
    "Space Grotesk",
    sans-serif;

  line-height:1;

  cursor:pointer;

  z-index:40;

  box-shadow:
    0 12px 30px rgba(0,0,0,.22);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.quick-add:hover{
  transform:
    translateX(-50%)
    translateY(-5px)
    scale(1.06);

  box-shadow:
    0 18px 36px rgba(0,0,0,.28);
}

.quick-menu{
  position:fixed;

  left:50%;
  bottom:94px;

  transform:
    translateX(-50%);

  z-index:39;

  display:none;

  min-width:190px;

  padding:10px;

  border-radius:18px;

  background:
    rgba(255,253,247,.96);

  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);

  box-shadow:
    0 18px 45px rgba(0,0,0,.2);

  border:
    1px solid
    rgba(0,0,0,.08);
}

.quick-menu.open{
  display:block;
}

.quick-menu button{
  display:block;

  width:100%;

  text-align:left;

  border:0;

  background:transparent;

  padding:11px 12px;

  border-radius:11px;

  cursor:pointer;

  font:inherit;
}

.quick-menu button:hover{
  background:rgba(0,0,0,.06);
}

/* =========================================================
   SETTINGS
   ========================================================= */

.settings-panel{
  margin-top:38px;

  padding:18px;

  background:var(--paper);

  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);

  border:
    1px solid
    var(--border2);

  border-radius:16px;

  box-shadow:
    0 9px 25px rgba(35,37,32,.07);
}

.settings-actions{
  display:flex;
  flex-wrap:wrap;

  gap:8px;
}

.ghost{
  border:
    1px solid
    var(--border2);

  background:
    rgba(255,255,255,.55);

  color:var(--ink);

  padding:9px 12px;

  border-radius:9px;

  cursor:pointer;

  font-size:12px;

  touch-action:manipulation;
}

.ghost:hover{
  background:
    rgba(255,255,255,.82);
}

.ghost.danger{
  color:#a63e3d;
}

.fileinput{
  display:none;
}

/* =========================================================
   AUTHENTICATION
   ========================================================= */

.auth-backdrop{
  position:fixed;
  inset:0;
  z-index:2000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(20,22,18,.30);
  -webkit-backdrop-filter:blur(7px);
  backdrop-filter:blur(7px);
}

.auth-backdrop.open{
  display:flex;
}

.auth-card{
  width:min(430px,100%);
  background:rgba(255,253,247,.97);
  border:1px solid rgba(35,37,32,.20);
  border-radius:20px;
  padding:24px;
  box-shadow:0 25px 70px rgba(0,0,0,.20);
  animation:tabPop .42s cubic-bezier(.2,.8,.2,1) both;
}

.auth-title{
  font:600 28px "Space Grotesk","Segoe UI",system-ui,sans-serif;
}

.auth-subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

#authForm{
  display:grid;
  gap:10px;
  margin-top:18px;
}

#authForm input{
  width:100%;
  border:1px solid var(--border2);
  border-radius:10px;
  padding:12px;
  background:rgba(255,255,255,.7);
  color:var(--ink);
  outline:none;
}

#authForm input:focus{
  border-color:var(--ink);
}

.auth-message{
  min-height:18px;
  color:var(--muted);
  font-size:12px;
}

.auth-actions{
  display:flex;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:8px;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal-backdrop{
  position:fixed;

  inset:0;

  z-index:1000;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:
    max(20px,env(safe-area-inset-top))
    20px
    max(20px,env(safe-area-inset-bottom));

  background:
    rgba(20,22,18,.28);

  -webkit-backdrop-filter:blur(5px);
  backdrop-filter:blur(5px);
}

.modal{
  width:min(430px,100%);

  background:
    rgba(255,253,247,.97);

  border:
    1px solid
    rgba(35,37,32,.20);

  border-radius:20px;

  padding:22px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.20);
}

.modal h3{
  margin:0;

  font:
    600 21px
    "Space Grotesk",
    sans-serif;
}

.modal-note{
  color:var(--muted);

  font-size:12px;

  margin-top:5px;
}

.modal-fields{
  display:grid;

  gap:10px;

  margin-top:17px;
}

.modal-fields input{
  width:100%;

  border:
    1px solid
    var(--border2);

  border-radius:10px;

  padding:12px;

  background:
    rgba(255,255,255,.7);

  color:var(--ink);

  outline:none;
}

.modal-fields input:focus{
  border-color:var(--tint);
}

<script>
(function(){

"use strict";

/* =========================================================
   CONSTANTS
   ========================================================= */

const SUBJECTS = [
  {
    key:"physics",
    name:"Physics",
    color:"var(--physics)"
  },
  {
    key:"maths",
    name:"Maths",
    color:"var(--maths)"
  },
  {
    key:"chemistry",
    name:"Chemistry",
    color:"var(--chemistry)"
  },
  {
    key:"biology",
    name:"Biology",
    color:"var(--biology)"
  }
];

const YEARS = [
  "11th",
  "12th"
];

const DB_NAME =
  "StudyTrackerLocalDB";

const DB_VERSION = 1;

const STORE_NAME =
  "app";

const TRACKER_KEY =
  "tracker";

const BACKGROUND_KEY =
  "background";

const LOCAL_USER_KEY =
  "localUserId";

/* =========================================================
   STATE
   ========================================================= */

let settings = {
  title:"Study Tracker"
};

let state = {
  view:"home",
  subject:null,
  year:null,
  background:null,
  data:{}
};

let saveTimer = null;

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://srvhpccaobzeuobilmrw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_RC0dMw7TPbwhQLLWrz__DA_6tzDPm58";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

let currentUser = null;
let cloudSyncInProgress = false;

/* =========================================================
   DATABASE
   ========================================================= */

function openDB(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );

      request.onupgradeneeded =
        function(){

          const db =
            request.result;

          if(
            !db.objectStoreNames.contains(
              STORE_NAME
            )
          ){

            db.createObjectStore(
              STORE_NAME
            );

          }

        };

      request.onsuccess =
        function(){

          resolve(
            request.result
          );

        };

      request.onerror =
        function(){

          reject(
            request.error
          );

        };

    }
  );

}

async function dbGet(key){

  const db =
    await openDB();

  return new Promise(
    (resolve,reject)=>{

      const tx =
        db.transaction(
          STORE_NAME,
          "readonly"
        );

      const request =
        tx
          .objectStore(STORE_NAME)
          .get(key);

      request.onsuccess =
        function(){

          resolve(
            request.result
          );

        };

      request.onerror =
        function(){

          reject(
            request.error
          );

        };

    }
  );

}

async function dbSet(
  key,
  value
){

  const db =
    await openDB();

  return new Promise(
    (resolve,reject)=>{

      const tx =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );

      tx
        .objectStore(STORE_NAME)
        .put(
          value,
          key
        );

      tx.oncomplete =
        function(){

          resolve();

        };

      tx.onerror =
        function(){

          reject(
            tx.error
          );

        };

    }
  );

}

async function dbDelete(
  key
){

  const db =
    await openDB();

  return new Promise(
    (resolve,reject)=>{

      const tx =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );

      tx
        .objectStore(STORE_NAME)
        .delete(key);

      tx.oncomplete =
        function(){

          resolve();

        };

      tx.onerror =
        function(){

          reject(
            tx.error
          );

        };

    }
  );

}

/* =========================================================
   DATA
   ========================================================= */

function uid(){

  return (
    "id_" +
    Math.random()
      .toString(36)
      .slice(2,10)
  );

}

function blankData(){

  return Object.fromEntries(

    SUBJECTS.map(
      subject => [

        subject.key,

        {
          years:
            Object.fromEntries(

              YEARS.map(
                year => [

                  year,

                  {
                    chapters:[]
                  }

                ]
              )

            )
        }

      ]
    )

  );

}

function normalizeChapter(
  chapter
){

  const total =
    Math.max(
      1,
      Number(
        chapter.totalLectures
      ) || 1
    );

  return {

    id:
      chapter.id ||
      uid(),

    name:
      String(
        chapter.name ||
        "Chapter"
      ),

    totalLectures:
      total,

    completedLectures:
      Math.min(
        total,
        Math.max(
          0,
          Number(
            chapter.completedLectures
          ) || 0
        )
      ),

    confidence:
      Math.min(
        5,
        Math.max(
          0,
          Number(
            chapter.confidence
          ) || 0
        )
      )

  };

}

function normalizeData(
  source
){

  const fresh =
    blankData();

  SUBJECTS.forEach(
    subject => {

      const incoming =
        source?.[
          subject.key
        ];

      if(!incoming){
        return;
      }

      YEARS.forEach(
        year => {

          const incomingYear =
            incoming?.years?.[year];

          if(!incomingYear){
            return;
          }

          let chapters = [];

          if(
            Array.isArray(
              incomingYear.chapters
            )
          ){

            chapters =
              incomingYear.chapters;

          }else if(
            Array.isArray(
              incomingYear.units
            )
          ){

            incomingYear.units.forEach(
              unit => {

                if(
                  Array.isArray(
                    unit.chapters
                  )
                ){

                  chapters.push(
                    ...unit.chapters
                  );

                }

              }
            );

          }

          fresh[
            subject.key
          ]
          .years[
            year
          ]
          .chapters =
            chapters.map(
              normalizeChapter
            );

        }
      );

    }
  );

  return fresh;

}

function allChapters(
  key,
  year
){

  const result = [];

  const years =
    year
      ? [year]
      : YEARS;

  const subject =
    state.data[key];

  if(
    !subject ||
    !subject.years
  ){

    return result;

  }

  years.forEach(
    currentYear => {

      const yearData =
        subject
          .years[
            currentYear
          ];

      if(!yearData){
        return;
      }

      if(
        Array.isArray(
          yearData.chapters
        )
      ){

        result.push(
          ...yearData.chapters
        );

      }

    }
  );

  return result;

}

/* =========================================================
   STATS
   ========================================================= */

function stats(
  chapters
){

  let total = 0;
  let done = 0;
  let finished = 0;

  let confidenceSum = 0;
  let confidenceCount = 0;

  chapters.forEach(
    chapter => {

      const totalLectures =
        Math.max(
          0,
          Number(
            chapter.totalLectures
          ) || 0
        );

      const completedLectures =
        Math.min(
          totalLectures,
          Math.max(
            0,
            Number(
              chapter.completedLectures
            ) || 0
          )
        );

      total +=
        totalLectures;

      done +=
        completedLectures;

      if(
        totalLectures > 0 &&
        completedLectures ===
          totalLectures
      ){

        finished++;

      }

      const confidence =
        Number(
          chapter.confidence
        ) || 0;

      if(confidence > 0){

        confidenceSum +=
          confidence;

        confidenceCount++;

      }

    }
  );

  return {

    total,

    done,

    chapters:
      chapters.length,

    finished,

    pct:
      total
        ? Math.round(
            done /
            total *
            100
          )
        : 0,

    avgConf:
      confidenceCount
        ? confidenceSum /
          confidenceCount
        : 0

  };

}

function overall(){

  return stats(

    SUBJECTS.flatMap(
      subject =>
        allChapters(
          subject.key
        )
    )

  );

}

/* =========================================================
   ESCAPE
   ========================================================= */

function esc(
  value
){

  return String(
    value
  ).replace(
    /[&<>"']/g,
    character =>
      ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#039;"
      })[
        character
      ]
  );

}

/* =========================================================
   LOAD
   ========================================================= */

async function loadLocal(){

  state.data =
    blankData();

  try{

    const stored =
      await dbGet(TRACKER_KEY);

    if(stored){

      if(stored.settings){
        settings = { ...settings, ...stored.settings };
      }

      if(stored.data){
        state.data = normalizeData(stored.data);
      }

    }

  }catch(error){
    console.warn("Could not load tracker data.", error);
  }

  try{

    const background =
      await dbGet(BACKGROUND_KEY);

    if(background){
      state.background = background;
    }

  }catch(error){
    console.warn("Could not load background.", error);
  }

}

function setAuthMessage(message, isError=false){

  const el = document.getElementById("authMessage");

  if(!el){
    return;
  }

  el.textContent = message || "";
  el.style.color = isError ? "#a63e3d" : "var(--muted)";

}

function showAuthGate(){

  const gate = document.getElementById("authGate");

  if(gate){
    gate.classList.add("open");
    gate.setAttribute("aria-hidden","false");
  }

}

function hideAuthGate(){

  const gate = document.getElementById("authGate");

  if(gate){
    gate.classList.remove("open");
    gate.setAttribute("aria-hidden","true");
  }

}

async function cloudSave(){

  if(!currentUser || cloudSyncInProgress){
    return;
  }

  cloudSyncInProgress = true;

  try{

    const { error } =
      await supabaseClient
        .from("study_tracker")
        .upsert({
          user_id:currentUser.id,
          data:state.data,
          background:state.background,
          settings
        },{
          onConflict:"user_id"
        });

    if(error){
      console.error("Could not sync tracker to Supabase.", error);
    }

  }catch(error){
    console.error("Could not sync tracker to Supabase.", error);
  }finally{
    cloudSyncInProgress = false;
  }

}

async function loadCloudOrMigrate(){

  if(!currentUser){
    return;
  }

  try{

    const { data:row, error } =
      await supabaseClient
        .from("study_tracker")
        .select("data, background, settings")
        .eq("user_id",currentUser.id)
        .maybeSingle();

    if(error){
      throw error;
    }

    if(row){

      if(row.settings){
        settings = { ...settings, ...row.settings };
      }

      state.data =
        normalizeData(row.data || {});

      state.background =
        row.background || null;

      await dbSet(TRACKER_KEY,{
        settings,
        data:state.data
      });

      if(state.background){
        await dbSet(BACKGROUND_KEY,state.background);
      }else{
        await dbDelete(BACKGROUND_KEY);
      }

      await dbSet(LOCAL_USER_KEY,currentUser.id);

    }else{

      const localUserId =
        await dbGet(LOCAL_USER_KEY);

      if(!localUserId || localUserId === currentUser.id){
        /* First login on this browser: preserve existing local data. */
        await cloudSave();
      }else{
        /* Local data belongs to another account. Do not copy it. */
        state.data = blankData();
        state.background = null;
        settings = { title:"Study Tracker" };
        await dbSet(TRACKER_KEY,{ settings, data:state.data });
        await dbDelete(BACKGROUND_KEY);
        await cloudSave();
      }

    }

    applyBackground();
    render();

  }catch(error){

    console.error("Could not load tracker from Supabase.", error);
    setAuthMessage("Cloud sync could not be reached. Check your connection and reload.",true);
    alert("Could not connect to your cloud data. Your local data is still available on this device.");

  }

}

async function handleAuthSession(session){

  const user = session?.user || null;

  if(!user){
    currentUser = null;
    showAuthGate();
    return;
  }

  currentUser = user;
  hideAuthGate();
  await loadCloudOrMigrate();

}

async function initAuth(){

  const form = document.getElementById("authForm");
  const signUp = document.getElementById("authSignUp");
  const emailInput = document.getElementById("authEmail");
  const passwordInput = document.getElementById("authPassword");

  if(form){
    form.addEventListener("submit",async event=>{
      event.preventDefault();
      setAuthMessage("Signing in…");

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email:emailInput.value.trim(),
          password:passwordInput.value
        });

      if(error){
        setAuthMessage(error.message,true);
      }
    });
  }

  if(signUp){
    signUp.addEventListener("click",async()=>{
      setAuthMessage("Creating account…");

      const { data, error } =
        await supabaseClient.auth.signUp({
          email:emailInput.value.trim(),
          password:passwordInput.value
        });

      if(error){
        setAuthMessage(error.message,true);
        return;
      }

      if(data.session){
        setAuthMessage("Account created.");
      }else{
        setAuthMessage("Account created. Check your email to confirm your account, then sign in.");
      }
    });
  }

  supabaseClient.auth.onAuthStateChange((event,session)=>{
    setTimeout(()=>{
      handleAuthSession(session);
    },0);
  });

  const { data, error } =
    await supabaseClient.auth.getSession();

  if(error){
    console.error("Could not get Supabase session.",error);
    showAuthGate();
    return;
  }

  await handleAuthSession(data.session);

}


/* =========================================================
   SAVE
   ========================================================= */

function save(){

  clearTimeout(
    saveTimer
  );

  saveTimer =
    setTimeout(
      async()=>{

        try{

          await dbSet(
            TRACKER_KEY,
            {
              settings,
              data:
                state.data
            }
          );

          await cloudSave();

        }catch(error){

          console.error(
            "Could not save tracker data.",
            error
          );

        }

      },
      150
    );

}

/* =========================================================
   BACKGROUND
   ========================================================= */

function applyBackground(){

  const layer =
    document.getElementById(
      "backgroundLayer"
    );

  if(!layer){
    return;
  }

  layer.style.backgroundImage =
    state.background
      ? `url("${state.background}")`
      : "none";

}

/* =========================================================
   EXPORT
   ========================================================= */

function exportData(){

  const backup = {

    version:1,

    exportedAt:
      new Date()
        .toISOString(),

    settings,

    data:
      state.data,

    background:
      state.background

  };

  const blob =
    new Blob(
      [
        JSON.stringify(
          backup,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const anchor =
    document.createElement(
      "a"
    );

  anchor.href =
    url;

  anchor.download =
    "study-tracker-backup.json";

  document.body.appendChild(
    anchor
  );

  anchor.click();

  anchor.remove();

  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    100
  );

}

/* =========================================================
   IMPORT
   ========================================================= */

function importData(
  file
){

  const reader =
    new FileReader();

  reader.onload =
    async function(){

      try{

        const backup =
          JSON.parse(
            reader.result
          );

        if(backup.settings){

          settings = {
            ...settings,
            ...backup.settings
          };

        }

        state.data =
          normalizeData(
            backup.data || {}
          );

        if(
          typeof backup.background ===
            "string" &&
          backup.background
        ){

          state.background =
            backup.background;

          applyBackground();

          await dbSet(
            BACKGROUND_KEY,
            state.background
          );

        }else{

          state.background = null;
          applyBackground();
          await dbDelete(BACKGROUND_KEY);

        }

        save();

        render();

        alert(
          "Backup imported successfully."
        );

      }catch(error){

        console.error(
          error
        );

        alert(
          "Invalid backup file."
        );

      }

    };

  reader.readAsText(
    file
  );

}

/* =========================================================
   RESET
   ========================================================= */

async function resetAll(){

  const confirmed =
    confirm(
      "Delete all study data?"
    );

  if(!confirmed){
    return;
  }

  state.data =
    blankData();

  state.view =
    "home";

  state.subject =
    null;

  state.year =
    null;

  await dbSet(
    TRACKER_KEY,
    {
      settings,
      data:
        state.data
    }
  );

  await dbDelete(
    BACKGROUND_KEY
  );

  await cloudSave();

  render();

}

/* =========================================================
   HOME
   ========================================================= */

function home(){

  const overallStats =
    overall();

  return shell(`

    <div
      class="stats"
      data-stats-scope="overall"
    >

      <div class="stat">

        <div
          class="stat-num"
          data-stat="pct"
        >
          ${overallStats.pct}%
        </div>

        <div class="stat-label">
          Overall completion
        </div>

      </div>

<div class="stat">

        <div
          class="stat-num"
          data-stat="chapters"
        >
          ${overallStats.finished}/${overallStats.chapters}
        </div>

        <div class="stat-label">
          Chapters
        </div>

      </div>

<div class="stat">

        <div
          class="stat-num"
          data-stat="lectures"
        >
          ${overallStats.done}/${overallStats.total}
        </div>

        <div class="stat-label">
          Lectures
        </div>

      </div>

<div class="stat">

        <div
          class="stat-num"
          data-stat="confidence"
        >
          ${
            overallStats.avgConf
              ? overallStats.avgConf.toFixed(1)
              : "—"
          } / 5
        </div>

        <div class="stat-label">
          Avg. confidence
        </div>

      </div>

    </div>

    <div class="tiles">

      ${SUBJECTS.map(
        (subject,index)=>{

          const subjectStats =

/* =========================================================
   CHAPTER CARD
   ========================================================= */

function chapterCard(
  subject,
  chapter,
  index
){

  const percentage =
    chapter.totalLectures
      ? Math.round(
          chapter.completedLectures /
          chapter.totalLectures *
          100
        )
      : 0;

  const dots =
    Array.from(
      {
        length:
          chapter.totalLectures
      },
      (_,dotIndex)=>`

        <button
          class="dot ${
            dotIndex <
            chapter.completedLectures
              ? "done"
              : ""
          }"
          data-action="lecture"
          data-id="${esc(chapter.id)}"
          data-index="${dotIndex}"
          title="Lecture ${dotIndex + 1}"
          type="button"
        >
          ${dotIndex + 1}
        </button>

      `
    ).join("");

  const stars =
    Array.from(
      {
        length:5
      },
      (_,starIndex)=>`

        <button
          class="star ${
            starIndex <
            chapter.confidence
              ? "on"
              : ""
          }"
          data-action="confidence"
          data-id="${esc(chapter.id)}"
          data-value="${starIndex + 1}"
          title="${starIndex + 1}/5"
          type="button"
        >
          ★
        </button>

      `
    ).join("");

  return `

    <div
      class="chapter"
      style="
        --tint:${subject.color};
        animation-delay:${(index || 0) * .04}s
      "
      data-chapter-id="${esc(chapter.id)}"
    >

      <div class="chapter-head">

        <div>

          <div class="chapter-title">
            ${esc(chapter.name)}
          </div>

          <div class="chapter-actions">

            <button
              class="linkbtn"
              data-action="rename"
              data-id="${esc(chapter.id)}"
              type="button"
            >
              rename
            </button>

            <button
              class="linkbtn"
              data-action="edit-total"
              data-id="${esc(chapter.id)}"
              type="button"
            >
              edit lectures
            </button>

            <button
              class="linkbtn"
              data-action="delete"
              data-id="${esc(chapter.id)}"
              type="button"
            >
              delete
            </button>

          </div>

        </div>

        <div class="chapter-progress">
          ${chapter.completedLectures}/${chapter.totalLectures}
        </div>

      </div>

      <div class="bar">

        <div
          style="
            width:${percentage}%
          "
        ></div>

      </div>

      <div class="row-label">
        Lecture progress · ${percentage}%
      </div>

      <div class="dots">
        ${dots}
      </div>

      <div class="row-label">
        Confidence ·
        ${
          chapter.confidence
            ? chapter.confidence + "/5"
            : "Not rated"
        }
      </div>

      <div class="stars">
        ${stars}
      </div>

    </div>

  `;

}

/* =========================================================
   CHAPTER CARD LIVE UPDATE
   ========================================================= */

function updateChapterCard(
  card,
  chapter
){

  if(
    !card ||
    !chapter
  ){

    return;

  }

  const percentage =
    chapter.totalLectures
      ? Math.round(
          chapter.completedLectures /
          chapter.totalLectures *
          100
        )
      : 0;

  const progress =
    card.querySelector(
      ".chapter-progress"
    );

  if(progress){

    progress.textContent =
      `${chapter.completedLectures}/${chapter.totalLectures}`;

  }

  const fill =
    card.querySelector(
      ".bar > div"
    );

  if(fill){

    fill.style.width =
      percentage + "%";

  }

  const labels =
    card.querySelectorAll(
      ".row-label"
    );

  if(labels[0]){

    labels[0].textContent =
      `Lecture progress · ${percentage}%`;

  }

  if(labels[1]){

    labels[1].textContent =
      `Confidence · ${
        chapter.confidence
          ? chapter.confidence + "/5"
          : "Not rated"
      }`;

  }

  card
    .querySelectorAll(
      '.dot[data-action="lecture"]'
    )
    .forEach(
      dot=>{

        const index =
          Number(
            dot.dataset.index
          );

        dot.classList.toggle(
          "done",
          index <
            chapter.completedLectures
        );

      }
    );

  card
    .querySelectorAll(
      '.star[data-action="confidence"]'
    )
    .forEach(
      star=>{

        const value =
          Number(
            star.dataset.value
          );

        star.classList.toggle(
          "on",
          value <=
            chapter.confidence
        );

      }
    );

}

/* =========================================================
   ⭐ LIVE STATS FIX
   =========================================================

   IMPORTANT:

   We calculate the visible stats directly from the
   chapter cards currently on screen.

   This avoids relying on a second state calculation
   immediately after a click.

   Therefore:

     2/4 -> click -> 3/4

   immediately becomes:

     50% -> 75%
     2/4  -> 3/4

   and when the final lecture is clicked:

     100%
     4/4
     1/1
*/

function updateVisibleStats(){

  const statsBox =
    document.querySelector(
      ".stats[data-stats-scope='year']"
    );

  if(!statsBox){

    return;

  }

  const cards =
    Array.from(
      document.querySelectorAll(
        ".chapter"
      )
    );

  let total = 0;
  let done = 0;
  let finished = 0;

  let confidenceSum = 0;
  let confidenceCount = 0;

  cards.forEach(
    card=>{

      const progress =
        card.querySelector(
          ".chapter-progress"
        );

      if(progress){

        const match =
          progress.textContent
            .trim()
            .match(
              /^(\d+)\s*\/\s*(\d+)$/
            );

        if(match){

          const completed =
            Number(
              match[1]
            );

          const lectures =
            Number(
              match[2]
            );

          total +=
            lectures;

          done +=
            Math.min(
              completed,
              lectures
            );

          if(
            lectures > 0 &&
            completed === lectures
          ){

            finished++;

          }

        }

      }

      const selectedStars =
        card.querySelectorAll(
          ".star.on"
        ).length;

      if(selectedStars > 0){

        confidenceSum +=
          selectedStars;

        confidenceCount++;

      }

    }
  );

  const chapterCount =
    cards.length;

  const percentage =
    total > 0
      ? Math.round(
          done /
          total *
          100
        )
      : 0;

  const averageConfidence =
    confidenceCount > 0
      ? confidenceSum /
        confidenceCount
      : 0;

  const pctElement =
    statsBox.querySelector(
      '[data-stat="pct"]'
    );

  const lecturesElement =
    statsBox.querySelector(
      '[data-stat="lectures"]'
    );

  const chaptersElement =
    statsBox.querySelector(
      '[data-stat="chapters"]'
    );

  const confidenceElement =
    statsBox.querySelector(
      '[data-stat="confidence"]'
    );

  if(pctElement){

    pctElement.textContent =
      `${percentage}%`;

  }

  if(lecturesElement){

    lecturesElement.textContent =
      `${done}/${total}`;

  }

  if(chaptersElement){

    chaptersElement.textContent =
      `${finished}/${chapterCount}`;

  }

  if(confidenceElement){

    confidenceElement.textContent =
      `${
        averageConfidence
          ? averageConfidence.toFixed(1)
          : "—"
      } / 5`;

  }

}

function createChapterModal(){

  const subject =
    SUBJECTS.find(
      item =>
        item.key ===
        state.subject
    );

  if(!subject){
    return;
  }

  const backdrop =
    document.createElement(
      "div"
    );

  backdrop.className =
    "modal-backdrop";

  backdrop.innerHTML = `

    <div
      class="modal"
      style="--tint:${subject.color}"
    >

      <h3>
        Add chapter
      </h3>

      <div class="modal-note">
        Add the chapter and total number of lectures.
      </div>

      <div class="modal-fields">

        <input
          id="modalChapterName"
          type="text"
          placeholder="Chapter name"
          autocomplete="off"
        >

        <input
          id="modalLectureTotal"
          type="number"
          min="1"
          inputmode="numeric"
          placeholder="Total lectures"
        >

      </div>

      <div class="modal-actions">

        <button
          class="secondary"
          id="modalCancel"
          type="button"
        >
          Cancel
        </button>

        <button
          class="primary"
          id="modalAdd"
          type="button"
        >
          Add chapter
        </button>

      </div>

    </div>

  `;

  document.body.appendChild(
    backdrop
  );

  const nameInput =
    backdrop.querySelector(
      "#modalChapterName"
    );

  const lectureInput =
    backdrop.querySelector(
      "#modalLectureTotal"
    );

  function close(){

    backdrop.remove();

  }

  backdrop
    .querySelector(
      "#modalCancel"
    )
    .onclick =
      close;

  backdrop.addEventListener(
    "click",
    event=>{

      if(
        event.target ===
        backdrop
      ){

        close();

      }

    }
  );

  backdrop
    .querySelector(
      "#modalAdd"
    )
    .onclick =
      ()=>{

        const name =
          nameInput.value.trim();

        let total =
          parseInt(
            lectureInput.value,
            10
          );

        if(!name){

          nameInput.focus();

          return;

        }

        if(
          !Number.isFinite(total) ||
          total < 1
        ){

          total = 1;

        }

        const yearData =
          state.data[
            state.subject
          ]
          .years[
            state.year
          ];

        if(
          !Array.isArray(
            yearData.chapters
          )
        ){

          yearData.chapters = [];

        }

        yearData.chapters.push({

          id:uid(),

          name,

          totalLectures:
            Math.min(
              total,
              1000
            ),

          completedLectures:0,

          confidence:0

        });

        save();

        close();

        render();

      };

  setTimeout(
    ()=>{
      nameInput.focus();
    },
    50
  );

}

/* =========================================================
   RENDER
   ========================================================= */

function render(){

  const app =
    document.getElementById(
      "app"
    );

  if(!app){
    return;
  }

  if(
    state.view ===
    "home"
  ){

    app.innerHTML =
      home();

  }else if(
    state.view ===
    "subject"
  ){

    app.innerHTML =
      subjectPage(
        state.subject
      );

  }else{

    app.innerHTML =
      yearPage(
        state.subject,
        state.year
      );

  }

  bindCommon();

  const page =
    app.firstElementChild;

  if(page){

    page.classList.remove(
      "page-enter"
    );

    void page.offsetWidth;

    page.classList.add(
      "page-enter"
    );

  }

  /* =======================================================
     HOME
     ======================================================= */

  if(
    state.view ===
    "home"
  ){

    document
      .querySelectorAll(
        "[data-subject]"
      )
      .forEach(
        button=>{

          button.onclick =
            ()=>{

              state.view =
                "subject";

              state.subject =
                button.dataset
                  .subject;

              render();

            };

        }
      );

  }

  /* =======================================================
     SUBJECT
     ======================================================= */

  if(
    state.view ===
    "subject"
  ){

    const back =
      document.getElementById(
        "back"
      );

    if(back){

      back.onclick =
        ()=>{

          state.view =
            "home";

          render();

        };

    }

    document
      .querySelectorAll(
        "[data-year]"
      )
      .forEach(
        button=>{

          button.onclick =
            ()=>{

              state.view =
                "year";

              state.year =
                button.dataset
                  .year;

              render();

            };

        }
      );

  }

  /* =======================================================
     YEAR
     ======================================================= */

  if(
    state.view ===
    "year"
  ){

    const back =
      document.getElementById(
        "back"
      );

    if(back){

      back.onclick =
        ()=>{

          state.view =
            "subject";

          render();

        };

    }

    const addChapterButton =
      document.getElementById(
        "addChapterButton"
      );

    if(addChapterButton){

      addChapterButton.onclick =
        ()=>{
          createChapterModal();
        };

    }

    const chaptersContainer =
      document.querySelector(
        ".chapters"
      );

    if(chaptersContainer){

      chaptersContainer.addEventListener(
        "click",
        event=>{

          const button =
            event.target.closest(
              "[data-action]"
            );

          if(!button){
            return;
          }

          const yearData =
            state.data[
              state.subject
            ]
            ?.years?.[
              state.year
            ];

          if(!yearData){
            return;
          }

          const chapter =
            yearData.chapters.find(
              item =>
                item.id ===
                button.dataset.id
            );

          if(!chapter){
            return;
          }

          const action =
            button.dataset.action;

          /* =================================================
             LECTURE
             ================================================= */

          if(
            action ===
            "lecture"
          ){

            const index =
              Number(
                button.dataset.index
              );

            chapter.completedLectures =
              (
                index + 1 ===
                chapter.completedLectures
              )
                ? index
                : index + 1;

            chapter.completedLectures =
              Math.min(
                chapter.completedLectures,
                chapter.totalLectures
              );

            save();

            /*
              First update the chapter card.
            */
            updateChapterCard(
              button.closest(
                ".chapter"
              ),
              chapter
            );

            /*
              Then immediately calculate the TOP
              stats from the visible chapter cards.
            */
            updateVisibleStats();

            return;

          }

          /* =================================================
             CONFIDENCE
             ================================================= */

          if(
            action ===
            "confidence"
          ){

            const value =
              Number(
                button.dataset.value
              );

            chapter.confidence =
              chapter.confidence ===
              value
                ? 0
                : value;

            save();

            updateChapterCard(
              button.closest(
                ".chapter"
              ),
              chapter
            );

            /*
              Confidence average also updates immediately.
            */
            updateVisibleStats();

            return;

          }

          /* =================================================
             RENAME
             ================================================= */

          if(
            action ===
            "rename"
          ){

            const nextName =
              prompt(
                "Rename chapter:",
                chapter.name
              );

            if(
              nextName ===
              null
            ){

              return;

            }

            const clean =
              nextName.trim();

            if(!clean){

              return;

            }

            chapter.name =
              clean;

            save();

            render();

            return;

          }

          /* =================================================
             EDIT TOTAL
             ================================================= */

          if(
            action ===
            "edit-total"
          ){

            const raw =
              prompt(
                "Total lectures:",
                chapter.totalLectures
              );

            if(
              raw ===
              null
            ){

              return;

            }

            const total =
              parseInt(
                raw,
                10
              );

            if(
              !Number.isFinite(total) ||
              total < 1
            ){

              return;

            }

            chapter.totalLectures =
              Math.min(
                total,
                1000
              );

            chapter.completedLectures =
              Math.min(
                chapter.completedLectures,
                chapter.totalLectures
              );

            save();

            render();

            return;

          }

          /* =================================================
             DELETE
             ================================================= */

          if(
            action ===
            "delete"
          ){

            if(
              !confirm(
                "Delete this chapter?"
              )
            ){

              return;

            }

            yearData.chapters =
              yearData.chapters.filter(
                item =>
                  item.id !==
                  chapter.id
              );

            save();

            render();

          }

        }
      );

    }

  }

}

/* =========================================================
   IMPORT FILE
   ========================================================= */

document
  .getElementById(
    "importFile"
  )
  .addEventListener(
    "change",
    event=>{

      const file =
        event.target.files?.[0];

      if(file){

        importData(
          file
        );

      }

      event.target.value =
        "";

    }
  );

/* =========================================================
   BACKGROUND FILE
   ========================================================= */

document
  .getElementById(
    "bgFile"
  )
  .addEventListener(
    "change",
    event=>{

      const file =
        event.target.files?.[0];

      if(!file){
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        event=>{

          const image =
            new Image();

          image.onload =
            async()=>{

              const max =
                1800;

              const scale =
                Math.min(
                  1,
                  max /
                  image.width
                );

              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                Math.round(
                  image.width *
                  scale
                );

              canvas.height =
                Math.round(
                  image.height *
                  scale
                );

              const context =
                canvas.getContext(
                  "2d"
                );

              context.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
              );

              state.background =
                canvas.toDataURL(
                  "image/jpeg",
                  .8
                );

              applyBackground();

              try{

                await dbSet(
                  BACKGROUND_KEY,
                  state.background
                );

                await cloudSave();

              }catch(error){

                alert(
                  "That image could not be saved. Try a smaller photo."
                );

              }

            };

          image.src =
            event.target.result;

        };

      reader.readAsDataURL(
        file
      );

      event.target.value =
        "";

    }
  );

/* =========================================================
   CLOSE QUICK MENU
   ========================================================= */

document.addEventListener(
  "click",
  event=>{

    const menu =
      document.getElementById(
        "quickMenu"
      );

    const button =
      document.getElementById(
        "quickAdd"
      );

    if(
      menu &&
      menu.classList.contains(
        "open"
      ) &&
      !menu.contains(
        event.target
      ) &&
      event.target !==
        button
    ){

      menu.classList.remove(
        "open"
      );

    }

  }
);

/* =========================================================
   SERVICE WORKER
   ========================================================= */

if(
  "serviceWorker" in
  navigator
){

  window.addEventListener(
    "load",
    ()=>{

      navigator.serviceWorker
        .register(
          "./service-worker.js"
        )
        .catch(
          error=>{

            console.warn(
              "Service worker registration failed:",
              error
            );

          }
        );

    }
  );

}

/* =========================================================
   INIT
   ========================================================= */

(async function(){

  await loadLocal();

  applyBackground();

  render();

  await initAuth();

})();

})();
